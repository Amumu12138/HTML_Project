<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS变量</title>
    <style>
        /* body {
            --size: 300px;
            --item-size: 15px;
        } */

        :root {
            --size: 300px;
            --item-size: 15px;
        }

        .container {
            /* 使用 */
            width: var(--size);
            height: var(--size);
            background-color: black;
            padding: 12px;
            /* 计算 */
            margin: calc(var(--size) * 0.1);
        }

        .container .item {
            width: var(--item-size);
            height: var(--item-size);
            background-color: red;
        }

        @property --direc {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false
        }

        @keyframes spin {
            to {
                --direc: 360deg;
            }
        }

        .card {
            width: 400px;
            height: 400px;
            border-radius: 8px;
            background-image: linear-gradient(var(--direc),
                    #5ddcff,
                    #3c67e3 43%,
                    #4e00c2);
            animation: spin 3s linear infinite;
        }



        .form-block:focus-within {
            background: #409eff30;
        }

        .label span:has(+input[required])::after {
            content: "*";
            color: red;
        }

        .content::first-letter {
            color: red;
            font-size: 10em;
            font-weight: bold;
        }

        .content::selection {
            background: skyblue;
            text-decoration: underline;
        }

        .flex {
            display: flex;
            width: 200px;
            height: 200px;
            background-color: #ccc;
        }

        .flex .item {
            margin: auto;
            background: #f00;
            width: 20px;
            height: 20px;
            border: 1px solid #222;
        }

        .grid {
            display: flex;
            flex-wrap: wrap;
            width: 200px;
            height: 200px;
            background-color: #ccc;
        }

        .grid .item {
            --num: 5;
            --size: 20px;
            --gap: calc((100% - 20px * var(--num)) / var(--num) / 2);
            margin: 10px var(--gap);
            box-sizing: border-box;
            background: #f00;
            width: var(--size);
            height: var(--size);
            border: 1px solid #222;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item"></div>
    </div>

    <div class="card">
    </div>
    <br />
    <input class="form-block" type="text" />
    <br>
    <form>
        <label class="label">
            <span>账号</span>
            <input required type="text" />
        </label>
        <br />
        <label class="label">
            <span>密码</span>
            <input type="text" />
        </label>
    </form>
    <br />
    <div class="content">
        This is content text
    </div>

    /* flex + margin */
    <div class="flex">
        <div class="item"></div>
    </div>
    <br>
    <div class="grid">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
    </div>
</body>

</html>
