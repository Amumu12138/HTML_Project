<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>filter滤镜</title>
    <style>
        body {
            background-color: white;
        }

        img {
            position: absolute;
            top: 0;
            left: 0;
            width: 300px;
            filter: drop-shadow(10px 10px 10px rgba(0, 0, 0, 0.5))
        }
    </style>
</head>

<body>

    <img src="./clip-path.png" alt="clip-path">
</body>

</html>
