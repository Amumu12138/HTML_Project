<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            margin: 0 auto;
            background-color: #14100f;
        }

        .box {
            cursor: pointer;
            display: block;
            width: 400px;
            /* height: 400px; */
            /* clip-path: circle(100% at 100% 100%); */
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            transition: 0.5s;
        }

        .container:hover .box {
            clip-path: polygon(100% 0%, 100% 100%, 0% 100%, 0% 0%);
        }

        .box-ellipse {
            cursor: pointer;
            display: block;
            width: 400px;
            transition: 0.5s;
            clip-path: ellipse(50% 20% at 50% 50%);
            animation: wink 3s infinite;
        }


        @keyframes wink {
            15% {
                clip-path: ellipse(50% 1% at 50% 50%);
            }

            30% {
                clip-path: ellipse(50% 20% at 50% 50%);
            }

            45% {
                clip-path: ellipse(50% 1% at 50% 50%);
            }

            70% {
                clip-path: ellipse(50% 40% at 50% 50%);
            }
        }

        .slide-down {
            color: #fff;
            font-size: 5em;
            animation: slideDown 2s infinite;
        }

        @keyframes slideDown {
            0% {
                clip-path: inset(100% 0% 0% 0%);
                transform: translateY(-100%);
            }

            100% {
                clip-path: inset(0% 0% 0% 0%);
            }
        }
    </style>
</head>

<body>
    <!-- 菱形变换为矩形 -->
    <div class="container">
        <img class="box" src="./clip-path.png" alt="clip-path" />
    </div>
    <!-- 椭圆:眨眼效果 -->
    <div class="container">
        <img class="box-ellipse" src="./clip-path.png" alt="clip-path" />
    </div>
    <!-- 文字下落效果 -->
    <div class="container">
        <h1 class="slide-down">文字下落效果</h1>
    </div>
</body>

</html>
