<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实现样式隔离和自定义事件</title>
    <style>
        p {
            color: red;
        }
    </style>
</head>

<body>
    <h1>实现样式隔离和自定义事件</h1>
    <div class="container">
        <p>container</p>
        <div class="isolation">
            <!-- <style>
                p {
                    text-decoration: dashed underline;
                }
            </style>
            <p>isolation</p> -->
            <slot>123</slot>
        </div>

        <input class="checkbox" type="checkbox" onchange="handleChange" />
    </div>
    </div>

    <script>
        // shadowDom
        const isolationDiv = document.querySelector('.isolation');
        isolationDiv.attachShadow({ mode: 'open' })
        isolationDiv.shadowRoot.innerHTML = `
            <style>
                p {
                    text-decoration: dashed underline;
                }
            </style>
            <p>isolation</p>
        `

        // 自定义事件
        const checkboxDom = document.querySelector('.checkbox')

        checkboxDom.addEventListener('change', e => {
            console.log('change event', e);
        })
        function handleChange() {
            console.log('handleChange called');

            const e = new CustomEvent('change', {
                detail: { checked: false }
            })
            checkboxDom.dispatch(e)
        }
    </script>
</body>

</html>
