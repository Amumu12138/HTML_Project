<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas中绘制和拖动</title>
    <style>
        input {
            text-align: center;
        }

        canvas {
            margin: 0 auto;
            height: 500px;
            width: 500px;
            background-color: #999;
        }
    </style>
</head>

<body>
    <input type="color" />
    <br />
    <canvas></canvas>
    <script>
        const colorPicker = document.querySelector('input')
        const cvs = document.querySelector('canvas')
        const ctx = cvs.getContext('2d')

        function init() {
            const w = 500, h = 300
            cvs.width = w * devicePixelRatio;
            cvs.height = h * devicePixelRatio;
            cvs.style.width = `${w}px`
            cvs.style.height = `${h}px`
        }

        init()

        class ReactAngle {
            constructor(color, startX, startY) {
                this.color = color
                this.startX = startX
                this.startY = startY
                this.endX = startX
                this.endY = startY
            }

            get minX() {
                return Math.min(this.startX, this.endX)
            }

            get maxX() {
                return Math.max(this.startX, this.endX)
            }

            get minY() {
                return Math.min(this.startY, this.endY)
            }

            get maxY() {
                return Math.max(this.startY, this.endY)
            }

            draw() {
                ctx.beginPath()
                ctx.moveTo(this.startX * devicePixelRatio, this.minY * devicePixelRatio)
                ctx.lineTo(this.maxX * devicePixelRatio, this.minY * devicePixelRatio)
                ctx.lineTo(this.maxX * devicePixelRatio, this.maxY * devicePixelRatio)
                ctx.lineTo(this.minX * devicePixelRatio, this.maxY * devicePixelRatio)
                ctx.lineTo(this.minX * devicePixelRatio, this.minY * devicePixelRatio)
                ctx.fillStyle = this.color
                ctx.fill()
                ctx.strokeStyle = "#fff"
                ctx.lineCap = "square"
                ctx.lineWidth = 1 * devicePixelRatio
                ctx.stroke()
            }

            isInside(x, y) {
                return x >= this.minX && x <= this.maxX && y >= this.minY && y <= this.maxY;
            }
        }

        function drawReactangle(color, endX, endX) {
            const react = new ReactAngle(color, 0, 0)
            react.endX = endX
            react.endY = endX
            react.draw()
        }

        const shapes = []
        cvs.onmousedown = e => {
            const rect = cvs.getBoundingClientRect()
            const clickX = e.clientX - rect.left
            const clickY = e.clientY - rect.top

            const shape = getShape(clickX, clickY)
            console.log(shape, 'shape');

            // 点击已有图形,则选择拖动
            if (shape) {
                const { startX, startY, endX, endY } = shape
                console.log(startX, startY, endX, endY, 'shape');
                window.onmousemove = e => {
                    const disX = e.clientX - rect.left - clickX
                    const disY = e.clientY - rect.top - clickY

                    shape.startX = startX + disX
                    shape.endX = endX + disX
                    shape.startY = startY + disY
                    shape.endY = endY + disY
                }
            } else {
                // 该区域未有图形,则创建新图形
                const shape = new ReactAngle(colorPicker.value, clickX, clickY)
                shapes.push(shape)
                window.onmousemove = e => {
                    shape.endX = e.clientX - rect.left
                    shape.endY = e.clientY - rect.top
                    // shape.draw()
                }
            }

            window.onmouseup = () => {
                window.onmousemove = null;
                window.onmouseup = null;
            }
        }

        function draw() {
            requestAnimationFrame(draw)
            ctx.clearRect(0, 0, cvs.width, cvs.height)
            for (const s of shapes) {
                s.draw()
            }
        }

        draw()

        function getShape(x, y) {
            for (let i = shapes.length - 1; i >= 0; i--) {
                const s = shapes[i]
                if (s.isInside(x, y)) {
                    return s
                }
            }

            return null
        }

        // const react = new ReactAngle("#f00", 0, 0)
        // react.endX = 300
        // react.endY = 300
        // react.draw()
    </script>
</body>

</html>
