<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>canvas入门</title>
    <style>
        canvas {
            width: 1000px;
            height: 1000px;
            background-color: #111;
        }
    </style>
</head>

<body>
    <canvas>

    </canvas>
    <script>
        const cvs = document.querySelector('canvas');
        const ctx = cvs.getContext('2d')
        console.log(ctx, 'ctx');


        function init() {
            cvs.width = window.innerWidth * devicePixelRatio;
            cvs.height = window.innerHeight * devicePixelRatio;
        }

        init()
        // 绘制线条
        // ctx.beginPath()
        // ctx.moveTo(100, 50)
        // ctx.lineTo(200, 100)
        // ctx.lineTo(300, 300)
        // ctx.closePath()
        // ctx.strokeStyle = "#fff"
        // ctx.stroke()
        // // 区域填充
        // ctx.fill()

        // // 绘制圆形
        // ctx.beginPath()
        // ctx.arc(100, 50, 5, 0, 2 * Math.PI)
        // ctx.fillStyle = "#fff"
        // ctx.fill()

        // ctx.beginPath()
        // ctx.arc(300, 300, 6, 0, 2 * Math.PI)
        // ctx.fillStyle = "#fff"
        // ctx.fill()

        function getRandom(min, max) {
            return Math.floor(Math.random() * (max + 1 - min) + min);
        }

        // 绘制圆点类
        class Point {
            constructor() {
                this.r = 5;
                this.x = getRandom(0, cvs.width - this.r / 2)
                this.y = getRandom(0, cvs.height - this.r / 2)
                this.xSpeed = getRandom(-50, 50)
                this.ySpeed = getRandom(-50, 50)
                this.lastDrawTime = null
            }

            draw() {
                if (this.lastDrawTime) {
                    // 计算新的坐标
                    const duration = (Date.now() - this.lastDrawTime) / 1000;

                    const xDis = this.xSpeed * duration;
                    const yDis = this.ySpeed * duration;
                    let x = this.x + xDis
                    let y = this.y + yDis
                    console.log(cvs.height, cvs.width, 'cvs');

                    if (x > cvs.width - this.r / 2) {
                        x = cvs.width - this.r / 2
                        this.xSpeed = -this.xSpeed
                    } else if (x < 0) {
                        x = 0
                        this.xSpeed = -this.xSpeed
                    }

                    if (y > cvs.height - this.r / 2) {
                        y = cvs.height - this.r / 2
                        this.ySpeed = -this.ySpeed
                    } else if (y < 0) {
                        y = 0
                        this.ySpeed = -this.ySpeed
                    }

                    this.x = x
                    this.y = y
                }


                ctx.beginPath()
                ctx.arc(this.x, this.y, this.r, 0, 2 * Math.PI)
                ctx.fillStyle = "#fff"
                ctx.fill()

                this.lastDrawTime = Date.now()
            }
        }

        // const p1 = new Point()
        // console.log(p1, 'p1');

        // p1.draw()

        // const p2 = new Point()
        // p2.draw()

        // 绘制图类
        class Graph {
            constructor(pointNumber = 30, maxDis = 500) {
                this.points = new Array(pointNumber).fill(0).map(() => new Point())
                this.maxDis = maxDis;
            }

            draw() {
                requestAnimationFrame(() => {
                    this.draw()
                })
                // 将整张画布清空
                ctx.clearRect(0, 0, cvs.width, cvs.height)
                for (let index = 0; index < this.points.length; index++) {
                    const p = this.points[index]
                    p.draw()
                    for (let j = index + 1; j < this.points.length; j++) {
                        const p2 = this.points[j]
                        const d = Math.sqrt((p.x - p2.x) ** 2 + (p.y - p2.y) ** 2)

                        console.log(d, 'd');
                        if (d > this.maxDis) {
                            continue;
                        }

                        ctx.beginPath()
                        ctx.moveTo(p.x, p.y)
                        ctx.lineTo(p2.x, p2.y)
                        ctx.closePath()
                        ctx.strokeStyle = `rgba(200, 200, 200, ${1 - d / this.maxDis})`
                        ctx.stroke()
                        // 区域填充
                        ctx.fill()
                    }
                }
            }
        }

        const graph = new Graph()
        graph.draw();
    </script>
</body>

</html>
