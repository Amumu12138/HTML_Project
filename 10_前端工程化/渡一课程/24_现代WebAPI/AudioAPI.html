<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioAPI</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            background-color: black;
            text-align: center;
        }

        canvas {
            margin: 0 auto;
        }

        audio {
            position: fixed;
            bottom: 20%;
            left: 30%;
        }
    </style>
</head>

<body>

    <canvas></canvas>
    <audio src="./audio/music.mp3" controls></audio>
    <script>
        const audioEle = document.querySelector('audio')
        const cvs = document.querySelector('canvas')
        const ctx = cvs.getContext('2d')

        // 初始化canvas尺寸
        function initCvs() {
            const size = 500
            cvs.width = size * devicePixelRatio
            cvs.height = size * devicePixelRatio
            cvs.style.width = cvs.style.height = `${size}px`
        }

        initCvs()

        function draw(datas, maxValue) {
            ctx.clearRect(0, 0, cvs.width, cvs.height)
            // 圆心坐标
            const centerX = cvs.width / 2;
            const centerY = cvs.height / 2;
            // 半径
            const radius = 300;

            // 点的数量，控制圆形的精细程度
            const numPoints = maxValue;

            for (let i = 0; i < numPoints; i++) {
                // 计算每个点的角度
                const angle = (i / numPoints) * 2 * Math.PI;
                // 计算每个点的坐标
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                ctx.fillStyle = "#fff"
                // 绘制点
                ctx.fillRect(x, y, datas[i], datas[i]);
            }
        }

        draw(new Array(255).fill(2), 255)

        let isInit = false
        let analyser
        let buffer

        // 监听音频播放事件
        audioEle.onplay = function () {
            if (isInit) {
                return
            }

            const audioCtx = new AudioContext()
            // 创建一个音频分析器节点
            analyser = audioCtx.createAnalyser()
            analyser.fftSize = 512
            buffer = new Uint8Array(analyser.frequencyBinCount)

            const source = audioCtx.createMediaElementSource(audioEle)
            source.connect(analyser)
            analyser.connect(audioCtx.destination)

            isInit = true;
        }

        function update() {
            requestAnimationFrame(update)
            if (!isInit) {
                return
            }

            analyser.getByteFrequencyData(buffer)
            console.log(buffer);
            const offset = Math.floor((buffer.length * 2) / 3)
            const datas = new Array(offset * 2)
            for (let index = 0; index < offset; index++) {
                datas[index] = datas[datas.length - index - 1] = buffer[index]
            }

            draw(datas, 255)
        }

        update()
    </script>
</body>

</html>
