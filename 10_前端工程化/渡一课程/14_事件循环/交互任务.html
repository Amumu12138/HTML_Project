<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互任务</title>
</head>

<body>
    <h1>交互任务</h1>
    <button id="begin">开始</button>
    <button id="interaction">添加交互任务</button>
    <script>
        function delay(duration) {
            let start = Date.now()
            while (Date.now() - start < duration) { }
        }

        function addDelay() {
            console.log('添加延时队列');
            setTimeout(() => {
                console.log('延时队列执行');
            }, 0)
            delay(2000)
        }

        function addInteraction() {
            console.log('添加交互队列');
            interaction.onclick = () => {
                console.log('交互队列执行');
            };
            delay(2000)
        }

        begin.onclick = function () {
            addDelay()
            addInteraction()
        }
    </script>
</body>

</html>
