<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vue组件入门</title>

    <!-- 导入样式 -->
    <link rel="stylesheet" href="//unpkg.com/element-plus/dist/index.css" />
    <!-- 导入 Vue 3 -->
    <script src="//unpkg.com/vue@3"></script>
    <!-- 导入组件库 -->
    <script src="//unpkg.com/element-plus"></script>
    <script src="//unpkg.com/@element-plus/icons-vue"></script>
</head>

<body>
    <h1>vue组件入门</h1>
    <div id="app">
        <star-rate></star-rate>
        <star-rate></star-rate>
        <star-rate></star-rate>
        <el-button type="primary">按钮</el-button>
    </div>
    <script>
        const App = {
            data() {
                return {

                };
            },
        };

        const starRate = {
            template: `
                <div>
                    <el-icon size="16px">
                        <star-filled />
                    </el-icon>
                    <el-icon size="16px">
                        <star-filled />
                    </el-icon>
                    <el-icon size="16px">
                        <star-filled />
                    </el-icon>
                    <el-icon size="16px">
                        <star />
                    </el-icon>
                    <el-icon size="16px">
                        <star />
                    </el-icon>
                </div>
            `
        }
        const app = Vue.createApp(App);
        // 使用ElementPlus
        app.use(ElementPlus);

        // 全局注册组件
        app.component('star-rate', starRate)
        console.log(ElementPlusIconsVue, 'ElementPlusIconsVue');

        // 全局注册ElementPlusIcon图标
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            // console.log(key, component);
            app.component(key, component)
        }

        app.mount("#app");
    </script>
</body>

</html>
