<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实现渲染函数render</title>
</head>

<body>
    <h1 id="renderer">实现渲染函数render</h1>
    <script>
        /**
         * @vnode 虚拟 DOM 对象
         * @container 一个真实 DOM 元素，作为挂载点，渲染器会把虚拟 DOM 渲染到该挂载点
         */
        function renderer(vnode, container) {
            const el = document.createElement(vnode.tag);
            console.log('el', el);
            if (!vnode?.props || !Object.entries(vnode.props)?.length) {
                return;
            }
            // 遍历vnode.props，将属性 事件添加到DOM上
            for (const [key, value] of Object.entries(vnode.props)) {
                console.log(key, value);
                // 如果是事件,则处理函数
                if (/^on/.test(key)) {
                    // 添加监听事件
                    el.addEventListener(
                        key.substr(2).toLowerCase(),
                        value
                    )
                }

                // 添加属性
                el.setAttribute(key, value);
            }

            if (typeof vnode.children === 'string') {
                // 如果 children 是字符串，说明它是元素的文本子节点
                el.appendChild(document.createTextNode(vnode.children));
            } else if (Array.isArray(vnode.children)) {
                // 递归的方式调用 renderer 函数渲染子节点，挂载在 el 元素下
                vnode.children.forEach(element => {
                    renderer(element, el)
                });
            }

            // 将元素添加到挂载节点下
            container.appendChild(el);
        }

        // 虚拟DOM节点信息
        const vnode = {
            tag: 'h1',
            props: {
                text: '123',
                onClick: () => { console.log('click called') }
            },
            // children: [{
            //     tag: 'span'
            // }]
            children: "Click"
        }

        const rendererDom = document.getElementById('renderer')
        renderer(vnode, rendererDom)
    </script>
</body>

</html>
