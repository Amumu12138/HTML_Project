<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Axios</title>
    <script src="../../libs/vue.js"></script>
    <script src="../../libs/axios/axios.min.js"></script>
</head>

<body>
   <input type="button" value="get请求" class="get">
   <input type="button" value="post请求" class="post">
    <br>
    <div id="app">
        <input type="button" value="请求笑话" @click="getJoke">
        <p>{{ joke }}</p>
        <input type="button" value="测试this" @click="test">
    </div>   
    <script>
       /*
        接口1: 随机笑话
        请求地址：https://autumnfish.cn/api/joke/list
        请求方法：get
        请求参数：num(笑话条数：数字类型)
        响应内容：随机笑话
       */
      document.querySelector(".get").onclick = function() {
          axios.get("https://autumnfish.cn/api/joke/list?num=6")
          .then(function(response){
              console.log(response);
          }, function(error){
              console.log(error);
          });
      }

      /*
        接口2: 用户注册
        请求地址 https://autumnfish.cn/api/user/reg
        请求方法：post
        请求参数：username(用户名：字符串类型)
        响应内容：注册成功或失败
      */
      document.querySelector(".post").onclick = function() {
          axios.post("https://autumnfish.cn/api/user/reg", {username: "Amumu12138"})
          .then(function(response){
            console.log(response);
          }, function(error){
            console.log(error);
          });
      }  

      var app =  new Vue({
            el: "#app",
            data: {
                joke: "Joke"
            },
            methods: {
                getJoke: function() {
                    var self = this;
                    axios.get("https://autumnfish.cn/api/joke").then(function(data){
                        self.joke = data.data;
                        console.log("getJoke this = ", this);
                        console.log("getJoke self = ", self);
                    }, function(error){

                    });
                },
                test: function() {
                    console.log("before this = ", this);
                    var url = "https://autumnfish.cn/song/url?id=1"
                    axios.get(url).then((retData) => {
                        console.log("after this = ", this);
                        console.log("retData = ", retData);
                    }, (error) => {

                    });
                }
            }
      });
    </script>
</body>

</html>
