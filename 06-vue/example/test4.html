<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 插槽 + 自定义方法</title>

    <script src="../libs/vue.js"> </script>
</head>
<body>
    <div id="app">
        <todo>
            <todo-title slot="todo-title" v-bind:title="title"></todo-title>
            <todo-items slot="todo-items" v-for="(item, index) in todoItems" v-bind:item="item" 
            v-bind:index="index" v-on:remove="removeTodoItem(index)"></todo-items>
        </todo>
    </div>
    <script>
        //新建插槽组件
        Vue.component("todo", {
            template: '<div>\
                            <slot name="todo-title"></slot>\
                            <ul>\
                                <slot name="todo-items"></slot>\
                            </ul>\
                        </div>'
        });

        //标题组件
        Vue.component("todo-title", {
            props: ["title"],
            template: '<div>{{title}}</div>'
        });

        //列表选项组件
        Vue.component("todo-items", {
            props: ["item"],
            template: '<li>{{item}} <button v-on:click="removeItem">删除</button></li>',
            methods: {
                //在列表组件中删除index指定的元素
                removeItem: function(index) {
                    //绑定remove自定义事件
                    this.$emit("remove", index);
                }
            }
        });

        var app = new Vue({
            el: "#app",
            data: {
                title: "Amumu12138程序课程",
                todoItems: ["Java", "Linux", "JQuery"]
            },
            methods: {
                //删除todoItems数组中第一个元素
                removeTodoItem: function(index) {
                    this.todoItems.splice(index, 1);
                }
            }
        });
    </script>
</body>
</html>
