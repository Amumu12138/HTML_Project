<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3、Vue实例</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        {{message}}
    </div>
    <script>
        var data = {
            a: '1'
        }

        var vm = new Vue({
            el: '#app',
            data() {
                return {
                    message: '我是你爸爸',
                    data: data
                }
            },
            watch: {
                data(newVlaue, oldValue) {
                    console.log('AMumu neibu newValue', newVlaue, ' oldValue = ', oldValue)
                }
            }
        })
        vm.$watch('data', function (newValue, oldValue) {
            console.log('newValue = ', newValue, ' oldValue = ', oldValue)
        })
    </script>
</body>

</html>
