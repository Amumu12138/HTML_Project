<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22、动态组件&异步组件</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        currentTabComponent: {{currentTabComponent}}
        <component v-bind:is="currentTabComponent"></component>
        <button @click="onChangeTab('tab01')">tab01</button>
        <button @click="onChangeTab('tab02')">tab02</button>
        <p>在动态组件上使用 keep-alive</p>
        <!-- 失活的组件将会被缓存！-->
        <keep-alive>
            <component v-bind:is="currentTabComponent"></component>
        </keep-alive>
        <button @click="onChangeTab('tab01')">tab03</button>
        <button @click="onChangeTab('tab02')">tab04</button>
        <p>异步组件</p>
        <async-example></async-example>
    </div>
    <script>
        Vue.component('tab01', {
            template: `
                <div>
                    this is tab01
                    count: {{count}}
                    <button @click="count++"> add </button>
                </div>
            `,
            data() {
                return {
                    count: 0
                }
            }
        })

        Vue.component('tab02', {
            template: `
                <div>
                    this is tab02
                </div>
            `
        })


        Vue.component('async-example', function (resolve, reject) {
            setTimeout(function () {
                // 向 `resolve` 回调传递组件定义
                resolve({
                    template: '<div>I am async!</div>'
                })
            }, 1000)
        })

        var vm = new Vue({
            el: "#app",
            data: {
                currentTabComponent: "tab01"
            },
            methods: {
                onChangeTab(tabName) {
                    this.currentTabComponent = tabName;
                }
            }
        })
    </script>
</body>

</html>
