<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17、prop</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <!-- 在 HTML 中是 kebab-case 的 -->
        <p>在 HTML 中是 kebab-case 的 </p>
        <blog-post title="hello!" :likes="222" is-published :comment-ids="[1,2,3]"></blog-post>
    </div>
    <script>
        Vue.component('blog-post', {
            // 在 JavaScript 中是 camelCase 的
            template: '<h3>title: {{ title }} likes: {{likes}} isPublished: {{isPublished}} commentIds: {{commentIds}} </h3>',
            props: {
                title: String,
                likes: Number,
                isPublished: Boolean,
                commentIds: Array,
                author: Object,
                callback: Function,
                contactsPromise: Promise // or any other constructor
            },
            data() {
                return {
                    isFlag: true
                }
            }
        })

        var vm = new Vue({
            el: "#app",
            data: {
                isFlag: true
            }
        })
    </script>
</body>

</html>
