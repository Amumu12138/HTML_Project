<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23、处理边界情况01</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <my-button></my-button>
        <p>访问子组件实例或子元素</p>
        <base-input ref="usernameInput"></base-input>
        <p>依赖注入</p>
        <container>
            <test-button></test-button>
        </container>
    </div>
    <script>
        // base-input 组件
        Vue.component('BaseInput', {
            template: `
                <div>
                    <input ref="input"/>
                </div>
            `,
            data() {
                return {
                    aaa: 'aaa'
                }
            },
            methods: {
                // 用来从父级组件聚焦输入框
                focus: function () {
                    this.$refs.input.focus()
                }
            }
        })

        // container 根组件
        Vue.component('container', {
            template: `
                <div>
                    <p> count: {{count}}</p>
                    <slot></slot>
                </div>
            `,
            // 依赖注入
            provide() {
                return {
                    addCount: this.addCount,
                    getCount: this.count
                }
            },
            data() {
                return {
                    count: 0
                }
            },
            methods: {
                addCount() {
                    this.count++;
                }
            }
        })

        // test-button 组件
        Vue.component('test-button', {
            template: `
                <div>
                <button @click="testClick">test</button>
                    </div>
            `,
            inject: ['addCount', 'getCount'],
            methods: {
                testClick() {
                    this.addCount()
                    alert(this.getCount)
                }
            }
        })

        //my-button 子组件
        Vue.component('my-button', {
            template: `
                <div>
                    <div>parent foo: {{parent.foo}}</div>
                <button @click="myClick">{{name}}</button>
                </div>
            `,
            data() {
                return {
                    name: '点击显示$parent',
                    parent: ''
                }
            },
            methods: {
                myClick() {
                    this.parent = this.$parent;
                    console.log('my-button myClick parent --> ', this.$parent);
                }
            }
        })

        var vm = new Vue({
            el: "#app",
            data: {
                foo: 1
            },
            computed: {
                bar: function () { return this.foo; }
            },
            methods: {
                baz: function () {
                    console.log('foo -->', this.$root.foo);
                }
            },
            mounted() {
                console.log('mouted $root -->', this.$root);
                console.log('mounted $refs.usernameInput -->', this.$refs.usernameInput.aaa)
                this.$refs.usernameInput.focus();
                this.baz();
            }
        })

        console.log("vm ==> $root --->", vm)
    </script>
</body>

</html>
