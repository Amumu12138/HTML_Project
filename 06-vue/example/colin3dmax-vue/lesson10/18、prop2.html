<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18、prop2</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <p>单向数据流 - 1、定义一个本地的 data property 并将这个 prop 用作其初始值</p>
        <test-com initial-counter="123"></test-com>
        <p>2、使用这个 prop 的值来定义一个计算属性</p>
        <test-com-02 size=" ASCDEFg"></test-com-02>
        <p>prop验证</p>
        <my-component :prop-a="123" prop-c prop-f="success"> </my-component>
        <p>禁用 Attribute 继承</p>
        <base-input label="name" value="Amumu" required placeholder="Enter your username"></base-input>
    </div>
    <script>
        Vue.component('test-com', {
            template: `
                <p>{{counter}}</p>
            `,
            props: ['initialCounter'],
            data: function () {
                return {
                    counter: this.initialCounter
                }
            }
        })

        Vue.component('test-com-02', {
            template: `
                <p>{{normalizedSize}}</p>
            `,
            props: ['size'],
            computed: {
                normalizedSize: function () {
                    return this.size.trim().toLowerCase()
                }
            }
        })

        Vue.component('my-component', {
            template: `
                <div>
                    <p>propA: {{propA}} propB: {{propB}} propC: {{propC}} propD: {{propD}}</p>
                    <p>propE: {{propE}} propF: {{propF}}</p>
                </div> 
            `,
            props: {
                // 基础的类型检查 (`null` 和 `undefined` 会通过任何类型验证)
                propA: Number,
                // 多个可能的类型
                propB: [String, Number],
                // 必填的字符串
                propC: {
                    type: String,
                    required: true
                },
                // 带有默认值的数字
                propD: {
                    type: Number,
                    default: 100
                },
                // 带有默认值的对象
                propE: {
                    type: Object,
                    // 对象或数组默认值必须从一个工厂函数获取
                    default: function () {
                        return { message: 'hello' }
                    }
                },
                // 自定义验证函数
                propF: {
                    validator: function (value) {
                        // 这个值必须匹配下列字符串中的一个
                        return ['success', 'warning', 'danger'].indexOf(value) !== -1
                    }
                }
            }
        })

        Vue.component('base-input', {
            inheritAttrs: false,
            props: ['label', 'value'],
            template: `
                <label>
                {{ label }}
                <input
                    v-bind="$attrs"
                    v-bind:value="value"
                    v-on:input="$emit('input', $event.target.value)"
                >
                </label>
            `
        })

        var am = new Vue({
            el: "#app",
            data: {

            }
        })
    </script>
</body>

</html>
