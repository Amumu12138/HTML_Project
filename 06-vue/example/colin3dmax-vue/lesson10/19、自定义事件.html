<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19、自定义事件</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <p>始终使用 kebab-case 的事件名</p>
        <my-component :post="post" v-on:my-event="doSomething"></my-component>
        <p>自定义组件 v-model的本质</p>
        <base-checkbox :checked="loginVue" v-on:change="onChange"></base-checkbox>
        loginVue : {{loginVue}}
        <br>
        <base-checkbox-02 v-model="loginVue02"></base-checkbox-02>
        loginVue02 : {{loginVue02}}
        <p>将原生事件绑定到组件</p>
        base-input
        <base-input v-on:focus.native="onFocus"></base-input>
        <p>解决父级.native监听器静默失败问题</p>
        <base-input-02 label="name" v-model="name" v-on:focus="onFocus02"></base-input-02>
        name: {{name}}
    </div>
    <script>
        Vue.component('my-component', {
            props: ['post'],
            template: `
                    <div class="blog-post" >
                    <h3> title: {{ post.title }}</h3>
                    <div v-html="post.content"></div>
                    <button v-on:click="$emit('my-event', 0.1)">
                        my-event
                    </button>
                    </div>
                    `
        })

        // 自定义组件的v-model
        Vue.component('base-checkbox', {
            template: `
            <input type="checkbox" v-bind:checked="checked" v-on:change="$emit('change', $event.target.checked)">
            `,
            props: {
                checked: Boolean
            }
        })

        Vue.component('base-checkbox-02', {
            template: `
            <input type="checkbox"  v-bind:checked="checked" v-on:input="$emit('change', $event.target.checked)">
            `,
            props: {
                checked: Boolean
            },
            model: {
                prop: 'checked',
                event: 'change'
            }
        })

        // 将原生事件绑定到组件
        Vue.component('base-input', {
            template: `
                <input v-bind="$attrs" />
            `,

        })

        Vue.component('base-input-02', {
            inheritAttrs: false,
            props: ['label', 'value'],
            computed: {
                inputListeners: function () {
                    var vm = this
                    // `Object.assign` 将所有的对象合并为一个新对象
                    return Object.assign({},
                        // 我们从父级添加所有的监听器
                        this.$listeners,
                        // 然后我们添加自定义监听器，
                        // 或覆写一些监听器的行为
                        {
                            // 这里确保组件配合 `v-model` 的工作
                            input: function (event) {
                                vm.$emit('input', event.target.value)
                            }
                        }
                    )
                }
            },
            template: `
                <label>
                {{ label }}
                <input
                    v-bind="$attrs"
                    v-bind:value="value"
                    v-on="inputListeners"
                >
                </label>
            `
        })
        var vm = new Vue({
            el: "#app",
            data: {
                post: {
                    title: "title",
                    content: "hello Amumu "
                },
                loginVue: true,
                loginVue02: false,
                name: "Amumu"
            },
            methods: {
                doSomething() {
                    console.log("doSomething called")
                },
                onChange(value) {
                    this.loginVue = value
                },
                onFocus() {
                    console.log('Amumu onFocus called')
                },
                onFocus02(event) {
                    console.log('Amumu onFocus02 called event', event)
                }
            }
        })
    </script>
</body>

</html>
