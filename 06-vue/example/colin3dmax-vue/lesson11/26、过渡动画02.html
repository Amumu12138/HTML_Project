<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26、过渡动画02</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        .custom-appear-active-class {
            color: #2fe26d;
            background: yellow;
            transition: all 1s ease;
        }

        .custom-appear-class {
            font-size: 40px;
            color: #e069e2;
            background: blue;
        }

        .custom-appear-to-class {
            color: #e29138;
            background: red;
        }

        /* 自定义动画 */
        .component-fade-enter {
            transform: translateX(-30px);
            opacity: 0;
        }

        .component-fade-enter-to {
            transform: translateX(0);
            opacity: 1;
        }

        .component-fade-leave {
            transform: translateX(0);
            opacity: 1;
        }

        .component-fade-leave-to {
            transform: translateX(30px);
            opacity: 0;
        }

        .component-fade-enter-active,
        .component-fade-leave-active {
            transition: all 1s ease;
        }
    </style>
</head>

<body>
    <div id="app">
        <p>
            初始渲染的过渡
        </p>
        <transition appear appear-class="custom-appear-class" appear-to-class="custom-appear-to-class"
            appear-active-class="custom-appear-active-class">
            <p>demo</p>
        </transition>
        <p>多个元素的过渡</p>
        <transition>
            <table v-if="items.length > 0">
                <tr v-for="(item, index) in items">
                    <td>{{index}}</td>
                    <td>{{item}}</td>
                </tr>
            </table>
            <p v-else>Sorry, no items found.</p>
        </transition>
        <p>多组件的过渡</p>
        <transition name="component-fade" mode="out-in">
            <component v-bind:is="view"></component>
        </transition>
        <button @click="toogleView"> click </button>
    </div>
    <script>
        Vue.component('btn-on', {
            template: `
                <div>
                <button> on </button>
                </div>
            `
        })

        Vue.component('btn-off', {
            template: `
                <div>
                <button> off </button>
                </div>
            `
        })
        var vm = new Vue({
            el: "#app",
            data: {
                show: true,
                items: [],
                view: 'btn-on'
            },
            methods: {
                toogleView() {
                    if (this.view === 'btn-on') {
                        this.view = 'btn-off'
                    } else {
                        this.view = 'btn-on'
                    }
                }
            }
        })
    </script>
</body>

</html>
