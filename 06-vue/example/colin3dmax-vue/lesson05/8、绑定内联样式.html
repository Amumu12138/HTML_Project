<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8、绑定内联样式</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
        <div>HELLO WORLD</div>
        <div v-bind:style="{ color: activeColor, 'font-size': fontSize + 'px' }">HELLO 2</div>

        <div v-bind:style="styleObject"> HELLO 3</div>

        <div :style="{ display: ['-webkit-box', '-ms-flexbox', 'flex'] }"> HELLO 4</div>
        <div :style="{ display: ['-webkit-box',] }"> HELLO 4</div>
        <div :style="{ display: [ '-ms-flexbox'] }"> HELLO 4</div>
    </div>
    <script>

        Vue.component('my-component', {
            template: '<p class="foo bar">Hi</p>'
        })

        var vm = new Vue({
            el: "#app",
            data: {
                activeColor: 'red',
                fontSize: 30,
                styleObject: {
                    color: 'green',
                    fontSize: '13px'
                }
            }
        })
    </script>
</body>

</html>
