<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9、条件渲染</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
        <h1 v-if="awesome">Vue is awesome!</h1>
        <h1 v-else>Oh no 😢</h1>

        <div v-if="type === 'A'">
            A
        </div>
        <div v-else-if="type === 'B'">
            B
        </div>
        <div v-else-if="type === 'C'">
            C
        </div>
        <div v-else>
            Not A/B/C
        </div>

        <template v-if="loginType === 'username'">
            <label>Username</label>
            <input placeholder="Enter your username">
        </template>
        <template v-else>
            <label>Email</label>
            <input placeholder="Enter your email address">
        </template>
        <br>
        <button @click="changeLoginType">change</button>

        <br>
        <template v-if="loginType02 === 'username'">
            <label>Username</label>
            <input key="username-input" placeholder="Enter your username">
        </template>
        <template v-else>
            <label>Email</label>
            <input key="email-input" placeholder="Enter your email address">
        </template>
        <br>
        <button @click="changeLoginType02">change02</button>
        <!-- v-show -->
        <h1 v-show="ok">Hello!</h1>
        <template v-show="ok">v-show</template>
        <br>
        <template v-if="ok">v-if</template>
    </div>
    <script>

        Vue.component('my-component', {
            props: ['text'],
            template: '<p class="foo bar">{{text}}</p>'
        })

        var vm = new Vue({
            el: "#app",
            data: {
                awesome: true,
                type: 'D',
                loginType: '',
                loginType02: '',
                ok: true
            },
            methods: {
                changeLoginType() {
                    this.loginType = this.loginType === 'username' ? 'email' : 'username'
                },
                changeLoginType02() {
                    this.loginType02 = this.loginType02 === 'username' ? 'email' : 'username'
                }
            }
        })
    </script>
</body>

</html>
