<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <!-- vuex -->
    <script src="https://unpkg.com/vuex@2.0.0"></script>
    <style>

    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        const store = new Vuex.Store({
            state: {
                todos: [
                    {
                        id: 1, text: '阅读', done: true
                    },
                    {
                        id: 2, text: '吃饭', done: true
                    },
                    {
                        id: 3, text: '睡觉', done: false
                    },
                    {
                        id: 4, text: '敲代码', done: true
                    }
                ]
            },
            getters: {
                todoDones: state => {
                    return state.todos.filter(todo => todo.done)
                },
                todoDoneCount: (state, getters) => {
                    return getters.todoDones.length
                },
                getTodoById: (state) => (id) => {
                    return state.todos.find(todo => todo.id === id)
                }
            }
        })

        const Counter = {
            template: `
                <div>
                    <p>今天已完成的事情总数：{{todoDoneCount}}</p>
                    <p>当前要完成的事情：{{currentTodo.text}}</p>
                    <ul>
                        <li v-for="item in todoDones" :key="item.id">{{item.text}}</li>
                    </ul>
                </div>
            `,
            computed: {
                // getTodoDones() {
                //     return this.$store.getters.todoDones;
                // },
                // getTodoDoneCount() {
                //     return this.$store.getters.todoDoneCount;
                // },
                currentTodo() {
                    return this.$store.getters.getTodoById(4)
                },
                // 使用mapGatters辅助函数
                ...Vuex.mapGetters(['todoDones', 'todoDoneCount'])
            }
        }

        const vm = new Vue({
            el: '#app',
            components: { Counter },
            store,
            template: `
            <div>
                <counter></counter>
            </div> 
            `
        })

    </script>
</body>

</html>
