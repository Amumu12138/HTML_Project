<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8、Vuex中的Actions</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <!-- vuex -->
    <script src="https://unpkg.com/vuex@2.0.0"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
        <p>同步加-mutations </p>
        <p>count: {{count}}</p>
        <input type="button" value="subCount" @click="incrementAsyncMutation">
        <p>异步加载-actions</p>
        <p>coun02:{{count02}}</p>
        <input type="button" value="addCount02" @click="increment02AsyncAction">
        <p>actionA</p>
        <p>count: {{count}}</p>
        <input type="button" value="actionA" @click="actionA">
    </div>
    <script>
        const store = new Vuex.Store({
            state: {
                count: 0,
                count02: 2
            },
            mutations: {
                incrementMutation(state) {
                    state.count++;
                },
                incrementAsyncMutation(state) {
                    setTimeout(() => {
                        state.count--
                        console.log('Amumu after state -->', store.state.count)
                    }, 1000)
                },
                increment02Mutation(state) {
                    state.count02++
                },
                gotData(state, callFun) {
                    state.count++;
                    callFun()
                },

            },
            actions: {
                incrementAction(context) {
                    context.commit('increment');
                },
                increment02AsyncAction({ commit }) {
                    setTimeout(() => {
                        commit('increment02Mutation')
                    }, 3000)
                },
                getData({ commit }) {
                    console.log('Amumu commit -->', commit)
                    return new Promise((resolve, reject) => {
                        setTimeout(() => {
                            commit('incrementMutation');
                            resolve()
                        }, 2000)
                    })
                },
                // 假设getData() 和getOtherData()返回的是Promise
                async actionA({ dispatch, commit }) {
                    await dispatch('getData')
                    // commit('gotData', await getData())
                },
                async actionB({ dispatch, commit }) {
                    await dispatch('actionA')
                    commit('gotOtherData', await getOtherData())
                }
            }
        })

        const vm = new Vue({
            el: "#app",
            store,
            data: {

            },
            computed: {
                ...Vuex.mapState(['count', 'count02'])
            },
            methods: {
                ...Vuex.mapMutations(['incrementMutation', 'incrementAsyncMutation', 'increment02Mutation']),
                ...Vuex.mapActions(['incrementAction', 'increment02AsyncAction', 'actionA', 'actionB']),
            }
        })

        // console.log('AMumu before state -->', store.state.count);
        // store.dispatch("increment");
        // console.log('Amumu after state -->', store.state.count)


        console.log('AMumu before state -->', store.state.count);
        store.commit("incrementAsyncMutation");
        console.log('Amumu after state -->', store.state.count)

        // store.dispatch("increment02AsyncAction");

    </script>
</body>

</html>
