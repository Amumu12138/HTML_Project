<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12、表单处理</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <!-- vuex -->
    <script src="https://unpkg.com/vuex@2.0.0"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
        <h1>count: {{count}}</h1>
        <div>
            <span>v-model: </span>
            <input type="text" v-model="$store.state.count">
        </div>
        <div>
            <span>value+@input: </span>
            <input type="text" :value="count" @input="updateMessage">
        </div>
        <h1>count02: {{count02}}</h1>
        <div>
            <span>Vuex + v-model</span>
            <input type="text" v-model="count02">
        </div>
    </div>
    <script>
        const store = new Vuex.Store({
            strict: true,
            state: {
                count: 0,
                count02: 1
            },
            mutations: {
                increment(state) {
                    state.count++;
                },
                updateCount(state, value) {
                    state.count = value;
                },
                updateCount02(state, value) {
                    state.count02 = value;
                }
            }
        })

        const app = new Vue({
            el: '#app',
            store,
            data: {

            },
            computed: {
                ...Vuex.mapState(['count']),
                count02: {
                    get() {
                        return this.$store.state.count02;
                    },
                    set(value) {
                        this.$store.commit('updateCount02', value);
                    }
                }
            },
            methods: {
                updateMessage(e) {
                    this.$store.commit('updateCount', e.target.value);
                }
            }
        })

    </script>
</body>

</html>
