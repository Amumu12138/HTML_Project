<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11、Vuex中的插件</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <!-- vuex -->
    <script src="https://unpkg.com/vuex@2.0.0"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
    </div>
    <script>
        const myPlugin = store => {
            console.log('Amumu myPlugin installed')
            // 当store初始化后调用
            store.subscribe((mutation, state) => {
                console.log('Amumu myPlugin subscribe called mutation -->', mutation, ' state -->', state)
            })
        }

        const store = new Vuex.Store({
            state: {
                count: 1
            },
            mutations: {
                increment(state) {
                    state.count++
                }
            },
            plugins: [myPlugin]
        })

        store.commit('increment', { count: 0 })

    </script>
</body>

</html>
