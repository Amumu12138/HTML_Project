<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Test</title>

    <script src="../libs/vue.js"></script>
</head>
<body>
    <div id="app">
        选项：
        <select v-model="message">
            <option value="" id="test">---请选择---</option>
            <option id="testA">A</option>
            <option>B</option>
            <option>C</option>
        </select>
        打印:
        <span>{{message}}</span>
    </div>
    <!-- vue组件 -->
    <div id="app2">
        <test v-for="item in items" v-bind:qin="item"></test>
    </div>

    <script>
        var app = new Vue({
            el: "#app",
            data: {
                selected: "",
                message: ""
            },
            methods: {

            }
        })

        // console.log(document.getElementById("test").selected);
        // console.log(document.getElementById("test").value);
        console.log(document.getElementById("testA").selected);
    
        // vue 组件
        Vue.component("test", {
            props: ['qin'],
            template: '<li>{{qin}}</li>'
        });

        var app2 = new Vue({
            el: "#app2",
            data: {
                items: ["Java", "Linux", "JavaScript"]
            },
            methods: {

            }
        })
    </script>

</body>
</html>
