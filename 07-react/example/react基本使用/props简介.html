<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>props简介</title>

    <!-- 引入react核心库 -->
    <script src="../../js/react.development.js"></script>
    <!-- 引入react-dom, 用于支持react操作DOM -->
    <script src="../../js/react-dom.development.js"></script>
    <!-- 引入babel, 用于将jsx转换成js -->
    <script src="../../js/babel.min.js"></script>
    <!-- 引入prop-types-->
    <script src="../../js/prop-types.js"></script>
</head>

<body>
    <h1>props简介</h1>
    <div id="app"></div>
    <div id="test"></div>
    <script type="text/babel">
        class Person extends React.Component {
            // 静态方法实现: 对标签属性进行类型、必要性的限制
            static propTypes = {
                //  限制name必传,且为字符串
                name: PropTypes.string.isRequired,
                sex: PropTypes.string,
                age: PropTypes.number,
            }
            // 默认属性值
            static defaultProps = {
                name: 'name',
                sex: 'none',
                age: -1
            }
            render() {
                const { name, sex, age } = this.props;
                return (
                    <div>
                        姓名:{name} 性别: {sex} 年龄: {age}
                    </div>
                )
            }
        }

        // 对标签属性进行类型、必要性的限制
        // Person.propTypes = {
        //     //  限制name必传,且为字符串
        //     name: PropTypes.string.isRequired,
        //     sex: PropTypes.string,
        //     age: PropTypes.number,
        // }
        // // 默认属性值
        // Person.defaultProps = {
        //     sex: 'none',
        //     age: -1
        // }

        // const { name, sex, age } = {
        //     name: 'Amumu',
        //     sex: '男',
        //     age: 18
        // }
        // ReactDOM.render(<Person name={name} sex={sex} age={age} />, document.getElementById('app'));
        const p = {
            name: 'Amumu',
            sex: '男',
            age: 18
        }
        // ...p 并非浅拷贝对象,而是批量传递标签属性(props)
        ReactDOM.render(<Person {...p} />, document.getElementById('app'));
        const testPerson = {
            name: undefined,
            sex: undefined,
            age: undefined
        }
        ReactDOM.render(<Person {...testPerson} />, document.getElementById('test'));
    </script>
</body>

</html>
