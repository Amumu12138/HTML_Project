<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>非受控组件</title>
    <!-- 引入react核心库 -->
    <script src="../../js/react.development.js"></script>
    <!-- 引入react-dom, 用于支持react操作DOM -->
    <script src="../../js/react-dom.development.js"></script>
    <!-- 引入babel, 用于将jsx转换成js -->
    <script src="../../js/babel.min.js"></script>

</head>

<body>
    <h1>非受控组件</h1>
    <div id="app"></div>
    <script type="text/babel">
        // 
        class Login extends React.Component {
            handleSubmit(event) {
                // 阻止表单提交
                event.preventDefault();

                console.log(this);
                // alert('账号' + this.usernameRef.current.value + '密码' + this.pwdRef.current.value)

                const { username, password } = this;
                alert(`账号:${username.value} 密码: ${password.value}`);
            }
            usernameRef = React.createRef();
            pwdRef = React.createRef();
            // createRef 创建容器 
            // render() {
            //     return (
            //         <div>
            //             <form onSubmit={(e) => this.handleSubmit(e)}>
            //                 账号: <input ref={this.usernameRef} type="text" name="username" />
            //                 <br />
            //                 密码: <input ref={this.pwdRef} type="password" name="password" />
            //                 <br />
            //                 <button style={{ 'marginTop': '10px' }}>登录</button>
            //             </form>
            //         </div>
            //     ) 
            // }

            // 回调函数形式
            render() {
                return (
                    <div>
                        <form onSubmit={(e) => this.handleSubmit(e)}>
                            账号: <input ref={(c) => { this.username = c; }} type="text" name="username" />
                            <br />
                            密码: <input ref={(c) => { this.password = c; }} type="password" name="password" />
                            <br />
                            <button>登录</button>
                        </form>
                    </div>
                )
            }
        }

        // 渲染虚拟DOM
        ReactDOM.render(<Login />, document.getElementById('app'))
    </script>
</body>

</html>
