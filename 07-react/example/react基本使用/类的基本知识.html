<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类的基本知识</title>
</head>

<body>
    <h1>类的基本知识</h1>
    <script type="text/javascript">
        class Person {
            // 构造函数
            constructor(name, age) {
                this.name = name;
                this.age = age;
            }
            say() {
                console.log(`${this.name} ${this.age} say called `);
            }

        }

        // Student继承Person
        class Student extends Person {
            constructor(name, age, grade) {
                super();
                this.grade = grade;
            }
        }

        const p = new Person('zhangsan', 18);
        console.log(p);
        p.say();
    </script>
</body>

</html>
