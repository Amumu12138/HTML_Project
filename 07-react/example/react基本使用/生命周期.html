<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命周期</title>
    <!-- 引入react核心库 -->
    <script src="../../js/react.development.js"></script>
    <!-- 引入react-dom, 用于支持react操作DOM -->
    <script src="../../js/react-dom.development.js"></script>
    <!-- 引入babel, 用于将jsx转换成js -->
    <script src="../../js/babel.min.js"></script>

</head>

<body>
    <h1>生命周期</h1>
    <div id="app"></div>
    <script type="text/babel">
        class Life extends React.Component {
            state = {
                opacity: 1
            }
            unmounted() {
                const appDom = document.getElementById('app')
                ReactDOM.unmountComponentAtNode(appDom);
            }
            handleChange() {
                console.log('handleChange called');
            }
            // 组件挂载 生命周期钩子
            componentDidMount() {
                console.log('componentDidMount called');

                this.interval = setInterval(() => {
                    let { opacity } = this.state;
                    opacity -= 0.1;
                    if (opacity < 0) {
                        clearInterval(this.interval);
                        this.interval = null;
                        return;
                    }
                    this.setState({ opacity: opacity })
                }, 200);
            }
            // 组件卸载 生命周期钩子
            componentWillUnmount() {
                console.log('componentWillUnmount called');

                clearInterval(this.interval);
                this.interval = null;
            }
            // render调用时机: 初始化渲染、状态更新之后
            render() {
                const { opacity } = this.state;
                return (
                    <div>
                        <h2 style={{ 'opacity': opacity }}>React</h2>
                        <button onClick={() => { this.handleChange() }}>变化</button>

                        <button style={{ marginLeft: '10px' }} onClick={() => this.unmounted()}>卸载组件</button>
                    </div>
                )
            }
        }

        // 渲染虚拟DOM
        ReactDOM.render(<Life />, document.getElementById('app'))
    </script>
</body>

</html>
