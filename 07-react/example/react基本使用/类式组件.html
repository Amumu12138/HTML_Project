<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类式组件</title>

    <!-- 引入react核心库 -->
    <script src="../../js/react.development.js"></script>
    <!-- 引入react-dom, 用于支持react操作DOM -->
    <script src="../../js/react-dom.development.js"></script>
    <!-- 引入babel, 用于将jsx转换成js -->
    <script src="../../js/babel.min.js"></script>
</head>

<body>
    <h1>类式组件</h1>
    <div id="app"></div>
    <script type="text/babel">
        // 创建类式组件 
        class MyComponent extends React.Component {
            constructor(props) {
                super(props);
                this.state = { tag: 'h2', a: '111' }
                // 通过函数对象强制绑定bind(this)
                // this.handleClick = this.handleClick.bind(this);
            }
            handleClick() {
                console.log('handleClick called', this);
                // this.state = { tag: 'h1' } state数据不能直接修改
                // state数据必须通过setState进行更新,且更新是一种合并,不是替换
                this.setState({ tag: 'h1' })
            }
            // render在MyComponent原型对象上,供实例使用
            render() {
                console.log('this', this); // MyComponent 组件实例对象
                // 箭头函数修改this指向组件实例对象
                return <h2 onClick={() => this.handleClick()}>这是一个类式组件-{this.state.tag}-{this.state.a}</h2>
                // return <h2 onClick={this.handleClick}>这是一个类式组件-{this.state.tag}</h2>

            }
        }

        // 渲染类组件
        ReactDOM.render(<MyComponent />, document.getElementById('app'));
    </script>
</body>

</html>
