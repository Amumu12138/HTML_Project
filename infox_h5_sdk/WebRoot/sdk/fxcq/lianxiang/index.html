<body>

    <script type="text/javascript">
        $(function () {
            var cs = "http://localhost/infox_h5_sdk/api/";
            var zs = "https://h5.infoxgame.com/api/";
            channelSDK.init(false, zs, '10877230', '765681090');
            console.log("Amumu lianxiang infoxsdk 初始化成功");
            var _params = channelSDK.getURLParams();
            var extension = JSON.stringify({
                "token": _params.token,
                "cpId": "10197",
                "ip": returnCitySN["cip"]
            });
            channelSDK["lpms"] = _params.lpms;

            console.log("Amumu lianxiang infoxsdk extension = ", extension);
            channelSDK.getCpToken(extension, function (data) {
                var gameUrl = data.gameUrl + '&uid=' + data.userID + '&sdkToken=' + data.token;
                channelSDK["userID"] = data.userID;
                channelSDK["lenovoId"] = data.sdkUserID;
                channelSDK["encLenovoId"] = data.extension;

                if (data.type == 0) { //横屏游戏    
                    $("body").append(
                        '<div id="gameFrameDiv" style=" display:none;  width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                        gameUrl +
                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                    );
                    window.onorientationchange = function () {
                        if (window.orientation == 90 || window.orientation == -90) {
                            $("#gameFrameDiv").css({
                                "left": $(window).width() - 20,
                                "top": "30%"
                            });
                        }
                    }
                } else { //竖屏游戏 
                    $("body").append('<div id="gameFrameDiv" style="display:none; width: ' + $(window)
                        .width() + 'px;  height: ' + $(window).height() +
                        'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                        gameUrl +
                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                        $(window).width() + 'px; height: ' + $(window).height() +
                        'px;"></iframe></div>');
                }
                setTimeout(function () {
                    $("#gameFrameDiv").fadeIn(1000);
                    $("#gameFrame").attr("src", gameUrl);
                }, 500);
            });
            channelSDK.startEventListener();
        });


        function receiveMessage(event) {
            //支付
            if (event.data.method == 'loadPayBox') {
                var params = event.data.param;
                params["userID"] = channelSDK.userID;
                params["appID"] = channelSDK.gameId;
                params["isTest"] = channelSDK.isTest;
                params["token"] = channelSDK.channelToken;
                params["uid"] = channelSDK.channelUserID;
                params["lpms"] = channelSDK.lpms;
                console.log("Amumu lianxiang infoxsdk loadPayBox params = ", params);
                httpPost(channelSDK.host + "getOrderID", params, function (data, params) {
                    console.log("Amumu lianxiang infoxsdk getOrderID data = ", data + " params = ", params);
                    if (data.state == channelSDK.SUCCESS) {
                        var lpms = data.data.extension;
                        var extraCommonParam = {
                            orderID: data.data.orderID
                        };

                        var url = "https://cp.vgs.lenovo.com.cn/h5pay" + "?partner=" + "10197" +
                            "&notifyUrl=" + "http://sdk.paojiao.cn/pay/lianxiangh5/payCallback.html" +
                            "&outTradeNo=" + data.data.orderID + "&encLenovoId=" + channelSDK.encLenovoId +
                            "&gameId=" + "212128" + "&extraCommonParam=" + extraCommonParam + "&server=" +
                            params.serverName + "&role=" + params.roleName +
                            "&lpms=" + lpms + "&totalFee=" + params.money;
                        url = encodeURI(url);
                        console.log("Amumu lianxiang infoxsdk getOrderID url = ", url);
                        //唤起支付页面
                        lenovocp.pay(url, 'h5');
                    }
                });
            } else if (event.data.method == 'reportRoleInfo') {
                //上报角色信息
                var params = event.data.param;
                console.log("Amumu lianxiang reportRoleInfo param = ", params);

                //判断上报类型
                if (params.roleLever == 1) {
                    var roleParam = {};
                    roleParam["lenovoId"] = channelSDK.lenovoId;
                    roleParam["cpId"] = "10197";
                    roleParam["gameId"] = "212128";
                    roleParam["serverId"] = params.roleServerId;
                    roleParam["roleId"] = params.roleId;
                    roleParam["role"] = params.roleName;
                    roleParam["timestamp"] = new Date().getTime();
                    roleParam["channelID"] = "765681090";

                    var appkey = "RUtGQbnqs2MrmXIGkL06OEXD2PjevCSE";
                    var signPamras = "lenovoId=" + params.lenovoId + "&" +
                        "timestamp=" + params.timestamp + appkey;
                    var sign = $.md5(signPamras);
                    roleParam["sign"] = sign;

                    var roleUrl = sdkApi.buildURL("https://sdk.paojiao.cn/channel/roleReport/lxreport.html", roleParam);
                    roleUrl = encodeURI(roleUrl);
                    console.log("Amumu lianxiang reportRoleInfo roleUrl = ", roleUrl);
                    // httpPost(roleUrl, params, function (data, params) {
                    //     console.log("Amumu lianxiang reportRoleInfo data = ", data + "params=", params);
                    // });
                }
            }
        }
    </script>
</body>
