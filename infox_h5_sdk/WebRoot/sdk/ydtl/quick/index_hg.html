    <title>一刀屠龙</title>

    <link href="../../../css/common.css?20171011" rel="stylesheet">
    <link href="../../../css/layout.css?20171011" rel="stylesheet">

    <script type="text/javascript" src="../../../js/jquery/jquery-1.9.1.min.js"></script>
    <script type="text/javascript" src="../../../js/jquery/jquery.md5.js"></script>

    <script type="text/javascript" src="https://staticjs.quickapi.net/static/lib/libQuickSDK_v2.js"></script>
    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%
        }

        body {
            /*  background: url(https://h5.infoxgame.com/images/ydtl_loading.png) no-repeat center top;*/
            background-size: auto 100%;
        }
    </style>

</head>

<body>
    <!--<img id="qtt_loading_img">-->

    <script type="text/javascript">
        $(function () {
            //初始化渠道sdk
            var cs = "http://localhost/infox_h5_sdk/api/";
            var zs = "https://h5.infoxgame.com/api/";
            channelSDK.init(false, zs, '10877125', '764641088');

            var productCode = '19119798668655333035752927267859'; //QuickSDK后台自动分配
            var productKey = '87074061'; //QuickSDK后台自动分配
            //Quick初始化
            QuickSDK.init(productCode, productKey, true, function () {
                console.log("init success");
            });

            var _params = channelSDK.getURLParams();
            console.info("--------_params--------:" + JSON.stringify(_params));
            QuickSDK.login(function (callbackData) {
                var message;
                if (callbackData.status) {
                    console.log('GameDemo:QuickSDK登录成功: data=>' + callbackData.data);
                    //不同的渠道使用不同的拼接方式
                    var extension = JSON.stringify({
                        "uid": callbackData.data.uid, //渠道uid
                        "username": callbackData.data.username, //渠道username
                        "token": callbackData.data.token, //token
                        "isLogin": callbackData.data.isLogin, //是否游客,登陆后此值为true
                        "channelId": callbackData.data.channelId //渠道ID
                    });
                    //保存渠道用户信息
                    channelSDK["channelUserID"] = callbackData.data.uid;
                    channelSDK["username"] = callbackData.data.username;

                    console.info("--------reuqest params--------:" + extension);

                    //校验渠道token
                    channelSDK.getCpToken(extension, function (data) {
                        var gameUrl = data.gameUrl + '?uid=' + data.userID + '&sdkToken=' + data
                            .token;
                        channelSDK["userID"] = data.userID;
                        if (data.type == 0) { //横屏游戏
                            $("body").append(
                                '<div id="gameFrameDiv" style=" display:none;  width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                gameUrl +
                                '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                            );
                            window.onorientationchange = function () {
                                if (window.orientation == 90 || window.orientation == -90) {
                                    $("#gameFrameDiv").css({
                                        "left": $(window).width() - 20,
                                        "top": "30%"
                                    });
                                }
                            }
                        } else { //竖屏游戏
                            $("body").append(
                                '<div id="gameFrameDiv" style="display:none; width: ' + $(
                                    window)
                                .width() + 'px;  height: ' + $(window).height() +
                                'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                gameUrl +
                                '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                                $(window).width() + 'px; height: ' + $(window).height() +
                                'px;"></iframe></div>');
                        }
                        setTimeout(function () {
                            $("#gameFrameDiv").fadeIn(1000);
                            $("#gameFrame").attr("src", gameUrl);
                        }, 500);
                    });
                    channelSDK.startEventListener();

                } else {
                    console.log('GameDemo:QuickSDK登录失败:' + callbackData.message);
                }

                //Quick切换账号回调方法
                QuickSDK.setSwitchAccountNotification(function(callbackData){
                    if (callbackData.status) {
                        console.log('Amumu Quick 切换账号成功: data=>' + JSON.stringify(callbackData.data));
                        //不同的渠道使用不同的拼接方式
                        var extensionSwitch = JSON.stringify({
                            "uid": callbackData.data.uid, //渠道uid
                            "username": callbackData.data.username, //渠道username
                            "token": callbackData.data.token, //token
                            "isLogin": callbackData.data.isLogin, //是否游客,登陆后此值为true
                            "channelId": callbackData.data.channelId //渠道ID
                        });
                        //保存渠道用户信息
                        channelSDK["channelUserID"] = callbackData.data.uid;
                        channelSDK["username"] = callbackData.data.username;

                        console.info("--------Amumu Quick 切换账号 extensionSwitch--------:" + JSON.stringify(extensionSwitch));

                        //校验渠道token
                        channelSDK.getCpToken(extensionSwitch, function (data) {
                            var gameUrl = data.gameUrl + '?uid=' + data.userID + '&sdkToken=' + data
                                .token;
                            channelSDK["userID"] = data.userID;
                            if (data.type == 0) { //横屏游戏
                                $("body").append(
                                    '<div id="gameFrameDiv" style=" display:none;  width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                    gameUrl +
                                    '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                                );
                                window.onorientationchange = function () {
                                    if (window.orientation == 90 || window.orientation == -90) {
                                        $("#gameFrameDiv").css({
                                            "left": $(window).width() - 20,
                                            "top": "30%"
                                        });
                                    }
                                }
                            } else { //竖屏游戏
                                $("body").append(
                                    '<div id="gameFrameDiv" style="display:none; width: ' + $(
                                    window)
                                        .width() + 'px;  height: ' + $(window).height() +
                                    'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                    gameUrl +
                                    '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                                    $(window).width() + 'px; height: ' + $(window).height() +
                                    'px;"></iframe></div>');
                            }
                            setTimeout(function () {
                                $("#gameFrameDiv").fadeIn(1000);
                                $("#gameFrame").attr("src", gameUrl);
                            }, 500);
                        });
                        channelSDK.startEventListener();
                    }
                });

                //Quick注销账号回调
                QuickSDK.setLogoutNotification(function(logoutObject){
                    console.log('Amumu Quick Game setLogoutNotification', JSON.stringify(logoutObject));
                    window.open("https://h5.infoxgame.com/sdk/ydtl/quick/index_hg.html");
                });
            });
        });

        function receiveMessage(event) {
            console.log("Amumu quick receiveMessage data = ", JSON.stringify(event.data));
            var params = event.data.param;

            if (event.data.method == 'loadPayBox') { //拉起支付
                console.log("调用订单获取接口");

                params["userID"] = channelSDK.userID;
                params["appID"] = channelSDK.gameId;
                params["isTest"] = channelSDK.isTest;

                console.log("----------订单接口 params--------------" + JSON.stringify(params));
                //生成融合sdk订单
                httpPost(channelSDK.host + "getOrderID", params, function (data, params) {
                    console.log("Amumu quick getOrderNo data = ", data);
                    if (data.state == channelSDK.SUCCESS) {
                        console.log("获取订单成功：" + JSON.stringify(data));

                        var orderInfo = new Object();
                        orderInfo.productCode = "19119798668655333035752927267859"; //QuickSDK后台自动分配的参数
                        orderInfo.uid = channelSDK.channelUserID; //渠道UID
                        orderInfo.username = channelSDK.username; //渠道username
                        orderInfo.userRoleId = params.roleID; //游戏内角色ID
                        orderInfo.userRoleName = params.roleName; //游戏角色
                        orderInfo.serverId = params.serverID; //角色所在区服ID
                        orderInfo.userServer = params.serverName; //角色所在区服
                        orderInfo.userLevel = 1; //角色等级
                        orderInfo.cpOrderNo = data.data.orderID; //游戏内的订单,服务器通知中会回传
                        orderInfo.amount = params.money; //购买金额(元)
                        orderInfo.subject = params.productName; //道具名称
                        orderInfo.desc = params.productDesc; //道具描述
                        orderInfo.callbackUrl = ''; //服务器通知地址
                        orderInfo.extrasParams = data.data.orderID; //游戏内的订单,服务器通知中会回传
                        orderInfo.goodsId = '1001'; //商品ID
                        orderInfo.count = 1; //购买商品个数
                        orderInfo.quantifier = '个'; //购买商品单位
                        var orderInfoJson = JSON.stringify(orderInfo);
                        console.log("Amumu quick getOrderNo orderInfoJson = ", orderInfoJson);
                        QuickSDK.pay(orderInfoJson, function (payStatusObject) {
                            console.log('GameDemo:下单通知' + JSON.stringify(payStatusObject));
                        });
                    }
                });
            } else if (event.data.method == 'reportRoleInfo') { //上报角色信息
                console.log("Amumu quick reportRoleInfo 调用上报角色信息接口");

                var role_id = params.roleId;
                var role_name = params.roleName;
                var role_level = params.roleLever;
                var server_id = params.roleServerId;
                var server_name = params.roleServerName;
                var role_money = params.roleMoney;
                var time = params.time;
                var isCreateRole = false;

                console.log("------------Amumu quick reportRoleInfo 上报角色信息--------------" + JSON.stringify(params));
                //判断是否为创建角色
                if (role_level == 1) {
                    isCreateRole = true;
                    window.localStorage.setItem("yh_quick_createRoleTime", time);
                    console.log("Amumu create roleCreateTime = ", time);
                }
                console.log("Amumu roleCreateTime = ", window.localStorage.getItem("yh_quick_createRoleTime"));
                var roleInfo = new Object();
                roleInfo.isCreateRole = isCreateRole; //仅创建角色时传true,更新信息时传false
                roleInfo.roleCreateTime = window.localStorage.getItem("createRoleTime") || time;; //角色创建时间
                roleInfo.uid = channelSDK.channelUserID; //UID
                roleInfo.username = channelSDK.username; //username
                roleInfo.serverId = server_id; //区服ID
                roleInfo.serverName = server_name; //区服名称
                roleInfo.userRoleName = role_name; //游戏角色名称
                roleInfo.userRoleId = role_id; //游戏角色ID
                roleInfo.userRoleBalance = role_money; //角色游戏内货币余额
                roleInfo.vipLevel = 0; //角色VIP等级
                roleInfo.userRoleLevel = role_level; //角色等级
                roleInfo.partyId = 1; //工会社团ID
                roleInfo.partyName = ''; //工会社团名称
                roleInfo.gameRoleGender = ''; //角色性别
                roleInfo.gameRolePower = 0; //角色战力
                roleInfo.partyRoleId = 1; //角色在帮派ID
                roleInfo.partyRoleName = ''; //角色在帮派中的名称
                roleInfo.professionId = 1; //角色职业ID
                roleInfo.profession = ''; //角色职业名称
                roleInfo.friendlist = ''; //角色好友列表
                var roleInfoJson = JSON.stringify(roleInfo);
                console.log("Amumu quick reportRoleInfo roleInfoJson", roleInfoJson);
                QuickSDK.uploadGameRoleInfo(roleInfoJson, function (response) {
                    console.log("Amumu quick QuickSDK uploadGameRoleInfo success response = ", JSON.stringify(response));
                });
            }
        }
    </script>
</body>

</html>
