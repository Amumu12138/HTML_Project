<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WEBGL</title>

    <link href="css/common.css" rel="stylesheet">
</head>

<body>
    <button class="common-btn" style="position: absolute;" onclick="window.history.back();">Back</button>
    
    <!--canvas标签创建一个宽高均为500像素，背景为白色的矩形画布-->
    <canvas id="webgl" width="500" height="500" style="background-color: white"></canvas>
    <!-- libs -->
    <script type="text/javascript" src="libs/cuon-matrix.js"></script>
    <script type="text/javascript" src="libs/cuon-utils.js"></script>
    <script type="text/javascript" src="libs/webgl-debug.js"></script>
    <script type="text/javascript" src="libs/webgl-utils.js"></script>
    <!-- WebGL -->
    <script type="text/javascript" src="example/Test.js"></script>
    <script type="text/javascript" src="example/TestGLSL.js"></script>
    <script type="text/javascript" src="example/Canvas.js"></script>
    <script type="text/javascript" src="example/Cube.js"></script>
    <script type="text/javascript" src="example/ColorCube.js"></script>
    <script type="text/javascript" src="example/Rect.js"></script>
    <script type="text/javascript" src="example/AlphaBlend.js"></script>
    <script type="text/javascript" src="example/AlphaCube.js"></script>
    <script type="text/javascript" src="example/GrayTexture2D.js"></script>
    <script type="text/javascript" src="example/Ring.js"></script>
    <script type="text/javascript" src="example/Texture2D.js"></script>
    <script type="text/javascript" src="example/Transform.js"></script>
    <script type="text/javascript" src="example/Triangles.js"></script>
    <script type="text/javascript" src="example/TwoCube.js"></script>
    <script type="text/javascript" src="example/UnitCube.js"></script>
    <!-- colorLerp -->
    <script type="text/javascript" src="example/colorLerp/ColorElementTri.js"></script>
    <script type="text/javascript" src="example/colorLerp/ColorLine.js"></script>
    <script type="text/javascript" src="example/colorLerp/ColorTriangle.js"></script>
    <script type="text/javascript" src="example/colorLerp/ColorTwoTri.js"></script>
    <!-- illumination -->
    <script type="text/javascript" src="example/illumination/IllRedCube.js"></script>
    <script type="text/javascript" src="example/illumination/PointLightRedCube.js"></script>
    <!-- rotate -->
    <script type="text/javascript" src="example/rotate/RotateColorCube.js"></script>
    <script type="text/javascript" src="example/rotate/RotateCube.js"></script>
    <!-- switchShader -->
    <script type="text/javascript" src="example/switchShader/SwitchShader_01.js"></script>
    <script type="text/javascript" src="example/switchShader/SwitchShader_02.js"></script>
    <script type="text/javascript" src="example/switchShader/SwitchShader_03.js"></script>
    <!-- client -->
    <script type="text/javascript" src="example/client/Flame.js"></script>
    <script type="text/javascript" src="example/client/ColorTest.js"></script>
    <script type="text/javascript" src="example/client/WEBGLTest.js"></script>
    <script type="text/javascript" src="example/client/Point.js"></script>
    <script>
        var exampleName = window.localStorage.getItem("exampleName");
        switch(exampleName) {
            //示例: 点
            case "Test":
                Example.Test();
                break;
            //线框矩形
            case "TestGLSL":
                Example.TestGLSL();
                break;
            //画布 2d描线三角形
            case "Canvas":
                Example.Canvas();
                break;
            //线框正方体
            case "Cube":
                Example.Cube();
                break
            //平面正方体 添加颜色
            case "ColorCube":
                Example.ColorCube();
                break
            //线框矩形
            case "Rect":
                Example.Rect();
                break;
            case "AlphaBlend":
                Example.AlphaBlend();
                break;
            case "AlphaCube":
                Example.AlphaCube();
                break;
            case "GrayTexture2D":
                Example.GrayTexture2D();
                break;
            case "Ring":
                Example.Ring();
                break;
            case "Texture2D":
                Example.Texture2D();
                break;
            case "Transform":
                Example.Transform();
                break;
            case "Triangles":
                Example.Triangles();
                break;
            case "TwoCube":
                Example.TwoCube();
                break;
            case "UnitCube":
                Example.UnitCube();
                break;
            case "ColorElementTri":
                Example.ColorElementTri();
                break;
            case "ColorLine":
                Example.ColorLine();
                break;
            case "ColorTriangle":
                Example.ColorTriangle();
                break;
            case "ColorTwoTri":
                Example.ColorTwoTri();
                break;
            case "IllRedCube":
                Example.IllRedCube();
                break;
            case "PointLightRedCube":
                Example.PointLightRedCube();
                break;
            case "RotateColorCube":
                Example.RotateColorCube();
                break;
            case "RotateCube":
                Example.RotateCube();
                break;
            case "SwitchShader_01":
                Example.SwitchShader_01();
                break;
            case "SwitchShader_02":
                Example.SwitchShader_02();
                break;
            case "SwitchShader_03":
                Example.SwitchShader_03();
                break;
            case "Flame": 
                Example.Flame();
                break;
            case "ColorTest": 
                Example.ColorTest();
                break;
            case "WEBGLTest": 
                Example.WEBGLTest();
                break;
            case "Point": 
                Example.Point();
                break;
            default: 
                break;
        }
    </script>
</body>

</html>
