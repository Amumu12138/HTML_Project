<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高阶函数_函数柯里化</title>
    <!-- 引入react核心库 -->
    <script src="../../js/react.development.js"></script>
    <!-- 引入react-dom, 用于支持react操作DOM -->
    <script src="../../js/react-dom.development.js"></script>
    <!-- 引入babel, 用于将jsx转换成js -->
    <script src="../../js/babel.min.js"></script>

</head>

<body>
    <h1>高阶函数_函数柯里化</h1>
    <div id="app"></div>
    <script type="text/babel">
        // 
        class Login extends React.Component {
            state = {
                username: '',
                password: ''
            }
            handleSubmit(event) {
                // 阻止表单提交
                event.preventDefault();
                const { username, password } = this.state;
                alert(`账号:${username} 密码: ${password}`);
            }
            // 高级函数,闭包
            dataTypeChange(dataType) {
                // 实现函数柯里化,类似于dataTypeChange(dataType)(event)
                return (event) => {
                    console.log(event.target.value, dataType);
                    this.setState({ [dataType]: event.target.value })
                }
            }

            // 回调函数形式
            // render() {
            //     return (
            //         <div>
            //             <form onSubmit={(e) => this.handleSubmit(e)}>
            //                 账号: <input ref={(c) => { this.username = c; }} type="text" name="username" onChange={this.dataTypeChange('username')} />
            //                 <br />
            //                 密码: <input ref={(c) => { this.password = c; }} type="password" name="password" onChange={this.dataTypeChange('password')} />
            //                 <br />
            //                 <button>登录</button>
            //             </form>
            //         </div>
            //     )
            // }

            // 箭头函数实现
            dataTypeChange2(event, dataType) {
                console.log(event.target.value, dataType);
                this.setState({ [dataType]: event.target.value })
            }
            render() {
                // 箭头函数实现
                return (
                    <div>
                        <form onSubmit={(e) => this.handleSubmit(e)}>
                            账号: <input ref={(c) => { this.username = c; }} type="text" name="username" onChange={(event) => this.dataTypeChange2(event, 'username')} />
                            <br />
                            密码: <input ref={(c) => { this.password = c; }} type="password" name="password" onChange={(event) => this.dataTypeChange2(event, 'password')} />
                            <br />
                            <button>登录</button>
                        </form>
                    </div>
                )
            }
        }

        // 渲染虚拟DOM
        ReactDOM.render(<Login />, document.getElementById('app'))
    </script>
</body>

</html>
