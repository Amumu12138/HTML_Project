<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Vue</title>
    <script src="./libs/vue.js"></script>
</head>

<body>
    <div id="app">
        {{ message }}
        <h2> {{study.name}} {{study.sex}} </h2>
    <ul>
        <li>{{ array[0] }}</li>
        <li>{{ array[1] }}</li>
        <li>{{ array[2] }}</li>
        <li>{{ array[3] }}</li>
    </ul>
    </div>

    <script>
        //实例化vue
       var app = new Vue({
        el: "#app",
        data: {
            message: "Hello World!",
            study: {
                name: "Amumu",
                sex: "Man"
            },
            array: ["1", "2", "3", "4"]
        }
       });
    </script>
</body>

</html>
