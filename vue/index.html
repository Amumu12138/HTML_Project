<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Vue</title>
    <script src="./libs/vue.js"></script>
</head>

<body>
    <div id="app">
       <h1 v-text="message"></h1>
       <p v-html="content"></p>
       <input type="button" value="点击指令" @click="onClickResp">
       <!-- 计数器实现 -->
       <button @click="add">+</button>
       <span>{{ num }}</span> 
       <button @click="sub">-</button>
       <h1 v-show="isShow">{{ message }}</h1>
       <h1 v-if="isShow">{{ message }}</h1>
       <img :src="imgSrc">
       <ul>
           <li v-for="item in arr"> {{ item }} </li>
        </ul>
        <input type="button" value="v-on补充" @click="onClickFunResp('Amumu')">
        <br>
        <input type="text" v-model="modelParam">
        <h1 > {{ modelParam}} </h1>
        <!-- 切换图片 -->
        <button v-show="textIndex>0" @click="onClickPrevResp"> 《 </button>
        <span>{{ textArr[textIndex] }}</span>
        <button v-show="textIndex<textArr.length-1" @click="onClickNextResp"> 》 </button>
    </div>

    <script>
        //实例化vue
       var app = new Vue({
        el: "#app",
        data: {
            message: "Hello World!",
            study: {
                name: "Amumu",
                sex: "Man"
            },
            array: ["1", "2", "3", "4"],
            content: "<a href='https://www.baidu.com'>百度一下</a>",
            num: 1,
            isShow: true,
            imgSrc: "https://cn.bing.com/images/search?view=detailV2&ccid=ZTmNathh&id=534B9C7D6175172F38D1E43E093999D94B8D7A0B&thid=OIP.ZTmNathhKflijArYDaQEDAHaEo&mediaurl=https%3a%2f%2fth.bing.com%2fth%2fid%2fR65398d6ad86129f9628c0ad80da4040c%3frik%3dC3qNS9mZOQk%252b5A%26riu%3dhttp%253a%252f%252fwww.shijuepi.com%252fuploads%252fallimg%252f200918%252f1-20091Q10420.jpg%26ehk%3dQBNuJIbVP1qo%252bwUD3YzXcvL4H5iHivOHXUnzzRw%252bWfU%253d%26risl%3d%26pid%3dImgRaw&exph=1200&expw=1920&q=%e5%9b%be%e7%89%87&simid=608046886783878256&ck=C0760B80F2CDA1A519F11FA04587E32F&selectedIndex=0&FORM=IRPRST&ajaxhist=0&ajaxserp=0",
            arr: [1, 2, 3, 4, 5],
            modelParam: "AmumuModel",
            // 切换
            textIndex: 0,
            textArr: ["a", "b", "c", "d", "e"],
        },
        methods: {
            onClickResp: function() {
                this.message += " 你好，世界！";
            },
            add:function() {
                if(this.num >= 10) {
                    alert("num max is 10 !");
                    return;
                }
                this.num += 1;
            },
            sub: function() {
                if(this.num <= 0) {
                    alert("num min is 0 !");
                    return;
                }
                this.num -= 1;
            },
            onClickFunResp: function(arg1) {
                alert(arg1);
            },
            //点击上次处理
            onClickPrevResp: function() {
                this.textIndex--;
            },
            //点击下次处理
            onClickNextResp: function() {
                this.textIndex++;
            }
           
        },
        //在实例初始化之后，数据观测(data observer)和event/watcher事件配置之前被调用
        beforeCreate: function() {
            console.log("beforeCreate");
        },
        //在实例创建完成后被立即调用，在这一步，实例已完成以下的配置；数据观测(data observer)、
        //属性和方法的运算、watch/event事件回调。然而，挂载阶段还没开始，$el属性目
        created: function() {
            console.log("created");
        },
        //在挂载开始之前被调用，相关的渲染函数首次被调用
        beforeMount: function() {
            console.log("beforeMount");
        },
        //el被新创建的vm.$el替换，挂载成功
        mounted: function() {
            console.log("mounted");
        },
        //数据更新时调用
        beforeUpdate: function() {
            console.log("beforeUpdate");
        },
        //组件DOM已经更新，组件更新完毕
        updated: function() {
            console.log("updated");
        }

       });

       var index = 0;
       setInterval(() => {
        app.message = "修改中。。。" + index++;
       }, 1000);
    </script>
</body>

</html>
