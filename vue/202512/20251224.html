<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // async/await 测试题
        async function fn() {
            setTimeout(() => {
                console.log(4)
            }, 0)
            Promise.resolve().then(() => {
                console.log(1)
            })

            // 隐式转化为Promise.resolve(2).then(res=> {setTimeout(() => { console.log(2) }, 0)})
            await setTimeout(() => { console.log(2) }, 0) // 1 3 4 2
            // await Promise.resolve(2).then(res => { setTimeout(() => { console.log(2) }, 0) }) // 1 3 4 2
            // await Promise.resolve(2).then(res => { console.log(res) }) // 1 2 3 4
            // await new Promise((resolve, reject) => { setTimeout(() => { resolve(2) }, 0) }).then(res => { console.log(res) }) // 1 4 2 3
            // Promise.resolve(2).then(res => { console.log(res) }) // 3 1 2 4

            console.log(3)
        }
        fn()
        // 1 3 4 2
    </script>
</body>

</html>
