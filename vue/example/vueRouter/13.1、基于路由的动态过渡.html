<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>13.1 基于路由的动态过渡</title>

    <script src="https://unpkg.com/vue/dist/vue.js"></script>
    <script src="https://unpkg.com/vue-router/dist/vue-router.js"></script>

    <style>
        li {
            list-style: none;
        }

        .fade-enter-active,
        .fade-leave-active {
            transition: opacity .5s;
        }

        /* .fade-leave-active below version 2.1.8 */
        .fade-enter,
        .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>

<body>
    <!--  <div id="app">
        <h1>过度动效</h1>
        <transition name="move" duration="5000">
            <router-view></router-view>
        </transition>
    </div> -->
    <div id="app">
        <h1>基于路由的动态过渡</h1>
        <ul>
            <li>
                <router-link to="/">/</router-link>
            </li>
            <li>
                <router-link to="/parent">/parent</router-link>
            </li>
            <li>
                <router-link to="/parent/foo">/parent/foo</router-link>
            </li>
            <li>
                <router-link to="/parent/bar">/parent/bar</router-link>
            </li>
        </ul>
        <transition name="fade" mode="out-in" duration="5000">
            <router-view class="view"></router-view>
        </transition>
    </div>

    <script src="./index13-1.js"></script>
</body>

</html>
