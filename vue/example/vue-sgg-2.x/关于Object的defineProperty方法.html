<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于Object的defineProperty方法</title>
</head>

<body>
    <script>
        let person1 = {
            name: 'Amumu',
            sex: 'man',
            age: 111
        }

        console.log('person1 -->', Object.keys(person1));
        let person = {
            name: 'Amumu',
            sex: '女'
        }

        Object.defineProperty(person, 'age', {
            // value: 24,
            // enumerable: true, // 控制属性是否可以枚举，默认值是false
            // writable: true, // 控制属性是否可以被修改，默认值是false
            // configurable: true, // 控制属性是否可以被删除，默认值是false
            // 当有人读取person的age属性时,get函数(getter)就会被调用，且返回值即age的值
            get() {
                console.log('getter 读取age的值');
                return 1111;
            },
            // 当有人修改person的age属性时, set函数(setter)就会被调用,且会受到修改的具体值
            set(newVal) {
                console.log('setter 修改age的值为 -->', newVal);
            }
        });

        console.log('person -->', Object.keys(person));
    </script>

</body>

</html>
