<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9、Vuex中的Module</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <!-- vuex -->
    <script src="https://unpkg.com/vuex@2.0.0"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
    </div>
    <script>
        // 模块A
        const moduleA = {
            state: {
                name: 'Amumu',
                age: 24,
                count: 0
            },
            getters: {
                doubleCount(state) {
                    return state.count * 2
                }
            },
            mutations: {
                increment(state) {
                    state.count++
                },
                sumWithRootCount(state, getters, rootState) {
                    return state.count + rootState.rootCount
                }
            },
            actions: {
                incrementIfOaffOnRootSum({ state, commit, rootState }) {
                    if ((state.count + rootState.rootCount) % 2 === 1) {
                        commit('increment')
                    }
                }
            }
        }

        // 模块B
        const moduleB = {
            state: {
                cities: ['深圳', '茶陵', '长沙'],
                address: {
                    dogies: '广东省',
                    city: '深圳市'
                }
            },
            mutations: {

            }
        }

        const store = new Vuex.Store({
            modules: {
                a: moduleA,
                b: moduleB
            },
            state: {
                rootCount: 0,
            }
        })

        const vm = new Vue({
            el: "#app",
            store,
            date: {
                vmCount: 0
            },
            methods: {

            }
        })

        console.log('AMumu a:', store.state.a.name)
        console.log('AMumu b:', store.state.b.cities[0])
    </script>
</body>

</html>
