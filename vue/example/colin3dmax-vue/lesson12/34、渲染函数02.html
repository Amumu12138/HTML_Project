<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>34、渲染函数02</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>

    </style>
</head>

<body>
    <div id="app">
        <p>v-if和v-for</p>
        <item-com :items="items"></item-com>
        <p>v-model</p>
        <input-com v-model="activeName"></input-com>

    </div>
    <script>
        // item-com 组件
        Vue.component('item-com', {
            props: ['items'],
            render: function (createElement) {
                if (this.items.length) {
                    return createElement('ul', this.items.map(function (item) {
                        return createElement('li', item.name);
                    }))
                } else {
                    return createElement('p', 'No items Found');
                }
            }
        })

        // input 组件
        Vue.component('input-com', {
            props: ['value'],
            render: function (createElement) {
                var self = this;
                return createElement('input', {
                    domProps: {
                        value: self.value
                    },
                    on: {
                        input: function (event) {
                            console.log('AMumu input event -->', event)
                            self.$emit('input', event.target.value)
                        }
                    }
                })
            }
        })

        var vm = new Vue({
            el: "#app",
            data: {
                items: [
                    { name: 'Amumu01' },
                    { name: 'Amumu02' },
                    { name: 'Amumu03' }
                ],
                activeName: 'Amumu'
            },
            methods: {

            }
        })
    </script>
</body>

</html>
