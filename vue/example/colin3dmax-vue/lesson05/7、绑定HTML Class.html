<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7、绑定HTML Class</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        .active {
            width: 200px;
            height: 200px;
            background: rebeccapurple;
        }
    </style>
</head>

<body>
    <div id="app">
        <div v-bind:class="{ active: isActive }"></div>
    </div>
    <script>
        var vm = new Vue({
            el: "#app",
            data: {
                message: "HELLO VUE",
                isActive: true
            },
            computed: {

            },
            watch: {

            },
            methods: {

            },
            created() {

            },
            mouted() {

            }
        })
    </script>
</body>

</html>
