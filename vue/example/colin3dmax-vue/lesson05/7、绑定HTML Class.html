<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7、绑定HTML Class</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        .active {
            width: 200px;
            height: 200px;
            border-radius: 25px;
            background-color: rebeccapurple;
        }

        .static {
            background-color: black;
            /* width: 200px;
            height: 200px; */
        }

        .text-danger {
            color: red;
            text-align: center;
            line-height: 200px;
        }

        /* 自定义组件 */
        .foo {
            background-color: gray;
        }

        .bar {
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="static" v-bind:class="{ active: isActive }"></div>
        <div v-bind:class="classObject">HELLO</div>

        <div v-bind:class="[activeClass, errorClass]">WORLD</div>
        <!-- 自定义组件 -->
        <p>自定义组件</p>
        <my-component></my-component>
    </div>
    <script>

        Vue.component('my-component', {
            template: '<p class="foo bar">Hi</p>'
        })

        var vm = new Vue({
            el: "#app",
            data: {
                message: "HELLO VUE",
                isActive: true,
                classObject: {
                    active: true,
                    'text-danger': true
                },
                activeClass: 'active',
                errorClass: 'text-danger'
            },
            computed: {

            },
            watch: {

            },
            methods: {

            },
            created() {

            },
            mouted() {

            }
        })
    </script>
</body>

</html>
