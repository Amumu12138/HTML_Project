<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21、插槽</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        .container {
            background: lightcyan;
            border: 1px solid #000;
        }

        header {
            background-color: lightcoral;
        }

        footer {
            background-color: lightyellow;
        }
    </style>
</head>

<body>
    <div id="app">
        <p>插槽内容实现</p>
        <navigation-link url="https://www.baidu.com">
            Baidu
        </navigation-link>
        <p>编译作用域</p>
        <navigation-link url="/profile">
            <!-- Clicking here will send you to: {{ url }} -->
            <!--
            这里的 `url` 会是 undefined，因为其 (指该插槽的) 内容是
            _传递给_ <navigation-link> 的而不是
            在 <navigation-link> 组件*内部*定义的。
            -->
        </navigation-link>
        <p>后备内容（默认内容）</p>
        默认： <sumbit-button></sumbit-button>
        <br>
        修改：<sumbit-button>upload</sumbit-button>
        <p>具名插槽</p>
        <layout-com>
            <template slot="header">
                This is header
            </template>
            <template>
                this is main
            </template>
            <template slot="footer">
                this is footer
            </template>
        </layout-com>
        <p>作用域插槽</p>
        <current-user :user="user">
            <template v-slot:default="slotProps">
                firstName: {{ slotProps.user.firstName }}
                lastName: {{ slotProps.user.lastName }}
            </template>
        </current-user>
    </div>
    <script>
        Vue.component("navigation-link", {
            template: `
                <div>
                    <a
                    v-bind:href="url"
                    class="nav-link"
                    target="_blank" >
                    <slot></slot>
                    </a>
                </div>
            `,
            props: ['url']
        })

        Vue.component("sumbit-button", {
            template: `
            <button type="submit" >
                <slot>Save</slot>
            </button>
            `
        })

        Vue.component("layout-com", {
            template: `
                <div>
                    <div class="container">
                    <header>
                        <slot name="header"></slot>
                    </header>
                    <main>
                        <slot></slot>
                    </main>
                    <footer>
                        <slot name="footer"></slot>
                    </footer>
                    </div>
                </div>
            `,
        })

        Vue.component('current-user', {
            template: `
                <div>
                    <span>
                    <slot v-bind:user="user">
                        {{ user.lastName }}
                    </slot>
                    </span>
                </div>
            `,
            props: ['user']
        })
        var vm = new Vue({
            el: "#app",
            data: {
                user: {
                    firstName: "Amumu",
                    lastName: "12138"
                }
            }
        })
    </script>
</body>

</html>
