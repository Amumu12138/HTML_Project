<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15、组件基础02</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        li {
            list-style: none;
        }

        .demo-alert-box {
            background-color: red;
        }
    </style>
</head>

<body>
    <div id="app">
        <p> ---监听子组件事件--- </p>
        <div :style="{ fontSize: postFontSize + 'em' }">
            <blog-post v-for="post in posts" v-bind:key="post.id" v-bind:post="post" v-on:enlarge-text="onEnlargeText">
            </blog-post>
        </div>
        <p style="font-weight: bold;"> --- v-model本质 --- </p>
        v-model: <input v-model="searchText">
        searchText: <span>{{searchText}}</span>
        <br>
        v-bind:value + v-on:input--> <input v-bind:value="searchText02" v-on:input="searchText02Fun">
        searchText02: <span>{{searchText02}}</span>
        <p> --- 在组件上使用v-model --- </p>
        <!-- <custom-input v-model="searchText03"></custom-input> -->
        <custom-input :value="searchText03" @input="searchText03 = $event"></custom-input>
        custom-input searchText03: <span>{{searchText03}}</span>
        <p>--- 通过插槽分发内容 ---</p>
        <alert-box>
            Warning Amumu12138!
        </alert-box>
    </div>
    <script>
        Vue.component('blog-post', {
            props: ['post'],
            template: `
                    <div class="blog-post" >
                    <h3> title: {{ post.title }}</h3>
                    <button v-on:click="$emit('enlarge-text', 0.1)">
                        Enlarge text
                    </button>
                    <div v-html="post.content"></div>
                    </div>
                    `
        })
        // 自定义input组件 custom-input
        Vue.component('custom-input', {
            props: ['value'],
            template: `
                <input
                v-bind:value="value"
                v-on:input="$emit('input', $event.target.value)"
                >
            `
        })

        // 自定义提醒框alert-box
        Vue.component('alert-box', {
            template: `
                <div class="demo-alert-box">
                <strong>Error!</strong>
                <slot></slot>
                </div>
            `
        })
        var vm = new Vue({
            el: "#app",
            data: {
                posts: [
                    { id: 1, title: 'My journey with Vue', content: '<p> hello Amumu <p>' },
                    { id: 2, title: 'Blogging with Vue', content: '<p> hello Amumu <p>' },
                    { id: 3, title: 'Why Vue is so fun', content: '<p> hello Amumu <p>' }
                ],
                postFontSize: 1,
                searchText: '',
                searchText02: '',
                searchText03: ''
            },
            methods: {
                onEnlargeText: function (enlargeAmount) {
                    console.log('Amumu onEnlargeText enlargeAmount -->', enlargeAmount)
                    this.postFontSize += enlargeAmount
                },
                searchText02Fun(event) {
                    console.log('Amumu searchText02Fun event-->', event)
                    this.searchText02 = event.target.value
                }
            }
        })
    </script>
</body>

</html>
