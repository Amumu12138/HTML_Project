<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5、计算属性</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <p>Original message: "{{ message }}"</p>
        <p>Computed reversed message: "{{ reversedMessage }}"</p>
        <p>NOW: {{now}}</p>
        <p>nowMethods: {{nowMethods()}}</p>
    </div>
    <script>
        var vm = new Vue({
            el: "#app",
            data: {
                message: 'HEELO VUE'
            },
            // 计算属性
            computed: {
                reversedMessage() {
                    return this.message.split('').reverse().join('')
                },
                now: function () {
                    return Date.now()
                }
            },
            methods: {
                nowMethods() {
                    return Date.now()
                }
            }
        })
    </script>
</body>

</html>
