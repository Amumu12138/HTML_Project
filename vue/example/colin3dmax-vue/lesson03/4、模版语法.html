<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4、模版语法</title>

    <!-- 开发环境版本，包含了有帮助的命令行警告 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <span>Message: {{ msg }}</span>
        <br>
        <!-- 通过使用 v-once 指令，你也能执行一次性地插值，当数据改变时，插值处的内容不会更新 -->
        <span v-once>这个将不会改变: {{ msg }}</span>
        <br>
        <p>Using v-html directive: <span v-html="rawHtml"></span></p>
        <div v-bind:id="dynamicId"> this is header </div>
        <button v-bind:disabled="isButtonDisabled">Button</button>

        <p v-if="seen === 1">我是v-if</p>
        <p v-else-if="seen === 2"> 我是v-else-if </p>
        <p v-else> 我是v-else </p>

        <form action="/register" v-on:submit.prevent="onSubmit">
            <button type="submit">
                点击sumbit
            </button>
        </form>

        <input type="text" placeholder="enter触发" @keyup.enter="onEnter">
    </div>
    <script>

        var vm = new Vue({
            el: '#app',
            data() {
                return {
                    message: '我是你爸爸',
                    msg: 1,
                    rawHtml: '<p style="color:red;"> This shoulf be red</p>',
                    dynamicId: 'header',
                    isButtonDisabled: undefined, //false, null, undefined
                    seen: 0
                }
            },
            created() {
                setInterval(() => {
                    this.msg++
                    this.seen++
                }, 1000)
            },
            methods: {
                onSubmit() {
                    alert("onSubmit click")
                },
                onEnter() {
                    alert("onEnter click")
                }
            }
        })

    </script>
</body>

</html>
