<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>记事本</title>
    <script src="../../libs/vue.js"></script>
    <link href="../../css/style.css" rel="stylesheet">
</head>

<body>
    <div id="app">
        <div class="note-frame">
            <p class="note-title">记事本</p>
            <input type="text" class="note-input" v-model="noteParam" @keyup.enter="add(noteParam)">
            <ul>
                <li v-for="(item, index) in array" @click="remove(index)">{{ item }} </li>
            </ul> 
            <div class="flex" >
                <h1 class="note-bottom-left-text" v-show="array.length > 0"> length is {{ array.length}}</h1>
                <h1 class="note-bottom-right-text" v-show="array.length > 0" @click="clear"> clear </h1>
            </div>
        </div>
       
    </div>
    <script>
        //功能实现： 新增、删除、统计、清空、隐藏
        //实例化vue
       var app = new Vue({
            el: "#app",
            data: {
                array: ["笔记一", "笔记二", "笔记三"],
                noteParam: "新笔记"
            },
            methods: {
                //新增
                add: function(arg) {
                    this.array.push(arg);
                },
                //删除
                remove: function(index) {
                    this.array.splice(index, 1);
                },
                //清空
                clear: function() {
                    this.array = [];
                }
            }
       });
    </script>
</body>

</html>
