<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Matter-JS</title>
    <script src="./js/matter2.js"></script>
    <script src="./example/Test.js"></script>
    <script src="./example/Demo.js"></script>
    <script src="./example/Stack.js"></script>
    <script src="./example/MouseConstraint.js"></script>
    <script src="./example/Constraint.js"></script>
    <script src="./example/NewtonsCradle.js"></script>
    <script src="./example/Chain.js"></script>
    <script src="./example/SoftBody.js"></script>
    <script src="./example/Car.js"></script>
    <script src="./example/Cross.js"></script>

    <link href="/webgl/css/common.css" rel="stylesheet">
</head>

<body>
    <button class="common-matter-btn" style="position: absolute;" onclick="window.history.back();">Back</button>
    <script type="text/javascript">
        //返回上一层级
        var matterName = window.localStorage.getItem("matterName");
        switch(matterName) {
            case "Test":
                Example.Test();
                break;
            case "Car":
                Example.Car();
                break;
            case "Chain":
                Example.Chain();
                break;
            case "Constraint":
                Example.Constraint();
                break;
            case "Cross":
                Example.Cross();
                break;
            case "Demo":
                Example.Demo();
                break;
            case "MouseConstraint":
                Example.MouseConstraint();
                break;
            case "NewtonsCradle":
                Example.NewtonsCradle();
                break;
            case "SoftBody":
                Example.SoftBody();
                break;
            case "Stack":
                Example.Stack();
                break;
            default:
                break;
        }
        
    </script>
</body>

</html>
