<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type"/>
    <meta content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no"
          name="viewport">
    <meta content="telephone=no" name="format-detection">
    <meta content="yes" name="apple-mobile-web-app-capable"/>
    <meta content="yes" name="mobile-web-app-capable"/>
    <meta content="true" name="full-screen"/>
    <meta content="portrait" name="screen-orientation"/>
    <!-- 渠道商: 成都游鑫 -->
    <title>修罗道</title>

    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">

    <script src="/js/jquery/jquery-1.9.1.min.js" type="text/javascript"></script>
    <script src="/js/jquery/jquery.md5.js" type="text/javascript"></script>
    <script src="/js/pj_api.js" type="text/javascript"></script>
    <script src="/js/pj_channel_sdk.js" type="text/javascript"></script>
    <script src="/js/pj_sdk_host.js" type="text/javascript"></script>
    <!-- 引入SDK   -->
    <script src="https://staticjs.quickapi.net/static/lib/libQuickSDK_v2.js" type="text/javascript"></script>

    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%
        }

        body {
            /*
			background: url(https://h5.infoxgame.com/images/duojiao_loading.png) no-repeat center top;
*/
            background-size: auto 100%;
        }
    </style>

</head>

<body>

<script type="text/javascript">
    $(function () {
        //初始化渠道sdk
        pjChannelSdk.init(11121, "xld_cdyx_sm_001", "1.0.0");
        sdk.init3("11121", "xld_cdyx_sm_001");
        console.info("Amumu initSDKsuccess......");

        //获取游戏信息
        pjChannelSdk.getGameInfo(function (retData) {
            console.info("Amumu getGameInfo return params +++" + JSON.stringify(retData));
            if (retData.code == 1) {
                var gameName = retData.data.gameName;
                $(document).attr("title", gameName);
                var gameUrl = retData.data.gameUrl;
                var orientation = retData.data.orientation;

                //调用渠道SDK 初始化方法
                var productCode = '31064611248720087877846327738151'; //QuickSDK后台自动分配
                var productKey = '25872094'; //QuickSDK后台自动分配
                QuickSDK.init(productCode, productKey, true, function () {
                    console.log("Amumu init success");
                });

                QuickSDK.login(function (callbackData) {
                    var message;
                    if (callbackData.status) {
                        //不同的渠道使用不同的拼接方式,
                        var extension = JSON.stringify({
                            "uid": callbackData.data.uid,
                            "username": callbackData.data.username,
                            "token": callbackData.data.token,
                            "isLogin": callbackData.data.isLogin,
                            "channelId": callbackData.data.channelId
                        });
                        console.info("--------Amumu reuqest params--------:" + JSON.stringify(extension));

                        pjChannelSdk["uid"] = callbackData.data.uid;
                        pjChannelSdk["username"] = callbackData.data.username;
                        //校验渠道token
                        pjChannelSdk.getToken(extension, function (retData) {
                            console.info("Amumu getToken return params-------：" + JSON.stringify(retData));
                            if (retData.code == 1) {
                                var gameParam = {};
                                var params = pjChannelSdk.uid;
                                gameParam["uid"] = retData.data.userInfo.uid;
                                gameParam["sdkToken"] = retData.data.userInfo.token;
                                gameUrl = pjapi.buildURL(gameUrl, gameParam);

                                console.log("===Amumu join Game===>>" + gameUrl);
                                if (orientation == 0) { //横屏游戏
                                    $("body").append(
                                        '<div id="gameFrameDiv" style="width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl +
                                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                                    );
                                    window.onorientationchange = function () {
                                        if (window.orientation == 90 || window.orientation == -90) {
                                            $("#gameFrameDiv").css({
                                                "left": $(window).width() - 20,
                                                "top": "30%"
                                            });
                                        }
                                    }
                                } else { //竖屏游戏
                                    $("body").append(
                                        '<div id="gameFrameDiv" style="width: ' + $(window).width() + 'px;  height: ' +
                                        $(window).height() + 'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl +
                                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                                        $(window).width() + 'px; height: ' + $(window).height() + 'px;"></iframe></div>');
                                }
                            } else {
                                pjapi.confirmDialog(retData.msg);
                            }
                        });
                        console.log('Amumu Quick Game:QuickSDK loginSuccess: uid=>' + callbackData.data.uid);
                    } else {
                        console.log('Amumu Quick Game QuickSDK loginFail:' + callbackData.data.message);
                    }
                    //开启监听事件
                    pjChannelSdk.startEventListener();
                });

                 //Quick切换账号回调方法
                 QuickSDK.setSwitchAccountNotification(function (callbackData) {
                    console.log('Amumu Quick setSwitchAccountNotification callbackData = ', callbackData);
                    if (callbackData.status) {
                        console.log('Amumu Quick setSwitchAccountNotification data=>' + JSON.stringify(callbackData.data));
                        //不同的渠道使用不同的拼接方式
                        var extensionSwitch = JSON.stringify({
                            "uid": callbackData.data.uid, //渠道uid
                            "username": callbackData.data.username, //渠道username
                            "token": callbackData.data.token, //token
                            "isLogin": callbackData.data.isLogin, //是否游客,登陆后此值为true
                            "channelId": callbackData.data.channelId //渠道ID
                        });

                        //保存渠道用户信息
                        pjChannelSdk["uid"] = callbackData.data.uid;
                        pjChannelSdk["username"] = callbackData.data.username;
                        console.info("--------Amumu Quick setSwitchAccountNotification extensionSwitch--------:" + JSON.stringify(extensionSwitch));

                        //校验渠道token
                        pjChannelSdk.getToken(extensionSwitch, function (retData) {
                            console.info("Amumu getToken return params-------：" + JSON.stringify(retData));
                            if (retData.code == 1) {
                                var gameParam = {};
                                var params = pjChannelSdk.uid;
                                gameParam["uid"] = retData.data.userInfo.uid;
                                gameParam["sdkToken"] = retData.data.userInfo.token;
                                gameUrl = pjapi.buildURL(gameUrl, gameParam);

                                console.log("===进入游戏===>>" + gameUrl);
                                if (orientation == 0) { //横屏游戏
                                    $("body").append(
                                        '<div id="gameFrameDiv" style="width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl +
                                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                                    );
                                    window.onorientationchange = function () {
                                        if (window.orientation == 90 || window.orientation == -90) {
                                            $("#gameFrameDiv").css({
                                                "left": $(window).width() - 20,
                                                "top": "30%"
                                            });
                                        }
                                    }
                                } else { //竖屏游戏
                                    $("body").append(
                                        '<div id="gameFrameDiv" style="width: ' + $(window).width() + 'px;  height: ' +
                                        $(window).height() + 'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl +
                                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                                        $(window).width() + 'px; height: ' + $(window).height() + 'px;"></iframe></div>');
                                }
                            } else {
                                pjapi.confirmDialog(retData.msg);
                            }
                        });
                    }
                });

                //Quick注销账号回调
                QuickSDK.setLogoutNotification(function (logoutObject) {
                    console.log('Amumu Quick Game setLogoutNotification', JSON.stringify(logoutObject));
                    window.open("https://h5.paojiao.cn/channel/zgfsl/chengduyouxin/index.html");
                });

                //Quick开启账号回调
                QuickSDK.setSwitchAccountNotification(function(swtichAccountObject){
                    console.log('Amumu Quick Game setSwitchAccountNotification', JSON.stringify(swtichAccountObject));
	            });

                //Channel回调
                QuickSDK.setChannelEventNotification(function(channleEventObject){
                    console.log('Amumu Quick Game setChannelEventNotification', JSON.stringify(channleEventObject));
	            });

                //Resume回调
                QuickSDK.setOnResumeNotification(function(resumeObject){
                    console.log('Amumu Quick Game setOnResumeNotification', JSON.stringify(resumeObject));
                });

                //Stop回调
                QuickSDK.setOnStopNotification(function(stopObject){
                    console.log('Amumu Quick Game setOnStopNotification', JSON.stringify(stopObject));
	            });
            } else {
                pjapi.confirmDialog(retData.msg);
            }
        });
    });

    function receiveMessage(event) {
        console.log("Amumu receiveMessage event.data = ", JSON.stringify(event.data));
        var params = event.data.param;

        if (event.data.method == 'PJ_loadPayBox') { //拉起支付
            console.log("Amumu method PJ_loadPayBox");
            var payParam = {};

            payParam["channelGameId"] = pjChannelSdk.initData.channelGameId;
            payParam["appVersion"] = pjChannelSdk.initData.appVersion;
            payParam["channel"] = pjChannelSdk.initData.channel;
            payParam["sdkVersion"] = pjChannelSdk.sdkVersion;

            payParam["money"] = params["money"];
            payParam["uid"] = params["uid"];
            payParam["productName"] = params["goodsName"];
            payParam["roleId"] = params["roleId"];
            payParam["roleName"] = params["roleName"];
            payParam["serverId"] = params["serverId"];
            payParam["serverName"] = params["serverName"];
            payParam["description"] = params["description"];
            payParam["ext"] = params["ext"];
            payParam["cpOrderNo"] = params["cpOrderNo"];

            console.log("------------Amumu payParam--------------" + JSON.stringify(payParam));
            //生成融合sdk订单
            pjChannelSdk.getOrderNo(payParam, function (retData) {
                if (retData.code == 1) {
                    console.log("Amumu getOrderNo" + JSON.stringify(retData));
                    // var _d = retData.data.extension.split("_");
                    // var extStr = decodeURIComponent(pjChannelSdk.extStr);
                    var orderInfo = {};
                    orderInfo.productCode = '31064611248720087877846327738151';
                    orderInfo.uid = retData.data.orderInfo.sdkUserId;
                    orderInfo.username = pjChannelSdk.username;
                    orderInfo.userRoleId = retData.data.orderInfo.roleId;
                    orderInfo.userRoleName = retData.data.orderInfo.roleName;
                    orderInfo.serverId = retData.data.orderInfo.serverId;
                    orderInfo.userServer = retData.data.orderInfo.serverName;
                    orderInfo.userLevel = 1;
                    orderInfo.cpOrderNo = retData.data.orderInfo.orderNumber;
                    orderInfo.amount = retData.data.orderInfo.money;
                    orderInfo.subject = retData.data.orderInfo.goodsName;
                    orderInfo.desc = retData.data.orderInfo.goodsName;
                    orderInfo.callbackUrl = '';
                    orderInfo.extrasParams = retData.data.orderInfo.orderNumber;
                    orderInfo.goodsId = '1001';
                    orderInfo.count = 1;
                    orderInfo.quantifier = '个';
                    var orderInfoJson = JSON.stringify(orderInfo);
                    console.log('Amumu QiZhi Game orderInfoJson = ' + orderInfoJson);
                    QuickSDK.pay(orderInfoJson, function (payStatusObject) {
                        console.log('Amumu QiZhi Game payStatusObject = ' + JSON.stringify(payStatusObject));
                    })
                } else {
                    pjapi.confirmDialog(retData.msg);
                }
            });
            //上报角色信息
        } else if (event.data.method == 'PJ_reportRoleInfo') {
            sdk.reportRoleInfo(params);
            console.info("--------Amumu PJ_reportRoleInfo params--------:" + JSON.stringify(params));
            var isCreateRole = false;
            //判断是否为创建角色
            if (params["roleType"] == 2) {
                isCreateRole = true;
                window.localStorage.setItem("pj_quick_createRoleTime", params["time"]);
                console.log("Amumu create roleCreateTime = ", params["time"]);
            }
            console.log("Amumu roleCreateTime = ", window.localStorage.getItem("pj_quick_createRoleTime"));
            var roleInfo = {};
            roleInfo.isCreateRole = isCreateRole;
            roleInfo.roleCreateTime = window.localStorage.getItem("pj_quick_createRoleTime") || "0";
            roleInfo.uid = pjChannelSdk.uid;
            roleInfo.username = pjChannelSdk.username;
            roleInfo.serverId = params["serverid"];
            roleInfo.serverName = params["servername"];
            roleInfo.userRoleName = params["roleName"];
            roleInfo.userRoleId = params["roleid"];
            roleInfo.userRoleBalance = params["roleMoney"];
            roleInfo.vipLevel = params["vip"];
            roleInfo.userRoleLevel = params["roleLever"];
            roleInfo.partyId = 1;
            roleInfo.partyName = '无';
            roleInfo.gameRoleGender = '';
            roleInfo.gameRolePower = '';
            roleInfo.partyRoleId = '';
            roleInfo.partyRoleName = '';
            roleInfo.professionId = '';
            roleInfo.profession = '';
            roleInfo.friendlist = '';
            var roleInfoJson = JSON.stringify(roleInfo);
            console.info("------Amumu roleInfoJson = --------" + roleInfoJson);
            QuickSDK.uploadGameRoleInfo(roleInfoJson, function (response) {
                console.info("-------Amumu response = ------" + JSON.stringify(response));
            });
        }else if (event.data.method == 'PJ_backLogin') {
            console.info("--------Amumu PJ_backLogin params--------:" + JSON.stringify(params));
            //设置4s后重新调起SDK登录
            setTimeout(function(){//定时器版
                console.info("Amumu PJ_backLogin start -------");
                //调用渠道SDK 初始化方法
                var productCode = '31064611248720087877846327738151'; //QuickSDK后台自动分配
                var productKey = '25872094'; //QuickSDK后台自动分配
                QuickSDK.init(productCode, productKey, true, function () {
                    console.log("Amumu PJ_backLogin init success");
                });

                QuickSDK.login(function (callbackData) {
                    var message;
                    if (callbackData.status) {
                        pjChannelSdk["uid"] = callbackData.data.uid;
                        pjChannelSdk["username"] = callbackData.data.username;
                        console.log("Amumu PJ_backLogin login success");
                    }
                });
            }, 4000);   
        }
    }
</script>
</body>

</html>
