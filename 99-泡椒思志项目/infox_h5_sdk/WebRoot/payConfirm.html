<!DOCTYPE html>
<html>
	<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"  content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <meta name="full-screen" content="true"/>
    <meta name="screen-orientation" content="portrait"/>
    <meta name="x5-fullscreen" content="true"/>
	<title>支付结果确认</title>
	<link href="/css/common.css?20171011" rel="stylesheet">
	<link href="/css/layout.css?20171011" rel="stylesheet">
	<script type="text/javascript" src="/js/jquery/jquery-1.9.1.min.js"></script>
	
	</head>
	 
	<body>
	
	
	
		<script type="text/javascript">
	
	
	confirmDialog("","已经完成支付","放弃支付",function(){ 
		window.location.href="/main.html";
	},function(){
		window.location.href="/main.html";
	},"确认支付信息");      
	
	function confirmDialog(txt, oklabel, cancellabel, okcallback, cancelcallback, title, callback) {
	    var html = '<div id="confirmDialog" class="mask dialog-box">';
	    html += '<div class="r5">';
	    html += "<div>" + (title ? title: "提示信息") + "</div>";
	    html += "<div>" + txt + "</div>";
	    html += '<div class="flex">';
	    html += '<a href="javascript:;" data-type="cancel" class="flex-list unselect">' + (cancellabel ? cancellabel: "关闭") + "</a>";
	    if (oklabel) {
	        html += '<a href="javascript:;" data-type="ok" class="flex-list unselect ok">' + oklabel + "</a>";
	    }
	    html += "</div></div></div>";
	    $("body").append(html); 
	    if (callback) { 
	        callback();
	    }
	    $("#confirmDialog .flex a").click(function() {
	        var type = $(this).attr("data-type");
	        if (type == "cancel") {
	            if (cancelcallback) {
	                cancelcallback();
	            }
	        } else if (type == "ok") {
	            if (okcallback) {
	                okcallback();
	            }
	        }
	        $(this).parents("#confirmDialog").remove();
	    }) 
	};
	 
	</script>
	
	</body>
	
	
	

</html>
