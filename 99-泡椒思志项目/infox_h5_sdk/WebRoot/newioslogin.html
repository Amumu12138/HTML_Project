<script>


    //paraName 等找参数的名称
    function GetUrlParam(paraName) {
        var url = document.location.toString();
        var arrObj = url.split("?");

        if (arrObj.length > 1) {
            var arrPara = arrObj[1].split("&");
            var arr;

            for (var i = 0; i < arrPara.length; i++) {
                arr = arrPara[i].split("=");

                if (arr != null && arr[0] == paraName) {
                    return arr[1];
                }
            }
            return "";
        }
        else {
            return "";
        }
    }

    var dynamicLoading = {
        css: function (path) {
            if (!path || path.length === 0) {
                throw new Error('argument "path" is required !');
            }
            var head = document.getElementsByTagName('head')[0];
            var link = document.createElement('link');
            link.href = path;
            link.rel = 'stylesheet';
            link.type = 'text/css';
            head.appendChild(link);
        },
        js: function (path) {
            if (!path || path.length === 0) {
                throw new Error('argument "path" is required !');
            }
            var head = document.getElementsByTagName('head')[0];
            var script = document.createElement('script');
            script.src = path;
            script.type = 'text/javascript';
            head.appendChild(script);
        }
    }

    //判断Url 是否正确
    function isUrlCorrect() {
        var userAgent = window.window.navigator.userAgent;
        var edition = GetUrlParam("edition");
        var gameId = GetUrlParam("gameId");
        var channelId = GetUrlParam("channelId");
        var isShow = GetUrlParam("isShow");
        if (gameId == "" || channelId == "" || edition == ""){
            return;
        }
        if (edition == "" && edition.length <=0 ){
            dynamicLoading.css("css/loading.css");
            dynamicLoading.css("css/layout.css?201905081655");
            dynamicLoading.css("css/common.css?201905081655");
            isRelease();
            return;
        }else{
            if (isShow != "" && isShow == 0) {
                dynamicLoading.css("css/loading.css");
                dynamicLoading.css("css/layout.css?201905081655");
                dynamicLoading.css("css/common.css?201905081655");
                isRelease();
                return;
            } else if (userAgent.indexOf('YjH13eA06') != -1 || userAgent.search("YjH13eA06") != -1 || "YjH13eA06".search(userAgent) != -1) {
                dynamicLoading.css("css/loading.css");
                dynamicLoading.css("css/layout.css?201905081655");
                dynamicLoading.css("css/common.css?201905081655");
                isRelease();
                return;
            } else {
              //  $("body").removeClass("background-image");
                return;
            }
        }
    }
    isUrlCorrect();

    function isRelease(){
        sdk.init3();
        sdkApi.initLoading(function() {
            sdkApi.getGameInfo("true",function(ret) {
                if (ret.code == sdk.SUCCESS) {//成功
                    $(document).attr("title",ret.data.gameName);
                    sdk.autoLogin();
                    startEventListener();
                } else {
                    sdkApi.confirmDialog("获取游戏信息失败");
                    return;
                }
            });
        });
    }

    function startEventListener(){
        sdk.getDeviceMumber();
        window.addEventListener("message", receiveMessage, false);

        function receiveMessage(event) {
            switch (event.data.method) {
                case "fotPwdCallback": {//关闭忘记密码
                    sdkApi.closeFotPwdBox();
                    sdkApi.loadLoginBox();
                    break;
                }
            }
        }
    }
</script>
