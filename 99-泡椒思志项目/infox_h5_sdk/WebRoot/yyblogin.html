		window.Javascript.login1go();

			if(!b){

			}
			
		})
		
	});
	
		var b = false;
		function clock(){
		  b = false;	
		}
		
		function login2go(sdkToken,uid){
			sdk.setItem("sdkToken",sdkToken);
			sdk.setItem("uid",uid);
			window.location.href= "https://h5.infoxgame.com/yybmain.html";
		}
