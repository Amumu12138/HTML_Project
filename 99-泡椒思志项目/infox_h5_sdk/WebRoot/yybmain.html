	<body style="overflow: hidden;">
	 	 
		<script type="text/javascript">
		sdk.init2();
		
		//页面主方法
		function start(){
			
			//获取游戏信息
			sdk.getGameInfo("false",function(ret){
				
				if (ret.code == sdk.SUCCESS) {//成功
					 sdk.gameInfo = ret.data;
		        	 var gameName = sdk.gameInfo.gameName;
		        	 $(document).attr("title",gameName);
		        		loadGame(sdk.gameInfo);
						
				} else {
					sdk.confirmDialog("获取游戏信息失败");
					return;
				}
 
			});	
		}
		
		
		
		
		//加载游戏
		function loadGame(gameInfo){
			
			var gameUrl = gameInfo.mainUrl;
			gameUrl =  sdk.setURLVar(gameUrl,"sdkToken",sdk.getItem("sdkToken")); 
			gameUrl =  sdk.setURLVar(gameUrl,"uid",sdk.getItem("uid"));
			
			if(gameInfo.userId == 0){//横屏游戏    
				
                $("body").append('<div id="gameFrameDiv" style="width: 100%; height: 100%; position: absolute; display:none; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl + '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>');
                
		     	window.onorientationchange = function () { 
                    if (window.orientation == 90 || window.orientation == -90) {
                        $("#gameFrameDiv").css({"left": $(window).width() - 20, "top": "30%"});  
                    }    
                }
			
			}else{//竖屏游戏 
				$("body").append('<div id="gameFrameDiv" style="width: ' + $(window).width() + 'px; height: ' + $(window).height() + 'px; position: relative; display:none; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl + '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' + $(window).width() + 'px; height: ' + $(window).height() + 'px;"></iframe></div>');
			}
			$("#gameFrameDiv").fadeIn(1000);
			
		/* 	sdk.enableFloatBox(); */
		}

		
		//开始消息监听
		function startEventListener(){
			
			
			
			 window.addEventListener("message", receiveMessage, false);
			 
				function  receiveMessage(event){
					sdk.log("host receive data",event.data);
					switch (event.data.method) {
					
					case "initLoading": {//加载loading页面
						sdk.initLoading();
						break;
				    }
					
					
					case "loadPayBox": {//拉起支付框
						var data = event.data.param;
						window.Javascript.loadPayBox(data.money,data.roleID,data.roleName,data.serverID,data.serverName,data.productName,data.extension,data.productDesc);
						break;
					}
					
					
					case "logout": {//退出登录
					    sdk.logout();
						break;
					}

				}
			
		    }
		}
		
		//切换登录
		function backof(){
			window.history.forward(1);
		}
		
		
	    $(function(){
	    	//初始化
	    	start();
	    	
	    	 startEventListener();
	    	
	    
	    });
	   
	  
	   
 		function closeIframe(){
	    	if( $("#showUcBox").length > 0 ){
	 			sdk.closeUcBox();
	 			$("#gameFrame").focus();
	    	}
	    	
	    	if($("#payBox").length > 0){
	    		sdk.closePayBox();
	    		$("#gameFrame").focus();
	    	}
	    }
	   
	    	
	    
	  </script>
	</body>
