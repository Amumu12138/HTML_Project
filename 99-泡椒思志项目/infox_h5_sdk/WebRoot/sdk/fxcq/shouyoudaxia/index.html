    <title>封仙传奇</title>

    <link href="../../../css/layout.css?20171011" rel="stylesheet">

    <script type="text/javascript" src="../../../js/jquery/jquery-1.9.1.min.js"></script>
    <script type="text/javascript" src="../../../js/jquery/jquery.md5.js"></script>
    <script type="text/javascript" src="../../../js/channel.js"></script>
    <!-- 引入sdk -->
    <script tyep="text/javascript" src="https://www.g9x.com/Public/static/xigusdk/xgh5sdk.js"></script>

    <style type="text/css">
        body {

            background: url(https://res.yh.zyqgame.com/loadPage/loginres/Bm_Back2.jpg) no-repeat center top;
            background-size: auto 100%;
        }
    </style>

</head>

<body>

    <script type="text/javascript">
        $(function () {
            var cs = "http://localhost/infox_h5_sdk/api/";
            var zs = "https://h5.infoxgame.com/api/";
            channelSDK.init(false, zs, '10877230', '765681073');
            var _params = channelSDK.getURLParams();

            var extension = JSON.stringify({
                "channelExt": _params.channelExt,
                "email": "46",
                "game_appid": "040014480ACDA25FD",
                "new_time": _params.new_time,
                "loginplatform2cp": _params.loginplatform2cp,
                "user_id": _params.user_id,
                "sdklogindomain": _params.sdklogindomain,
                "sdkloginmodel": _params.sdkloginmodel,
                "sign": _params.sign,
                "icon": _params.icon,
                "nickname": decodeURIComponent(_params.nickname)
            });
            channelSDK["channelUserID"] = _params.user_id;
            channelSDK["channelExt"] = _params.channelExt;
            channelSDK["sdkloginmodel"] = _params.sdkloginmodel;

            console.log("Amumu sydx getCpToken extension = ", extension);
            channelSDK.getCpToken(extension, function (data) {
                var gameUrl = data.gameUrl + '&uid=' + data.userID + '&sdkToken=' + data.token;
                channelSDK["userID"] = data.userID;
                if (data.type == 0) { //横屏游戏    
                    $("body").append(
                        '<div id="gameFrameDiv" style=" display:none;  width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                        gameUrl +
                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                    );
                    window.onorientationchange = function () {
                        if (window.orientation == 90 || window.orientation == -90) {
                            $("#gameFrameDiv").css({
                                "left": $(window).width() - 20,
                                "top": "30%"
                            });
                        }
                    }
                } else { //竖屏游戏 
                    $("body").append('<div id="gameFrameDiv" style="display:none; width: ' + $(window)
                        .width() + 'px;  height: ' + $(window).height() +
                        'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                        gameUrl +
                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                        $(window).width() + 'px; height: ' + $(window).height() +
                        'px;"></iframe></div>');
                }
                setTimeout(function () {
                    $("#gameFrameDiv").fadeIn(1000);
                    $("#gameFrame").attr("src", gameUrl);
                }, 500);
            });
            channelSDK.startEventListener();
        });


        function receiveMessage(event) {
            //支付
            if (event.data.method == 'loadPayBox') {
                var params = event.data.param;

                params["userID"] = channelSDK.userID;
                params["appID"] = channelSDK.gameId;
                params["isTest"] = channelSDK.isTest;
                params["channelExt"] = channelSDK.channelExt;
                params["sdkloginmodel"] = channelSDK.sdkloginmodel;
                httpPost(channelSDK.host + "getOrderID", params, function (data, params) {
                    console.log("Amumu sydx getOrderID data = ", data, " params = ", params);
                    if (data.state == channelSDK.SUCCESS) {
                        var _d = data.data.extension;
                        var payJsondata = {
                            "amount": parseInt(params.money * 100),
                            "channelExt": channelSDK.channelExt,
                            "game_appid": "040014480ACDA25FD",
                            "props_name": params.productName,
                            "sdkloginmodel": channelSDK.sdkloginmodel,
                            "trade_no": data.data.orderID,
                            "user_id": channelSDK.channelUserID,
                            "sign": _d.split("_")[0],
                            "server_id": params.serverID,
                            "server_name": params.serverName,
                            "role_id": params.roleID,
                            "role_name": params.roleName
                        }
                        console.log("Amumu sydx getOrderID payJsondata = ", payJsondata);
                        //唤起支付页面
                        xgGame.h5paySdk(payJsondata, function (data) {
                            console.log("xgGame h5paySdk success data = ", data);
                        });

                    }
                });
            } else if (event.data.method == "reportRoleInfo") {
                //角色信息数据上报
                var params = event.data.param;
                var appkey = "klGkg44kCjBhBr7";
                var signPamras = "user_id=" + channelSDK.channelUserID + "&" +
                    "game_appid=" + "040014480ACDA25FD" + "&" +
                    "server_id=" + params.roleServerId + "&" +
                    "server_name=" + params.roleServerName + "&" +
                    "role_id=" + params.roleId + "&" +
                    "role_name=" + params.roleName + "&" +
                    "level=" + params.roleLever + appkey;
                var sign = $.md5(signPamras);

                var roleJsondata = {
                    "user_id": channelSDK.channelUserID, //运营方登录时传递的user_id
                    "game_appid": "040014480ACDA25FD", //游戏编号
                    "server_id": params.roleServerId, //区服id
                    "server_name": params.roleServerName, //区服名称
                    "role_id": params.roleId, //角色id
                    "role_name": params.roleName, //角色名
                    "level": params.roleLever, //角色等级
                    "sign": sign //签名
                }

                console.log("Amumu sydx getOrderID roleJsondata = ", roleJsondata);
                //调用角色数据上报接口
                xgGame.jointCreateRole(roleJsondata);

            }
        }
    </script>
</body>

</html>
