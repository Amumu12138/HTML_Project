            width: 100%;
            height: 100%

        body {

            background: url(https://h5.infoxgame.com/images/ydtl_loading.png) no-repeat center top;

<body>

<script type="text/javascript">
    $(function () {
        var cs = "http://localhost/infox_h5_sdk/api/";
        var zs = "https://h5.infoxgame.com/api/";
        channelSDK.init(false, zs, '10877125', '764641063');
        var _params = channelSDK.getURLParams();

        // 1758的自定义参数
        channelSDK["hlmygw"] = _params.hlmy_gw;
        var extension = JSON.stringify({
            "userToken": _params.userToken,
            "hlmy_gw": _params.hlmy_gw,
            "nonce": _params.nonce,
            "timestamp": _params.timestamp,
            "sign": _params.sign
        });//SDK验证需要参数
        console.info("请求服务验证参数："+JSON.stringify(extension));
        channelSDK["channelUserID"] = _params.uid;//渠道用户ID

        channelSDK.getCpToken(extension, function (data) {
            var gameUrl = data.gameUrl + '?uid=' + data.userID + '&sdkToken=' + data.token;
            //调用渠道初始化
            var hlmysdk = window.HLMY_SDK;
            hlmysdk.init({
                "gid": data.sdkUserID,        //通过"用户验证"接口获取到的1758平台gid
                "appKey": "e27b257ec494f1d167b0834a0b078fee",     //游戏的appkey
                "hlmy_gw": _params.hlmy_gw   //1758平台的自定义参数，CP通过授权回调地址后的参数获得
            });

            //该方法需要传递一个回调函数
            hlmysdk.checkRealNameCert(function (obj) {
                //obj为一个对象，obj.data.completed为用户实名认证状态
                //true为已认证，false为未认证
                if (!obj.data.completed) {
                    //该方法会弹出实名认证的界面，以便让用户填写实名认证信息
                    hlmysdk.showRealNameCert(function (obj) {
                        //obj为一个对象，obj.result为用户实名认证结果
                        //1为认证成功（需要给用户发送奖励），0为认证失败
                        console.info(obj);
                    });
                }
                console.info(obj);
            });
            channelSDK["userID"] = data.userID;
            if (data.type == 0) {//横屏游戏
                $("body").append('<div id="gameFrameDiv" style=" display:none;  width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl + '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>');
                window.onorientationchange = function () {
                    if (window.orientation == 90 || window.orientation == -90) {
                        $("#gameFrameDiv").css({"left": $(window).width() - 20, "top": "30%"});
                    }
                }
            } else {//竖屏游戏
                $("body").append('<div id="gameFrameDiv" style="display:none; width: ' + $(window).width() + 'px;  height: ' + $(window).height() + 'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' + gameUrl + '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' + $(window).width() + 'px; height: ' + $(window).height() + 'px;"></iframe></div>');
            }
            setTimeout(function () {
                $("#gameFrameDiv").fadeIn(1000);
                $("#gameFrame").attr("src", gameUrl);
            }, 500);
        });
        channelSDK.startEventListener();

    });

    //支付
    function receiveMessage(event) {
        if (event.data.method == 'loadPayBox') {
            var params = event.data.param;
            params["userID"] = channelSDK.userID;
            params["appID"] = channelSDK.gameId;
            params["isTest"] = channelSDK.isTest;
            params["hlmygw"] = channelSDK.hlmygw;
            httpPost(channelSDK.host + "getOrderID", params, function (data, params) {
                if (data.state == channelSDK.SUCCESS) {
                    var _d = data.data.extension;
                    var payData = {
                        "paySafecode": _d,//通过“统一下单接口”返回的支付安全码
                        "callback": function (data) { //callback 不能保证一定会回调
                            console.info(data);// data为object，格式为{status:1}
                        }
                    };
                    console.info("支付参数：" + JSON.stringify(payData));
                    //json  渠道支付需要参数
                    HLMY_SDK.pay(payData);
                }
            });
            // 上报角色信息
        } else if (event.data.method == 'reportRoleInfo') {
            var params = event.data.param;
            var flage = false;
            var nowTime = new Date().getTime();
            //等级为1时 证明是新创建的角色
            if (params.roleLever == 1) {
                flage = true;
            }
            var json = {
                "serverId": params.roleServerId,//区服id
                "serverName": params.roleServerName,//区服名称
                "isNewRole": flage,//是否是新创建的角色
                "roleId": params.roleId,//角色id
                "roleName": params.roleName,//角色名称
                "roleLevel": params.roleLever,//角色级别
                "roleCoins": params.roleMoney,//角色当前的财富值
                "roleCreateTime": nowTime,//角色创建时间
                "gameRolePower": params.roleLever//角色战力值
            };
            console.info("角色上报参数：" + JSON.stringify(json));
            //json  渠道创角需要参数
            window.HLMY_SDK.roleInfo(json);
        }
    }
</script>
</body>
</html>
