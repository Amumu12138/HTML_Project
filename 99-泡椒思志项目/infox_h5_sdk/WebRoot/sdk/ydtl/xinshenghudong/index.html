    <title>奇迹屠龙</title>

    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%
        }

        body {

            background: url(https://h5.infoxgame.com/images/ydtl_loading.png) no-repeat center top;
            background-size: auto 100%;
            /* background-repeat:no-repeat; background-size:100% 100%;-moz-background-size:100% 100%;*/
        }
    </style>

</head>

<body>

    <script type="text/javascript">
        $(function () {
            var cs = "http://localhost/infox_h5_sdk/api/";
            var zs = "https://h5.infoxgame.com/api/";
            channelSDK.init(false, zs, '10877125', '764641075');
            var _params = channelSDK.getURLParams();


            console.log("Amumu xshd _params = ", _params);

            var extension = JSON.stringify({
                "uid": _params.uid,
                "gameId": "48734",
                "sign": _params.sign
            }); //SDK验证需要参数
            channelSDK["channelUserID"] = _params.uid; //渠道用户ID

            console.log("Amumu xshd extension = ", extension);
            channelSDK.getCpToken(extension, function (data) {
                var gameUrl = data.gameUrl + '?uid=' + data.userID + '&sdkToken=' + data.token;
                channelSDK["userID"] = data.userID;
                if (data.type == 0) { //横屏游戏
                    $("body").append(
                        '<div id="gameFrameDiv" style=" display:none;  width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                        gameUrl +
                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                    );
                    window.onorientationchange = function () {
                        if (window.orientation == 90 || window.orientation == -90) {
                            $("#gameFrameDiv").css({
                                "left": $(window).width() - 20,
                                "top": "30%"
                            });
                        }
                    }
                } else { //竖屏游戏
                    $("body").append('<div id="gameFrameDiv" style="display:none; width: ' + $(window)
                        .width() + 'px;  height: ' + $(window).height() +
                        'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                        gameUrl +
                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                        $(window).width() + 'px; height: ' + $(window).height() +
                        'px;"></iframe></div>');
                }
                setTimeout(function () {
                    $("#gameFrameDiv").fadeIn(1000);
                    $("#gameFrame").attr("src", gameUrl);
                }, 500);
            });
            channelSDK.startEventListener();

        });

        //支付
        function receiveMessage(event) {
            if (event.data.method == 'loadPayBox') {

                var params = event.data.param;
                params["userID"] = channelSDK.userID;
                params["appID"] = channelSDK.gameId;
                params["isTest"] = channelSDK.isTest;
                httpPost(channelSDK.host + "getOrderID", params, function (data, params) {
                    console.log("Amumu getOrderID data = ", data, " params = ", params);
                    if (data.state == channelSDK.SUCCESS) {
                        var _d = data.data.extension;

                        var url = "https://api.ehw8.com/game/v1/pay" + "?orderno=" + _d.split("_")[1] +
                            "&sign=" + _d.split("_")[0];
                        //json  渠道支付需要参数
                        console.log("Amumu getOrderID url = ", url);
                        //渠道支付接口
                        iframePay.open(url, onclose);
                    }
                });
                // 上报角色信息
            } else if (event.data.method == 'reportRoleInfo') {
                var params = event.data.param;
                console.log("Amumu xshy reportRoleInfo param = ", params);

                var type = "";
                //判断上报类型
                if (params.roleLever == 1) {
                    type = "createRole";
                } else {
                    type = "login";
                }

                var roleParam = {};
                roleParam["type"] = type;
                roleParam["uid"] = channelSDK.channelUserID;
                roleParam["gameId"] = "48734";
                roleParam["roleId"] = params.roleId;
                roleParam["roleName"] = params.roleName;
                roleParam["roleLevel"] = params.roleLever;
                roleParam["serverId"] = params.roleServerId;
                roleParam["serverName"] = params.roleServerName;
                roleParam["channelID"] = "764641075";

                var roleUrl = sdkApi.buildURL("https://third.sdk.paojiao.cn/channel/roleReport/xshd.html", roleParam);
                $.ajax({
                    type: "GET",
                    url: roleUrl,
                    dataType: "jsonp",
                    success: function (data) {
                        console.log("Amumu xshd roleReport data = ", data);
                    }
                });

            }
        }
    </script>
</body>

</html>
