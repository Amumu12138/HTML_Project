<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>防抖</title>
</head>

<body>
    <h1>防抖</h1>
    <input class="input" />
    <script>
        // 防抖实现
        const debounce = (func, wait = 0) => {
            // 开启定时器,保存定时器id
            let timeId = null;

            return function (...args) {
                console.log(this, args);
                // 如果上个定时器存在,清除已开启的定时器
                if (timeId) {
                    clearTimeout(timeId)
                }

                timeId = setTimeout(() => {
                    func.apply(this, args)
                }, wait)
            }

        }

        const handleInput = (e) => {
            console.log("handleInput value", e.target.value);
        }

        const debounceFunc = debounce(handleInput, 500)

        document.querySelector('.input').addEventListener('input', debounceFunc);
    </script>
</body>

</html>
