<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch</title>
</head>

<body>
    <h1>fecch练习</h1>
    <script>
        // fecch练习
        async function func() {
            const params = {
                pname: '广东省',
                cname: '深圳市'
            }
            const paramsStr = (new URLSearchParams(params)).toString()
            console.log('paramsStr', paramsStr);

            const res = await fetch(`http://hmajax.itheima.net/api/area?${paramsStr}`)
            console.log('res -> ', res);

            const SUCCESS_CODE = 200;
            if (res.status === SUCCESS_CODE) {
                const data = await res.json();
                console.log(
                    'data ->', data
                );
            }
        }

        func()
    </script>
</body>

</html>
