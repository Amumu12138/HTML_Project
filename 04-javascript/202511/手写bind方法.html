<body>
    <h1>手写myBind方法</h1>
    <script>
        Function.prototype.myBind = function (thisArg, ...args) {
            return (...reArgs) => {
                return this.call(thisArg, ...args, ...reArgs);
            }
        }

        const person = {
            name: 'person',
        }

        const add = function (numA, numB) {
            console.log('add', this, this.name, numA, numB);

            return numA + numB;
        }

        const bindFunc = add.myBind(person, 1)
        console.log('bindFunc, person ', bindFunc, person);
        console.log(bindFunc(12))
