<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写myCall方法</title>
</head>

<body>
    <h1>手写myCall方法</h1>
    <script>
        Function.prototype.myCall = function (thisArg, ...args) {
            // Symbol优化
            const key = Symbol('key');
            thisArg[key] = this;
            console.log(thisArg, typeof thisArg, typeof thisArg[key])
            const result = thisArg[key](...args)
            console.log('result', result, this)
            return result;
        }

        const person = {
            name: 'person',
            // 跟myCall方法中添加thisArg[Symbol('key')]不同
            [Symbol('key')]: function (params) {
                console.log(params)
            }
        }

        const add = function (numA, numB) {
            console.log('add', this, this.name);

            return numA + numB;
        }

        const res = add.myCall(person, 1, 2)
        console.log('res = ', res, person)
    </script>
</body>

</html>
