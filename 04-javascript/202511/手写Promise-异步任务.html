<!DOCTYPE html>

<head>

    <title>手写Promise-异步任务</title>
</head>

<body>
    <h1>手写Promise-异步任务</h1>
    <script>
        // queueMicrtotask
        console.log('111');

        setTimeout(() => {
            console.log('setTimeout called');

        })
        // 微任务是 JavaScript 异步编程中的一种机制，优先级高于宏任务（如 setTimeout）
        queueMicrotask(() => {
            console.log('queueMicrotask called');
        })
        console.log('222');
        // 输出顺序：111-> 222 -> queueMicrotask called -> setTimeout called
