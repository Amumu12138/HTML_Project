<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>如何指定this的值</title>
</head>

<body>
    <h2>如何指定this的值</h2>
    <script>
        const food = {
            name: 'food',
            eat: function () {
                console.log(this); // {name: 'food', eat: f}
                setTimeout(function () {
                    console.log(this) // window
                }, 1000)
            },
            view: function () {
                console.log(this); // {name: 'food', eat: f, view: f}
                setTimeout(() => {
                    console.log(this); // {name: 'food', eat: f, view: f} 
                }, 2000)
            }
        }

        food.eat();
        food.view();
    </script>
</body>

</html>
