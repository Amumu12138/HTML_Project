<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3.6语句</title>
</head>

<body>
    <script>
        // do-while 语句
        let i = 0;
        do {
            i += 2;
        } while (i < 10);
        console.log(i);

        // for-in 语句
        for (const propName in window) {
            document.write(`<p>window属性: ${propName}</p>`)
        }

        // for-of 语句
        for (const el of [2, 4, 6, 8, 10]) {
            console.log(el);// 2 4 6 8 10
        }

        // break和continue 语句
        let num = 0;
        for (let i = 1; i < 10; i++) {
            if (i % 5 === 0) {
                break;
            }
            num++;
        }

        console.log('num -->', num); // 4

        let num02 = 0;
        for (let i = 1; i < 10; i++) {
            if (i % 5 === 0) {
                continue;
            }
            num02++;
        }

        console.log('num02 -->', num02); // 8

        let num03 = 0;
        outermost: for (let i = 0; i < 10; i++) {
            for (let j = 0; j < 10; j++) {
                if (i === 5 && j === 5) {
                    break outermost;
                }
                num03++;
            }
        }

        console.log('num03 -->', num03); // 55

        let num04 = 0;
        outermost02: for (let i = 0; i < 10; i++) {
            for (let j = 0; j < 10; j++) {
                if (i === 5 && j === 5) {
                    continue outermost02;
                }
                num04++;
            }
        }

        console.log('num04 -->', num04); // 95

        // with 语句
        with (location) {
            let qs = search.substring(1);
            let hostName = hostname;
            let url = href;

            //wewe=222 127.0.0.1 http://127.0.0.1:5500/javaScript/book/three-page/3.6%E8%AF%AD%E5%8F%A5.html?wewe=222
            console.log(qs, hostName, url);
        }


    </script>
</body>

</html>
