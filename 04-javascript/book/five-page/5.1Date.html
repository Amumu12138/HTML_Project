<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.1Date</title>
</head>

<body>
    <script>
        // 分析函数执行时间
        function doSomething() {
            for (let i = 0; i < 100; i++) {
                console.log('@');
            }
        }

        let start = Date.now();
        doSomething();
        let stop = Date.now();
        console.log('duration -->', stop - start);

        console.log(new Date("January 30 2022"), new Date("1 32 2022")); // Sun Jan 30 2022 00:00:00 GMT+0800 (中国标准时间) Invalid Date

        //继承的方法
        let date1 = new Date(2019, 0, 1);
        let date2 = new Date(2019, 1, 1);
        console.log(date1, date1 < date2); // Tue Jan 01 2019 00:00:00 GMT+0800 (中国标准时间) true
        console.log(date1.valueOf()); //返回时间戳: 1546272000000

        // 日期格式化方法
        let now = new Date();
        // 返回当前时间格式
        console.log(now.toDateString(), now.toTimeString(), now.toLocaleDateString(), now.toLocaleTimeString(), now.toUTCString());

        // 5.2 RegExp
        //  匹配字符串中所有的”at“
        let pattern1 = /at/g;
        let testStr = 'dsfsfattt.tasat';
        console.log(pattern1.exec(testStr)); // ['at', index: 5, input: 'dsfsfattt.tasat', groups: undefined]
        console.log(pattern1.test(testStr)); // true 

        // 匹配第一个‘bat’或‘cat’,忽略大小写
        let pattern2 = /[bc]at/i;
        let testStr2 = 'batdsf33r434cat...dfd';
        console.log(pattern2.lastIndex); // 0 表示在源字符串中下一次搜索的开始位置,始终从0开始
    </script>
</body>

</html>
