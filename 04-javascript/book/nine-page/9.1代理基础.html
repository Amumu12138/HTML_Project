<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9.1代理基础</title>
</head>

<body>
    <script>
        // 代理基础
        const target = {
            id: 'target'
        }
        const handler = {};
        const proxy = new Proxy(target, handler);
        console.log(target.id, proxy.id, target.id === proxy.id); // target target true

        target.id = 'foo';
        console.log(target.id, proxy.id); // foo foo 
        console.log(target.hasOwnProperty('id'), proxy.hasOwnProperty('id')); // true true

        console.log(target, proxy); //{id: 'foo'} Proxy {id: 'foo'}
        console.log(typeof target, typeof proxy, target === proxy); // object object false
        // console.log(proxy instanceof Proxy); // TypeError
    </script>
</body>

</html>
