<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11.1异步编程</title>
</head>

<body>
    <script>
        // 第十一章 期约与异步函数
        function double(value) {
            setTimeout(() => {
                setTimeout(console.log, 0, value * 2)
            }, 1000)
        }

        double(3); // 6
    </script>
</body>

</html>
