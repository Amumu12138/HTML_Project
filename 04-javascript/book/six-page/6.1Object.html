<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6.1 Object</title>
</head>

<body>
    <script>
        // 数值类型会自动转换为字符串
        let person = {
            name: 'Amumu',
            age: 20,
            5: true
        }

        console.log(person); // {5: true, name: 'Amumu', age: 20}
    </script>
</body>

</html>
