<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8.1理解对象</title>
</head>

<body>
    <script>
        // 属性的类型
        let person = {};
        Object.defineProperty(person, "name", {
            configurable: false,
            value: "Amumu"
        });

        console.log(person); //{name: 'Amumu'}

        // Uncaught TypeError: Cannot redefine property: name 
        // Object.defineProperty(person, "name", {
        //     configurable: true,
        //     value: ' '
        // })

        // 8.1.3 读取属性的特性
        let book = {};
        Object.defineProperties(book, {
            year_: {
                value: 2017
            },
            editor: {
                value: 1
            },
            year: {
                get() {
                    console.log('year get called');
                    return this.year_;
                },
                set(newVal) {
                    if (newVal > 2017) {
                        this.year_ = newVal;
                        this.editor += newVal - 2017;
                    }
                }
            }
        });

        let descriptor = Object.getOwnPropertyDescriptor(book, "year_");
        console.log(descriptor.value); // 2017
        console.log(descriptor.configurable); // false
        console.log(typeof descriptor); // object
        console.log(typeof descriptor.get); // undefined
        let descriptorYear = Object.getOwnPropertyDescriptor(book, 'year');
        console.log(descriptorYear.value); // undefined
        console.log(descriptorYear.configurable); // false
        console.log(typeof descriptorYear); // object
        console.log(typeof descriptorYear.get); // function

        // 8.1.4 合并对象
        let dest = {}, src = { id: 'src' };
        let result = Object.assign(dest, src);
        console.log(dest == src, dest === src, result == dest, result === dest);// false false true true
        console.log(result); // {id: 'src'}

        dest = {};
        src = {
            a: 'foo',
            get b() {
                throw new Error();
            },
            c: 'bar'
        }
        try {
            Object.assign(dest, src);
        } catch (e) {
            console.error('e -->', e);
        }
        // Object.assign() 是一个尽力而为、可能只会完成部分复制的方法
        console.log(dest); // {a: 'foo'}
    </script>
</body>

</html>
