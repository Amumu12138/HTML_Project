<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10.2函数名</title>
</head>

<body>
    <script>
        // 函数名
        function foo() { }
        console.log(foo.bind(null).name);

        // this对象
        window.identity = 'aaaa';

        let object = {
            identity: 'bbbb',
            getIdentityFunc() {
                console.log(this);
                return function () {
                    console.log(this);
                    return this.identity;
                }
            }
        }

        console.log(object.getIdentityFunc()()); // aaaa

        let object02 = {
            identity: 'bbbb',
            getIdentityFunc02() {
                let _this = this;
                console.log(_this);
                return function () {
                    console.log(_this);
                    return _this.identity;
                }
            }
        }

        console.log(object02.getIdentityFunc02()()); // bbbb


    </script>
</body>

</html>
