<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS面试题</title>
    <style>
        .container {
            display: flex;
            /*  justify-content 对齐内容 主轴方向*/
            justify-content: center;
            /* justify-content: space-around; */
            /* justify-content: space-between; */
            /* align-items 对齐项目 垂直于主轴方向 */
            /* align-items: stretch; */
            align-items: center;
            width: 600px;
            height: 600px;
            background-color: pink;
        }

        .box {
            /* display: flex;
            justify-content: center;
            align-items: center; */
            width: 100px;
            /* height: 100px; */
            background-color: red;
            color: white;
            text-align: center;
            line-height: 100px;
        }

        .parent {
            background-color: pink;
            width: 200px;
            height: 200px;
            text-align: center;
            margin: 0 auto;
            line-height: 200px;

        }

        .child {
            display: inline-block;
            background-color: red;
            width: 100px;
            height: 100px;
            vertical-align: middle;
        }

        .trangle {
            width: 0;
            height: 0;
            border-top: 0px solid transparent;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid red;
        }
    </style>
</head>


<body>
    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
    </div>
    <div class="parent">
        <div class="child"></div>
    </div>
    <!-- 实现三角形 -->
    <div class="trangle"></div>
</body>

</html>
