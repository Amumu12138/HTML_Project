<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箭头函数的实践</title>
    <style>
        #ad {
            width: 200px;
            height: 200px;
            background-color: #58a;
        }
    </style>
</head>

<body>
    <div id="ad"></div>
    <script>
        // 1、点击div 2s后颜色变成粉色
        let adDom = document.getElementById('ad');
        adDom.onclick = function () {
            setTimeout(() => {
                this.style.background = 'pink';
            }, 2000)
        }
        // 2、从数组中返回偶数的元素
        let arr = [];
        const NUM = 100;
        for (let i = 0; i < NUM; i++) {
            arr.push(Math.floor(Math.random() * NUM))
        }
        console.log('arr ->', arr);
        let oddArr = [];
        // for (let j = 0; j < arr.length; j++) {
        //     (arr[j] % 2 === 0) && (oddArr.push(arr[j]));
        // }
        oddArr = arr.filter((item) => item % 2 === 0);
        console.log('oddArr -->', oddArr);
    </script>
</body>

</html>
