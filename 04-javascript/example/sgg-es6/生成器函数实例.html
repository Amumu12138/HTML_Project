<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成器函数实例</title>
</head>

<body>
    <script>
        function one() {
            setTimeout(() => {
                console.log('this is one');
                iterator.next();
            }, 1000);
        }

        function two() {
            setTimeout(() => {
                console.log('this is two');
                iterator.next();
            }, 2000);
        }

        function three() {
            setTimeout(() => {
                console.log('this is three');
                iterator.next();
            }, 3000);
        }

        function* gen() {
            yield one();
            yield two();
            yield three();
            yield console.log('undefined');
        }

        let iterator = gen();
        iterator.next();
    </script>
</body>

</html>
