<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symbol</title>
</head>

<body>
    <script>
        let game = {
            name: 'game',
            [Symbol('say')]() {
                console.log('this is game say');
            },
            [Symbol('await')]() {
                console.log('this is game await');
            }
        }
        console.log(game, game[Symbol('say')]);

        for (let v in game) {
            console.log(v); // name
        }

        const arr = [1, 2, 4, 5, 6];
        for (let k in arr) {
            console.log(k); // for...in 打印索引值: 0 1 2 3 4
        }
        for (let v of arr) {
            console.log(v); // for...of 打印具体的值 1 2 4 5 6
        }
    </script>
</body>

</html>
