<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for循环</title>
</head>

<body>
    <script>
        // 实现10 * 10 正三角形 
        const NUM = 10;
        let forwardStr = '';
        for (let i = 0; i < NUM; i++) {
            for (let j = 0; j <= i; j++) {
                forwardStr += '*';
            }
            forwardStr += '\n';
        }
        console.log(forwardStr);
        // 实现10 * 10 倒三角形
        let backStr = '';
        for (let i = 0; i < NUM; i++) {
            for (let j = i; j < NUM; j++) {
                backStr += '*';
            }
            backStr += '\n';
        }
        console.log(backStr);

        // 实现九九乘法表
        let mathStr = '';
        for (let i = 1; i < NUM; i++) {
            for (let j = 1; j <= i; j++) {
                mathStr += j + 'x' + i + '=' + i * j + '\t';
            }
            mathStr += '\n';
        }
        console.log(mathStr);
    </script>
</body>

</html>
