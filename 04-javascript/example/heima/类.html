<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>类</title>
</head>

<body>
    <script>
        class Father {
            constructor(uname) {
                this.name = uname;
            }
        }

        class Son extends Father {
            constructor(uname) {
                // 不能使用this.name = uname; 会报错
                super(uname);
            }
        }

        let a = new Father("Amumu");
        console.log(a.name);

        let b = new Son("Amumu12139");
        console.log(b.name);
    </script>
</body>

</html>
