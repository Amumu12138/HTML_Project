<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据类型-课后作业</title>
</head>

<body>
    <script>
        // 1、交换两个变量的值
        let test1 = prompt('请输入第一个值');
        let test2 = prompt('请输入第二个值');
        let temp = test1;
        test1 = test2;
        test2 = temp;
        alert('test1 = ' + test1 + ' test2 = ' + test2);
        // 2、依次询问并获取用户的姓名、年龄、性别,并打印用户信息
        let name = prompt('请输入用户的姓名:');
        let age = prompt('请输入用户的年龄:');
        let sex = prompt('请输入用户的性别:');
        alert('姓名:' + name + ' 年龄:' + age + ' 性别:' + sex);
    </script>
</body>

</html>
