<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 200px;
            height: 200px;
        }

        .div1 {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-100px);
            background: red;
        }

        .div2 {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-100px);
            background: green;
        }

        .div3 {
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(-100px);
            background: yellow;
        }
    </style>
</head>

<body>
    <div class="div1 div">div1</div>
    <div class="div2 div">div2</div>
    <div class="div3 div">div3</div>
    <script>
        const Animation = {
            left: {
                forward(ele) {
                    console.log("forward forward called");
                    ele.style.left = '100px';
                },
                back(ele) {
                    console.log("back forward called");
                    ele.style.left = "-100px";
                }
            },
            right: {
                forward(ele) {
                    ele.style.right = "100px";
                },
                back(ele) {
                    ele.style.right = "-100px";
                }
            },
            top: {
                forward(ele) {
                    ele.style.top = "100px";
                },
                back(ele) {
                    ele.style.top = "-100px";
                }
            }
        }

        function Div(ele, animation) {
            this.ele = ele;
            this.animation = animation;
        }

        Div.prototype.forward = function () {
            this.animation.forward(this.ele);
        }
        Div.prototype.back = function () {
            this.animation.back(this.ele);
        }


        const leftDiv1 = new Div(document.querySelector(".div1"), Animation.left);
        setTimeout(() => {
            leftDiv1.forward();
        }, 1000);
        setTimeout(() => {
            leftDiv1.back();
        }, 2000);


        const leftDiv2 = new Div(document.querySelector(".div2"), Animation.right);
        setTimeout(() => {
            leftDiv2.forward();
        }, 2000);
        setTimeout(() => {
            leftDiv2.back();
        }, 4000);

        const leftDiv3 = new Div(document.querySelector(".div3"), Animation.top);
        setTimeout(() => {
            leftDiv3.forward();
        }, 3000);
        setTimeout(() => {
            leftDiv3.back();
        }, 6000);
    </script>
</body>

</html>
