<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 闭包实现
        let obj = (function () {
            let count = 0;
            return {
                increse() {
                    return ++count;
                },
                decrese() {
                    return --count;
                }
            }
        })();

        obj.increse();
        console.log(obj, obj.increse(), obj.decrese());
    </script>
    <script type="module">
        import exportJs from "./exportJs.js";
        exportJs.increse();
        console.log("01", exportJs, exportJs.count, exportJs.increse(), exportJs.decrese());
        console.log("02", exportJs);
    </script>
</body>

</html>
