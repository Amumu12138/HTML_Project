<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单例模式</title>
</head>

<body>
    <script>
        function User(name, age) {
            this.name = name;
            this.age = age;
        }

        let Singleton = function () {
            // console.log("01", name, age); // error
            let instance = null;

            return function (name, age) {
                console.log("02", name, age);
                if (!instance) {
                    instance = new User(name, age);
                }

                return instance;
            }
        }();

        console.log(Singleton);
        let a = Singleton("111", 11);
        let b = Singleton("122211", 22);
        console.log(a, b, a === b);
    </script>
</body>

</html>
