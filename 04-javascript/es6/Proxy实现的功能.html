<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy实现的功能</title>
</head>

<body>
    <h1>Proxy实现的功能</h1>
    <script>
        /**
         * 1. 验证对象的传值
            // 需要实现的功能
            // 1. 验证age属性的数据类型是否为整数
            // 2. 验证值的范围是否小于等于200
        */
        const validtor = {
            set(obj, prop, value) {
                // 验证age属性的数据类型是否为整数
                if (prop === 'age') {
                    if (!Number.isInteger(value)) {
                        throw new TypeError('非整数类型')
                    }
                }

                if (value > 200) {
                    throw new RangeError('非正常范围')
                }
            }
        }
        const proxy = new Proxy({}, validtor);
        // proxy.age = 3000

        /**
         * 2. 通过属性查找数组中的特定对象
        var data = [
        { name: 'Firefox'    , type: 'browser' },
        { name: 'SeaMonkey'  , type: 'browser' },
        { name: 'Thunderbird', type: 'mailer' }
        ]
        // 需要实现的功能
        // 1. 通过索引返回对应数据 proxy[0]
        // 2. 通过number属性返回数组长度 proxy.number
        // 3. 通过name获取对应的数据 proxy['Firefox']
        // 4. 通过type返回对应的数据 proxy['browser']
        // 5. 通过types返回data中的type products.types
        */

        var data = [
            { name: 'Firefox', type: 'browser' },
            { name: 'SeaMonkey', type: 'browser' },
            { name: 'Thunderbird', type: 'mailer' }
        ]

        const p = new Proxy(data, {
            get(obj, prop) {
                if (prop in obj) {
                    // 通过索引返回对应数据 
                    return obj[prop]
                }

                if (prop === 'number') {
                    // 通过number属性返回数组长度
                    return obj.length;
                }

                let result, types = {}
                for (let product of obj) {
                    if (product.name === prop) {
                        result = product
                    }

                    if (types[product.type]) {
                        types[product.type].push(product);
                    } else {
                        types[product.type] = [product]
                    }
                }

                if (result) {
                    // 通过name获取对应的数据
                    return result
                }

                if (prop in types) {
                    // 通过type返回对应的数据
                    return types[prop]
                }

                if (prop === 'types') {
                    // 通过types返回data中的type
                    return Object.keys(types);
                }
            }
        })

        console.log(p[0]);
        console.log(p['number']);
        console.log(p['Firefox']);
        console.log(p['browser']);
        console.log(p['types']);

        // Reflect是JavaScript中的一个内置对象，它提供了一系列用于执行对象操作的静态方法。
        // 这些方法与Proxy对象的处理程序方法相同，
        // 但Reflect并不是一个函数对象，因此它不能被实例化或作为函数调用。
        const data1 = {
            foo: 1
        }
        const p1 = new Proxy(data1, {
            get(target, property, receiver) {
                console.log('get 触发', target, property, receiver)
                return Reflect.get(target, property)
            },
            set(target, property, value, receiver) {
                console.log('set 触发', target, property, value, receiver)
                Reflect.set(target, property, value)
            }
        })
        console.log('p1', p1['foo']);

        // Reflect.get(p1, 'foo')
        // Reflect.set(p1, 'foo', '123')
        p1['foo'] = '123'
        console.log('p1', p1);

    </script>
</body>

</html>
