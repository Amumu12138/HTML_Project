<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全局预编译与函数预编译</title>
</head>

<body>
    <h1>全局预编译与函数预编译</h1>
    <script>
        // 全局预编译
        console.log(a); // fa() {}
        var a = 100
        function a() { }
        console.log(a); // 100
        // VO: {
        //   a: undefined fa 100
        // }

        // 函数预编译
        function fn(b, c) {
            console.log(b, c);
            var b = 0;
            console.log(b);
            // 函数定义
            var b = function () {
                console.log('bbbb');
            }

            console.log(c);
            console.log(b);
        }

        // fn(1);
        // 难题
        function testFn(a, c) {
            console.log(a, c);
            var a = 123
            console.log(a);
            console.log(c);
            function a() { }

            if (false) {
                var d = 678
            }

            console.log(d);
            console.log(b);
            var b = function () { }
            console.log(b);
            function c() { }
            console.log(c);
        }

        testFn(1, 2)

        // 函数预编译过程
        // AO: {
        //     a: undefined 1 fa
        //     d: undefined
        //     b: undefined fb
        //     c: undefined 2 fc
        // }
        // fa
        // 123
        // fc
        // undefined
        // undefined
        // fb
        // fc
    </script>
</body>

</html>
