<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>构造函数继承</title>
</head>

<body>
    <h1>构造函数继承</h1>
    <script>
        //构造函数继承
        // function Parent(name) {
        //     this.name = name;
        // }

        // Parent.prototype.getName = function () {
        //     return this.name;
        // }

        // function Child() {
        //     Parent.call(this, 'amumu')
        // }

        // var child = new Child();
        // console.log(child);

        // 组合继承
        function Parent(name) {
            this.name = [name];
        }

        // 父类方法
        Parent.prototype.getName = function () {
            return this.name;
        }

        function Child(name, age) {
            // 绑定父类上的属性
            Parent.call(this, name)
            this.age = age;
        }

        // Child.prototype = new Parent();
        // 寄生组合继承
        // Child.prototype = Parent.prototype;
        // 子类原型指向创建父类原型对象
        Child.prototype = Object.create(Parent.prototype)
        // 子类原型构造函数也指向子类,双向闭环
        Child.prototype.construct = Child;

        // 子类独有方法
        Child.prototype.getAge = function () {
            return this.age;
        }

        var child = new Child('amumu', 12);
        var child2 = new Child('12138', 16);
        child.name[0] = 'update';
        console.log(child, child2);
        console.log(child.getName(), child2.getName());
        console.log(child.getAge(), child2.getAge());
    </script>
</body>

</html>
