<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原型和原型链</title>
</head>

<body>
    <h3>原型和原型链</h3>
    <script>
        const o1 = {};
        const o2 = new Object();
        const o3 = Object.create(null);
        console.log(o1, o2, o3);

        const obj = {}
        console.log(obj.__proto__ === Object.getPrototypeOf(obj));
        console.log(Object.getPrototypeOf(obj));

        const fn = function () { }
        const f = new fn()
        console.log('f', f, f.constructor, f.__proto__);
        console.log(fn);
        console.dir(fn);
        console.log(fn.prototype);
        console.dir(fn.prototype);

    </script>
</body>

</html>
