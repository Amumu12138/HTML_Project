<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节流</title>
</head>

<body>
    <script>
        // 节流
        function throttle(func, wait = 500, immediate = false) {
            let timer = null;
            return function () {
                const args = arguments;

                if (immediate) {
                    func(arguments);
                    immediate = false;
                    return;
                }

                if (timer) return;
                timer = setTimeout(function () {
                    func.call(this, args);
                    clearTimeout(timer);
                }, wait)
            }
        }

    </script>
</body>

</html>
