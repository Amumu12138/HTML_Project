<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原型模式</title>
</head>

<body>
    <h3>原型模式</h3>
    <script>
        function superNewCarFactoryA(color, model) {
            this.color = color;
            this.model = model;
        }

        function superNewCarFactoryB(color, model) {
            this.color = color;
            this.model = model;
        }

        console.log(superNewCarFactoryA, superNewCarFactoryA.__proto__, superNewCarFactoryA.prototype);
        console.log(typeof superNewCarFactoryA, typeof superNewCarFactoryA.__proto__, typeof superNewCarFactoryA.prototype); // function function object
        console.log(superNewCarFactoryA.__proto__ == superNewCarFactoryA.prototype); // false

        superNewCarFactoryB.prototype = superNewCarFactoryA.prototype;
        superNewCarFactoryA.prototype.test = 'test'
        console.log(superNewCarFactoryA.prototype);

        var car1 = new superNewCarFactoryA('blue', 'TSL');
        var car2 = new superNewCarFactoryA('red', 'BYD');
        console.log(car1.test, car2.test);
        console.log(car1);

        console.log(car1.__proto__ === superNewCarFactoryA.prototype); // true


        const o = { a: 1 }
        o.__proto__.b = 2
        console.log(o);

        const obj = Object.create(o)
        console.log(obj.a, obj.b);

    </script>
</body>

</html>
