<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自定义错误类</title>
</head>

<body>
    <h1>自定义错误类</h1>
    <script>
        class CustomError extends Error {
            constructor(foo = 'bar', ...params) {
                super(...params)

                if (Error.captureStackTrace) {
                    Error.captureStackTrace(this, CustomError)
                }

                this.name = "CustomError"
                this.foo = foo
                this.date = new Date()
            }
        }

        try {
            throw new CustomError('baz', 'bazMessage')
        } catch (e) {
            console.dir(e);
            console.log(e.foo);
            console.log(e.name);
            console.log(e.message);
            console.log(e.stack);
            console.log(e.date);
            /*
            CustomError: bazMessage
                at http://127.0.0.1:5500/04-javascript/202601/%E8%87%AA%E5%AE%9A%E4%B9%89%E9%94%99%E8%AF%AF%E7%B1%BB.html:28:19
                date: Tue Jan 13 2026 15:17:20 GMT+0800 (中国标准时间) {}
                foo: "baz"
                name: "CustomError"
                message: "bazMessage"
                stack: "CustomError: bazMessage\n    
                at http://127.0.0.1:5500/04-javascript/202601/%E8%87%AA%E5%AE%9A%E4%B9%89%E9%94%99%E8%AF%AF%E7%B1%BB.html:28:19"[[Prototype]]: Error
            **/
        }
    </script>
</body>

</html>
