    <script>
        // 实现apply
        Function.prototype.myApply = function (thisArg, argArr) {
            if (typeof this !== 'function') {
                throw new TypeError('被调用对象必须是函数')
            }

            if (argArr && !Array.isArray(argArr)) {
                throw new TypeError('argArr参数必须是数组')
            }

            const key = Symbol('key')
            thisArg[key] = this;
            const result = Array.isArray(argArr) ? thisArg[key](...argArr) : thisArg[key]();
            delete thisArg[key]
            console.log(thisArg);

            return result
        }

        // 实现call
        Function.prototype.myCall = function (thisArg, ...args) {
            if (typeof this !== 'function') {
                throw new TypeError('被调用对象必须是函数')
            }

            const key = Symbol('key')
            thisArg[key] = this;
            const result = thisArg[key](...args);
            delete thisArg[key]
            console.log(thisArg);

            return result
        }

        // 实现bind
        Function.prototype.myBind = function (thisArg, ...args) {
            if (typeof this !== 'function') {
                throw new TypeError('被调用对象必须是函数')
            }

            const _this = this
            return function fn(...reArgs) {
                // 判断返回出去的函数是不是作为构造函数
                if (_this instanceof fn) {
                    return new _this(...args, ...reArgs)
                }

                return _this.call(thisArg, ...args, ...reArgs)
            }
        }

        // deepClone 深拷贝实现
        // 1. 数据类型的划分
        // 2. 递归处理
        // 3. 循环引用的处理

        function deepClone(obj, map = new WeakMap()) {
            console.log(obj, map, 'deepClone');

            // 1. 数据类型的划分处理
            if (obj === null
                || typeof obj !== 'object'
                || obj instanceof Date
                || obj instanceof RegExp) {
                return obj;
            }
            // 2. 循环引用的处理
            if (map.get(obj)) {
                return map.get(obj)
            }

            // 3 递归处理
            let newObj;
            if (obj instanceof Map) {
                // 判断为Map类型
                newObj = new Map()
                map.set(obj, newObj)
                console.log(obj);
                for (const [key, value] of obj) {
                    console.log('key, value', key, value);

                    newObj.set(key, deepClone(value, map))
                }
            } else if (obj instanceof Set) {
                // 判断类型为Set
                newObj = new Set()
                map.set(obj, newObj)
                for (const value of obj) {
                    console.log(value, '');

                    newObj.add(deepClone(value, map))
                }
            } else if (obj instanceof Array) {
                // 判断类型为数组
                newObj = []
                map.set(obj, newObj)
                obj.forEach(item => {
                    // console.log('item', item);

                    newObj.push(deepClone(item, map))
                })
            } else {
                // 类型为Object对象
                newObj = {}
                map.set(obj, newObj)
                for (const key in obj) {
                    console.log(key, 'key');
                    newObj[key] = deepClone(obj[key], map)
                }
            }

            return newObj
        }
