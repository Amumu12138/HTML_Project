<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS测试案例</title>
    <style>
        /* 标签选择器 */
        p {
            color: blueviolet;
            font-size: 20px;
        }

        div {
            color: brown;
            font-size: 20px;
        }
        /* 红色块区 */
        .red-box {
            width: 100px;
            height: 100px;
            background-color: red;
        }

        /* 绿色块区 */
        .green-box {
            width: 100px;
            height: 100px;
            background-color: green;
        }

        /* id选择器 */
        #pink {
            color: pink;
        }

        /* 字体属性 */
        .new-font {
            /* font: font-style font-weight font-size/line-height font-family */
            font: 20px 'Microsoft YaHei';
        }
        /* 文本属性 */
        .new-text {
            text-align: left;
            text-decoration: none;
            color: #000;
            line-height: 26px;
         }
    </style>
</head>
<body>
    <p> 这是一个段落标签 </p>
    <div> 这是div1 </div>
    <div> 这是div2 </div>
    <div> 这是div3 </div>

    <div class="red-box">红色块区</div>
    <div class="green-box">绿色块区</div>
    <div class="red-box">红色块区</div>

    <h5>id选择器</h5>
    <p id="pink">Amumu12138</p>
    <p id="pink"> Amumu12139 </p>
    <h5>字体属性</h5>
    <p class="new-font">苟利家国生死以，岂因祸福避趋之</p>
    <!-- 文本属性 -->
    <h5>大风歌</h5>
    <p class="new-text">大风起兮云飞扬，威加海内兮归故乡,安得猛士兮守四方！</p>
    <h5>鸿鹄歌</h5>
    <p class="new-text">鸿鹄高飞，一举千里;羽翮已就，横绝四海。横绝四海，当可奈何？虽有矰缴，尚安所施！</p>
    <script>
       var pink = document.getElementById("pink");
       console.log("Amumu pink = ", pink);
    </script>
</body>
</html>
