<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>align-items设置侧轴子元素排列</title>
    <style>
        .align-items-box {
            width: 500px;
            height: 500px;
            background: chartreuse;
        }

        span {
            height: 100px;
            width: 100px;
            margin: 10px;
            background: red;
        }

        .align-items-row {
            display: flex;
            /* 设置x轴为主轴 */
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }

        .align-items-column {
            display: flex;
            /* 设置y轴为主轴 */
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .align-items-stretch {
            display: flex;
            /* 设置x轴为主轴 */
            flex-direction: row;
            justify-content: center;
            align-items: stretch;
        }

        .align-content-space-between {
            display: flex;
            flex-direction: row;
            justify-content: center;
            /* 子元素换行 */
            flex-wrap: wrap;
            /*多行子元素在侧轴方向分布两头，再平分剩余空间 */
            align-content: space-between;
        }
    </style>
</head>

<body>
    <div style="float: left; margin: 10px;">
        <p>align-items: align-items-row-center</p>
        <div class="align-items-box align-items-row">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div style="float: left;  margin: 10px;">
        <p>align-items: align-items-column-center</p>
        <div class="align-items-box align-items-column">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div style="float: left; margin: 10px;">
        <p>align-items: align-items-row-center</p>
        <div class="align-items-box align-items-stretch">
            <!-- 子元素排列设置为拉伸，但高度必须为auto -->
            <span style="height: auto;"></span>
            <span style="height: auto;"></span>
            <span style="height: auto;"></span>
        </div>
    </div>

    <div style="float: left; margin: 10px;">
        <p>align-content: space-between</p>
        <div class="align-items-box align-content-space-between">
            <!-- 子元素排列设置为拉伸，但高度必须为auto -->
            <span style="margin: auto 10px;"></span>
            <span style="margin: auto 10px;"></span>
            <span style="margin: auto 10px;"></span>
            <span style="margin: auto 10px ;"></span>
            <span style="margin: auto 10px;"></span>
            <span style="margin: auto 10px;"></span>
            <span style="margin: auto 10px;"></span>
        </div>
    </div>
</body>

</html>
