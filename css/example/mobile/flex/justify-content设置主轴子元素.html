<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>justify-content设置主轴子元素</title>
    <style>
        .justify-content-box {
            float: left;
            width: 300px;
            height: 300px;
            margin: 10px;
            background: skyblue;
        }

        span {
            height: 50px;
            width: 50px;
            margin: 10px;
            background: red;
        }

        .justify-content-flex-start {
            display: flex;
            flex-direction: row;
            /* 设置从头部开始 默认值 */
            justify-content: flex-start;
        }

        .justify-content-flex-end {
            display: flex;
            flex-direction: row;
            /* 设置从末尾开始 */
            justify-content: flex-end;
        }

        .justify-content-center {
            display: flex;
            flex-direction: row;
            /* 在主轴居中对齐 */
            justify-content: center;
        }

        .justify-content-space-around {
            display: flex;
            flex-direction: row;
            /* 平分剩余空间 */
            justify-content: space-around;
        }

        .justify-content-space-between {
            display: flex;
            flex-direction: row;
            /* 平分剩余空间 */
            justify-content: space-between;
        }

        .justify-content-space-between-column {
            display: flex;
            /* 将y轴设置为主轴 */
            flex-direction: column;
            /* 平分剩余空间 */
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div style="float:left; text-align: center;">
        <p>justify-content: flex-start</p>
        <div class="justify-content-box justify-content-flex-start">
            <span></span><span></span><span></span>

        </div>
    </div>
    <div style="float:left; text-align: center;">
        <p>justify-content: flex-end</p>
        <div class="justify-content-box justify-content-flex-end">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div style="float:left; text-align: center;">
        <p>justify-content: center</p>
        <div class="justify-content-box justify-content-center">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div style="float:left; text-align: center;">
        <p>justify-content: space-around</p>
        <div class="justify-content-box justify-content-space-around">
            <span></span><span></span><span></span>
        </div>
    </div>
    <div style="float:left; text-align: center;">
        <p>justify-content: space-between</p>
        <div class="justify-content-box justify-content-space-between">
            <span style="margin:0;"></span><span style="margin:0;"></span><span style="margin:0;"></span>
        </div>
    </div>

    <div style="float:left; text-align: center;">
        <p>flex-direction: column space-between</p>
        <div class="justify-content-box justify-content-space-between-column">
            <span style="margin:0;"></span><span style="margin:0;"></span><span style="margin:0;"></span>
        </div>
    </div>
</body>

</html>
