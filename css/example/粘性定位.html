<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>粘性定位</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .nav,
        .body-box {
            text-align: center;
            margin: 0 auto;
        }

        .nav {
            /* 粘性定位 */
            position: sticky;
            top: 0;
            margin-top: 200px;
            width: 800px;
            height: 50px;
            line-height: 50px;
            background-color: gray;
        }

        .body-box {
            width: 800px;
            height: 10000px;
            background-color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="nav">
        导航栏
    </div>

    <div class="body-box">
        内容盒子
    </div>
</body>

</html>
