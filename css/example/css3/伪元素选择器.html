<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伪元素选择器</title>
    <style>
        div {
            height: 200px;
            width: 200px;
            background-color: yellow;
        }

        div::before {
            display: inline-block;
            width: 50px;
            content: 'before 前置伪元素';
        }

        div::after {
            display: inline-block;
            width: 50px;
            content: 'after 后置伪元素';
        }

        @font-face {
            font-family: 'iconfont';
            src: url('fonts/iconfont.ttf?t=1638541212572') format('truetype');
        }

        .iconfont {
            font-family: "iconfont" !important;
            font-size: 16px;
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 输入框下拉箭头实现 */
        input {
            /* display: block; */
            position: relative;
            /* width: 200px; */
            height: 30px;
            border: 1px solid red;
        }

        input::after {
            position: absolute;
            right: 0px;
            top: 8px;
            font-family: "iconfont" !important;
            content: '\e666';
            color: red;
        }

        /* 设置图片遮罩效果 */
        .video::before {
            display: none;
            position: relative;
            z-index: 2;
            content: '';
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .video:hover::before {
            display: block;
            content: '';
        }

        .video::after {
            content: '';
        }

        .video {
            position: relative;
            height: 200px;
            width: 200px;
            text-align: center;
            background-color: pink;
        }

        .video-image {
            display: none;
            position: absolute;
            width: 100px;
            margin-left: 40px;
            margin-top: -120px;
        }

        .video:hover .video-image {
            display: block;
        }
    </style>
</head>

<body>
    <div>伪元素选择器</div>
    <!-- 输入框下拉箭头 -->
    <!-- input标签为非闭合标签,无法插入伪元素,type=radio/type=checkbox除外 -->
    <input type="checkbox" placeholder="请输入...">
    <header class="input"></header>
    <span class="iconfont">&#xe666;</span>
    <!-- 视频播放效果 -->
    <div class="video">
        <img class="video-image" src="../../res/images/video-play.png" alt="">
    </div>
</body>

</html>
