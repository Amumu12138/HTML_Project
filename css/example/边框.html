<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>边框Border</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            border: 5px solid red;
            line-height: 200px;
            text-align: center
        }

        table {
            width: 500px;
            height: 200px;
        }

        table,
        td {
            border: 1px solid red;
            border-collapse: collapse;
        }

        /* th,
        td {
            border: 1px solid red;
            border-collapse: collapse;
        } */
    </style>
</head>

<body>
    <div>我是边框</div>

    <table border='1' cellspacing="0">
        <tr>
            <th>123</th>
            <th>123</th>
            <th>123</th>
            <th>123</th>
            <th>123</th>
        </tr>
        <tr>
            <td>123</td>
            <td>123</td>
            <td>123</td>
            <td>123</td>
            <td>123</td>
        </tr>
        <tr>
            <td>123</td>
        </tr>
        <tr>
            <td>123</td>
        </tr>
    </table>
</body>

</html>
