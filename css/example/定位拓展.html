<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位拓展</title>
    <style>
        .float-box {
            float: left;
            width: 200px;
            height: 200px;
            background-color: pink;
        }

        .absolute-box {
            position: absolute;
            top: 200px;
            left: 0;
            height: 200px;
            width: 200px;
            background-color: skyblue;
        }
    </style>
</head>

<body>
    <!-- 浮动不会压住标准流的文字 -->
    <div class="float-box"></div>
    <p>djkasjd;adlkakdljakdsjakj¬ø¬ø</p>
    <!-- 绝对定位/固定定位则会压住标准流的文字 -->
    <div class="absolute-box"></div>
    <p style="margin-top: 200px;">fslkadjfklasjdfklajdfklajdkfljaskdfjaksldfjak</p>
</body>

</html>
