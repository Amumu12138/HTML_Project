<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048 · 5×5</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(circle at 50% -10%, #1d2438 0%, #0b0c14 55%, #05060a 100%);
    color: #e8ecf6;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  .wrap { display: flex; gap: 28px; align-items: flex-start; }

  #board {
    position: relative;
    --cell: 80px;
    --gap: 10px;
    width: calc(var(--cell) * 5 + var(--gap) * 6);
    height: calc(var(--cell) * 5 + var(--gap) * 6);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(120, 160, 255, 0.22);
    box-shadow: 0 0 48px rgba(70, 120, 255, 0.2), inset 0 0 40px rgba(0, 0, 0, 0.6);
  }
  #cells, #tiles { position: absolute; inset: 0; }
  .cell {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.05);
  }
  .tile {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  .v2 { background: linear-gradient(160deg, #3a476b, #2b3552); color: #dfe9ff; }
  .v4 { background: linear-gradient(160deg, #41528a, #313e69); color: #e6eeff; }
  .v8 { background: linear-gradient(160deg, #3f7fc9, #2f63a8); color: #eaf3ff; }
  .v16 { background: linear-gradient(160deg, #35a3d6, #2277b8); color: #eaf7ff; }
  .v32 { background: linear-gradient(160deg, #26c2c2, #1a9b9b); color: #04201f; }
  .v64 { background: linear-gradient(160deg, #3ddc84, #22a865); color: #04200f; }
  .v128 { background: linear-gradient(160deg, #a8e63a, #7ab520); color: #121f02; }
  .v256 { background: linear-gradient(160deg, #ffd93d, #e0a800); color: #241a00; }
  .v512 { background: linear-gradient(160deg, #ff9f43, #e07200); color: #241200; }
  .v1024 { background: linear-gradient(160deg, #ff5c7c, #d92b52); color: #fff1f4; }
  .v2048 { background: linear-gradient(160deg, #b06bff, #7c3aed); color: #f6efff; box-shadow: 0 0 26px rgba(176, 107, 255, 0.6); }
  .v-super { background: linear-gradient(160deg, #6d28d9, #4c1d95); color: #f3ecff; box-shadow: 0 0 26px rgba(109, 40, 217, 0.65); }

  @keyframes appear {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pop {
    0% { transform: scale(0.6); }
    60% { transform: scale(1.14); }
    100% { transform: scale(1); }
  }
  .tile.spawn { animation: appear 0.16s ease; }
  .tile.merged { animation: pop 0.18s ease; }

  .panel { width: 180px; display: flex; flex-direction: column; gap: 12px; }
  .panel h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: 2px; font-weight: 600; }
  .scores { display: flex; gap: 10px; }
  .box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.07);
  }
  .scores .box { flex: 1; flex-direction: column; align-items: flex-start; gap: 2px; }
  .box span { font-size: 12px; color: #93a0bb; letter-spacing: 1px; }
  .box strong { font-size: 18px; font-variant-numeric: tabular-nums; }
  .new-game {
    padding: 11px 16px;
    border: none;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #eaf3ff;
    background: linear-gradient(135deg, #3f7fc9, #2f63a8);
    box-shadow: 0 6px 18px rgba(47, 99, 168, 0.4);
  }
  .new-game:hover { filter: brightness(1.1); }
  .keys {
    margin-top: 4px;
    padding: 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.06);
    font-size: 12px;
    line-height: 1.9;
    color: #93a0bb;
  }
  .keys p { margin: 0; }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: 14px;
    background: rgba(5, 8, 16, 0.82);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    transition: opacity 0.2s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay p { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 3px; }
  .actions { display: flex; gap: 10px; }
  .overlay button {
    padding: 9px 22px;
    border: none;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: #04101f;
    background: linear-gradient(135deg, #6ee7ff, #4f8cff);
    box-shadow: 0 6px 20px rgba(79, 140, 255, 0.35);
  }
  .overlay button.ghost {
    background: transparent;
    color: #b9c6e2;
    border: 1px solid rgba(185, 198, 226, 0.35);
    box-shadow: none;
  }
  .overlay button:hover { filter: brightness(1.1); }
  #secondaryBtn.hidden { display: none; }

  @media (max-width: 560px) {
    .wrap { flex-direction: column; align-items: center; }
    .panel { width: min(100%, 340px); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <section>
      <div id="board">
        <div id="cells"></div>
        <div id="tiles"></div>
        <div id="overlay" class="overlay hidden">
          <p id="overlayText"></p>
          <div class="actions">
            <button id="primaryBtn" type="button"></button>
            <button id="secondaryBtn" type="button" class="ghost hidden"></button>
          </div>
        </div>
      </div>
    </section>
    <aside class="panel">
      <h1>2048 · 5×5</h1>
      <div class="scores">
        <div class="box"><span>分数</span><strong id="score">0</strong></div>
        <div class="box"><span>最高分</span><strong id="best">0</strong></div>
      </div>
      <button id="newGame" class="new-game" type="button">新游戏</button>
      <div class="keys">
        <p>↑ ↓ ← → 移动方块</p>
        <p>数字相同则合并翻倍</p>
        <p>目标：合成 2048</p>
        <p>R 重新开始</p>
      </div>
    </aside>
  </div>
  <script>
    (function () {
      'use strict';

      const SIZE = 5;
      const CELL = window.innerWidth < 520 ? 62 : 80;
      const GAP = window.innerWidth < 520 ? 8 : 10;

      const boardEl = document.getElementById('board');
      const cellsEl = document.getElementById('cells');
      const tilesEl = document.getElementById('tiles');
      const scoreEl = document.getElementById('score');
      const bestEl = document.getElementById('best');
      const overlay = document.getElementById('overlay');
      const overlayText = document.getElementById('overlayText');
      const primaryBtn = document.getElementById('primaryBtn');
      const secondaryBtn = document.getElementById('secondaryBtn');
      const newGameBtn = document.getElementById('newGame');

      boardEl.style.setProperty('--cell', CELL + 'px');
      boardEl.style.setProperty('--gap', GAP + 'px');

      let grid;
      let score = 0;
      let best = 0;
      let won = false;
      let gameOver = false;
      let spawnCells = [];
      let mergedCells = [];

      function pxX(col) { return GAP + col * (CELL + GAP); }
      function pxY(row) { return GAP + row * (CELL + GAP); }

      function posKey(r, c) { return r + ',' + c; }

      function fontSizeFor(value) {
        const digits = String(value).length;
        if (digits <= 2) return Math.round(CELL * 0.42);
        if (digits === 3) return Math.round(CELL * 0.33);
        if (digits === 4) return Math.round(CELL * 0.26);
        return Math.round(CELL * 0.2);
      }

      function tileClass(value) {
        return value > 2048 ? 'v-super' : 'v' + value;
      }

      function initCells() {
        const frag = document.createDocumentFragment();
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.style.left = pxX(c) + 'px';
            cell.style.top = pxY(r) + 'px';
            frag.appendChild(cell);
          }
        }
        cellsEl.appendChild(frag);
      }

      function loadBest() {
        try {
          best = parseInt(localStorage.getItem('best2048x5'), 10) || 0;
        } catch (err) {
          best = 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem('best2048x5', String(best));
        } catch (err) {
          /* 忽略存储不可用的情况 */
        }
      }

      function emptyCells() {
        const list = [];
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!grid[r][c]) list.push({ r: r, c: c });
          }
        }
        return list;
      }

      function addRandom() {
        const empties = emptyCells();
        if (!empties.length) return null;
        const cell = empties[Math.floor(Math.random() * empties.length)];
        grid[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
        return cell;
      }

      // 把一行（或一列）按移动方向压缩并合并，返回新序列、合并位置和得分
      function slideLine(values) {
        const compact = values.filter(function (v) { return v; });
        const out = [];
        const merged = [];
        let gained = 0;
        for (let i = 0; i < compact.length; i++) {
          if (i + 1 < compact.length && compact[i] === compact[i + 1]) {
            const value = compact[i] * 2;
            out.push(value);
            merged.push(out.length - 1);
            gained += value;
            i++;
          } else {
            out.push(compact[i]);
          }
        }
        while (out.length < SIZE) out.push(0);
        return { out: out, merged: merged, gained: gained };
      }

      // 第 index 条线在某个方向上的坐标序列，第 0 个是移动终点侧
      function lineCoords(dir, index) {
        const coords = [];
        for (let i = 0; i < SIZE; i++) {
          if (dir === 'left') coords.push({ r: index, c: i });
          else if (dir === 'right') coords.push({ r: index, c: SIZE - 1 - i });
          else if (dir === 'up') coords.push({ r: i, c: index });
          else coords.push({ r: SIZE - 1 - i, c: index });
        }
        return coords;
      }

      function move(dir) {
        if (gameOver) return;
        if (!overlay.classList.contains('hidden')) {
          hideOverlay();
        }

        let moved = false;
        let gained = 0;
        const merged = [];

        for (let i = 0; i < SIZE; i++) {
          const coords = lineCoords(dir, i);
          const values = coords.map(function (p) { return grid[p.r][p.c]; });
          const result = slideLine(values);
          for (let j = 0; j < SIZE; j++) {
            const p = coords[j];
            if (grid[p.r][p.c] !== result.out[j]) moved = true;
            grid[p.r][p.c] = result.out[j];
          }
          gained += result.gained;
          result.merged.forEach(function (idx) {
            merged.push(coords[idx]);
          });
        }

        if (!moved) return;

        score += gained;
        mergedCells = merged;
        const spawned = addRandom();
        spawnCells = spawned ? [spawned] : [];

        render();
        updateHUD();
        checkStatus();
      }

      function canMove() {
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (!grid[r][c]) return true;
            if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return true;
            if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return true;
          }
        }
        return false;
      }

      function checkStatus() {
        if (!won) {
          for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
              if (grid[r][c] >= 2048) {
                won = true;
                showOverlay('达成 2048！', '继续挑战', hideOverlay, '重新开始', reset);
                return;
              }
            }
          }
        }
        if (!canMove()) {
          gameOver = true;
          showOverlay('游戏结束', '重新开始', reset, null, null);
        }
      }

      function render() {
        tilesEl.innerHTML = '';
        const mergedSet = new Set(mergedCells.map(function (p) { return posKey(p.r, p.c); }));
        const spawnSet = new Set(spawnCells.map(function (p) { return posKey(p.r, p.c); }));

        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const value = grid[r][c];
            if (!value) continue;
            const tile = document.createElement('div');
            tile.className = 'tile ' + tileClass(value);
            tile.textContent = String(value);
            tile.style.left = pxX(c) + 'px';
            tile.style.top = pxY(r) + 'px';
            tile.style.fontSize = fontSizeFor(value) + 'px';
            const key = posKey(r, c);
            if (mergedSet.has(key)) {
              tile.classList.add('merged');
            } else if (spawnSet.has(key)) {
              tile.classList.add('spawn');
            }
            tilesEl.appendChild(tile);
          }
        }

        mergedCells = [];
        spawnCells = [];
      }

      function updateHUD() {
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          saveBest();
        }
        bestEl.textContent = best;
      }

      function showOverlay(text, primaryText, primaryHandler, secondaryText, secondaryHandler) {
        overlayText.textContent = text;
        primaryBtn.textContent = primaryText;
        primaryBtn.onclick = primaryHandler;
        if (secondaryText) {
          secondaryBtn.textContent = secondaryText;
          secondaryBtn.onclick = secondaryHandler;
          secondaryBtn.classList.remove('hidden');
        } else {
          secondaryBtn.classList.add('hidden');
        }
        overlay.classList.remove('hidden');
      }

      function hideOverlay() {
        overlay.classList.add('hidden');
      }

      function reset() {
        grid = Array.from({ length: SIZE }, function () {
          return Array(SIZE).fill(0);
        });
        score = 0;
        won = false;
        gameOver = false;
        mergedCells = [];
        spawnCells = [];
        const first = addRandom();
        const second = addRandom();
        if (first) spawnCells.push(first);
        if (second) spawnCells.push(second);
        render();
        updateHUD();
        hideOverlay();
      }

      document.addEventListener('keydown', function (e) {
        const dirs = {
          ArrowLeft: 'left',
          ArrowRight: 'right',
          ArrowUp: 'up',
          ArrowDown: 'down'
        };
        const dir = dirs[e.key];
        if (dir) {
          e.preventDefault();
          move(dir);
          return;
        }
        if (e.key === 'r' || e.key === 'R') reset();
      });

      newGameBtn.addEventListener('click', reset);

      loadBest();
      initCells();
      reset();
    })();
  </script>
</body>
</html>
