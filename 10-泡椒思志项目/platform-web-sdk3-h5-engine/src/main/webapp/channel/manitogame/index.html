<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="full-screen" content="true" />
    <meta name="screen-orientation" content="portrait" />

    <title>游戏</title>

    <link href="/css/common.css" rel="stylesheet">
    <link href="/css/layout.css" rel="stylesheet">

    <script type="text/javascript" src="/js/jquery/jquery-1.9.1.min.js"></script>
    <script type="text/javascript" src="/js/jquery/jquery.md5.js"></script>
    <script type="text/javascript" src="/js/pj_api.js"></script>
    <script type="text/javascript" src="/js/pj_channel_sdk.js"></script>
    <script type="text/javascript" src="/js/pj_sdk_host.js"></script>
    <script type="text/javascript" src="/js/manitogame/manitogame.js"></script>

    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%
        }

        body {
            /*
                        background: url(https://h5.infoxgame.com/images/duojiao_loading.png) no-repeat center top;
            */
            background-size: auto 100%;
        }
    </style>

</head>

<body>

    <script type="text/javascript">
        //判断设备是android还是ios
        var u = navigator.userAgent,
            app = navigator.appVersion;
        var isAndroid = u.indexOf('Android') > -1 || u.indexOf('Linux') > -1; //android终端或者uc浏览器
        var isiOS = !!u.match(/\(i[^;]+;( U;)? CPU.+Mac OS X/); //ios终端

        //判断是否是微信打开
        function is_weixin() {
            var ua = navigator.userAgent.toLowerCase();
            if (ua.match(/MicroMessenger/i) == "micromessenger") {
                return true;
            } else {
                return false;
            }
        }


        $(function () {

            //初始化渠道sdk
            pjChannelSdk.init(10935, "smxnh5_hnak_sm_001", "1.0.0");
            sdk.init3("10935", "smxnh5_hnak_sm_001");
            console.info("初始化sdk成功......");

            //获取游戏信息
            pjChannelSdk.getGameInfo(function (retData) {
                console.info("getGameInfo return params +++" + JSON.stringify(retData));

                var gameName = retData.data.gameName;
                $(document).attr("title", gameName);
                var gameUrl = retData.data.gameUrl;
                var orientation = retData.data.orientation;

                DSSDK.login(function (callbackData) {
                    console.info("--------callbackData params--------:" + JSON.stringify(
                        callbackData));
                    if (callbackData.code == 0) {
                        //不同的渠道使用不同的拼接方式,
                        var extension = JSON.stringify({
                            "token": callbackData.data.token
                        });
                        console.info("--------reuqest params--------:" + extension);

                        pjChannelSdk["sdkUserId"] = callbackData.data.user_id;
                        //校验渠道token
                        pjChannelSdk.getToken(extension, function (retData) {
                            console.info("getToken return params-------：" + JSON
                                .stringify(retData));
                            if (retData.code == 1) {
                                var gameParam = {};
                                gameParam["uid"] = retData.data.userInfo.uid;
                                gameParam["sdkToken"] = retData.data.userInfo.token;
                                gameUrl = pjapi.buildURL(gameUrl, gameParam);

                                console.log("===进入游戏===>>" + gameUrl);
                                if (orientation == 0) { //横屏游戏
                                    $("body").append(
                                        '<div id="gameFrameDiv" style="width: 100%; height: 100%; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                        gameUrl +
                                        '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: 100%; height: 100%;"></iframe></div>'
                                    );
                                    window.onorientationchange = function () {
                                        if (window.orientation == 90 || window
                                            .orientation == -90) {
                                            $("#gameFrameDiv").css({
                                                "left": $(window).width() -
                                                    20,
                                                "top": "30%"
                                            });
                                        }
                                    }
                                } else { //竖屏游戏
                                    var isWX = is_weixin();
                                    if (isiOS && isWX) {
                                        $("body").append(
                                            '<div id="gameFrameDiv" style="width: ' +
                                            $(window).width() + 'px;  height: ' + $(
                                                window).height() +
                                            'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                            gameUrl +
                                            '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                                            $(window).width() + 'px; height: ' + ($(
                                                window).height() - 80) +
                                            'px;"></iframe></div>');
                                    } else {
                                        $("body").append(
                                            '<div id="gameFrameDiv" style="width: ' +
                                            $(window).width() + 'px;  height: ' + $(
                                                window).height() +
                                            'px; position: relative; top: 0px; left: 0px;"><iframe id="gameFrame" name="gameFrame" src="' +
                                            gameUrl +
                                            '" frameborder="no" border="0px" marginwidth="0px" marginheight="0px" scrolling="auto" style="width: ' +
                                            $(window).width() + 'px; height: ' + $(
                                                window).height() +
                                            'px;"></iframe></div>');
                                    }
                                }
                            } else {
                                pjapi.confirmDialog(retData.msg);
                            }
                        });
                        console.log('登录成功: uid=>' + callbackData.data.user_id);
                    } else {
                        console.log('登录失败:' + callbackData.message);
                    }
                    //开启监听事件
                    pjChannelSdk.startEventListener();
                })

            });

        });


        function receiveMessage(event) {
            console.log(event.data);
            var params = event.data.param;

            if (event.data.method == 'PJ_loadPayBox') { //拉起支付
                console.log("调用订单获取接口");
                var payParam = {};

                payParam["channelGameId"] = pjChannelSdk.initData.channelGameId;
                payParam["appVersion"] = pjChannelSdk.initData.appVersion;
                payParam["channel"] = pjChannelSdk.initData.channel;
                payParam["sdkVersion"] = pjChannelSdk.sdkVersion;


                payParam["money"] = params["money"];
                payParam["uid"] = params["uid"];
                payParam["productName"] = params["goodsName"];
                payParam["roleId"] = params["roleId"];
                payParam["roleName"] = params["roleName"];
                payParam["serverId"] = params["serverId"];
                payParam["serverName"] = params["serverName"];
                payParam["description"] = params["description"];
                payParam["ext"] = params["ext"];
                payParam["cpOrderNo"] = params["cpOrderNo"];

                console.log("------------payParam--------------" + JSON.stringify(payParam));
                //生成融合sdk订单
                pjChannelSdk.getOrderNo(payParam, function (retData) {
                    if (retData.code == 1) {
                        console.log("获取订单成功：" + JSON.stringify(retData));
                        // var _d = retData.data.extension.split("_");
                        // var extStr = decodeURIComponent(pjChannelSdk.extStr);
                        var orderInfo = new Object();
                        orderInfo.cp_order = retData.data.orderInfo.orderNumber;
                        orderInfo.product_id = '1001';
                        orderInfo.product_name = retData.data.orderInfo.goodsName;
                        orderInfo.product_desc = retData.data.orderInfo.goodsName;
                        orderInfo.server_id = retData.data.orderInfo.serverId;
                        orderInfo.server_name = retData.data.orderInfo.serverName;
                        orderInfo.role_id = retData.data.orderInfo.roleId;
                        orderInfo.role_name = retData.data.orderInfo.roleName;
                        orderInfo.role_level = '0';
                        orderInfo.price = retData.data.orderInfo.money;
                        orderInfo.extension = retData.data.orderInfo.orderNumber;

                        console.log('this pay request 下单参数：' + JSON.stringify(orderInfo));
                        DSSDK.pay(orderInfo, function (callback) {
                            if (callback.code == 0) {
                                console.log('支付成功,用户ID:' + callback.data.user_id);
                            } else if (callback.code == 2) {
                                console.log('支付取消,用户ID:' + callback.data.user_id);
                            } else {
                                console.log('支付失败,用户ID:' + callback.data.user_id);
                            }
                        })
                    } else {
                        pjapi.confirmDialog(retData.msg);
                    }

                });
                //上报角色信息
            } else if (event.data.method == 'PJ_reportRoleInfo') {
                sdk.reportRoleInfo(params);
                console.info("--------PJ_reportRoleInfo params--------:" + JSON.stringify(params));
                var serverId = params["serverid"];
                var serverName = params["servername"];
                var roleId = params["roleid"];
                var roleName = params["roleName"];
                var roleLevel = params["roleLever"];
                var roleType = params["roleType"];
                if (roleType == 1) {
                    DSSDK.logLoadingFinish();
                    DSSDK.logEnterGame(serverId, serverName, roleId, roleName, roleLevel);
                } else if (roleType == 2) {
                    DSSDK.logCreateRole(serverId, serverName, roleId, roleName, roleLevel);
                } else if (roleType == 3) {
                    DSSDK.logRoleUpLevel(serverId, serverName, roleId, roleName, roleLevel);
                }
            }

        }
    </script>
</body>

</html>
