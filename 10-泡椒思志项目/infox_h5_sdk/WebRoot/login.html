		background-repeat:no-repeat; background-size:100% 100%;-moz-background-size:100% 100%;

<body> 

<div id="flash"></div> 


	<script type="text/javascript">
	    sdk.init();
	    sdkApi.initLoading(function() {
	    	sdkApi.getGameInfo("true",function(ret) {
				if (ret.code == sdk.SUCCESS) {//成功
		        	 $(document).attr("title",ret.data.gameName);
		        	 sdk.autoLogin();
		        	 startEventListener();  
				} else {
					sdkApi.confirmDialog("获取游戏信息失败");
					return;
				}

		});
	});
	    
	    function startEventListener(){
    		
    		window.addEventListener("message", receiveMessage, false);

    		function receiveMessage(event) {
                console.log("host receive data",event.data);
    			switch (event.data.method) {
    			case "fotPwdCallback": {//关闭忘记密码
    				sdkApi.closeFotPwdBox();
    				sdkApi.loadLoginBox();
    				break;
    			}
               /* case "realNameAuthCallback": {//实名认证
                    sdkApi.setItem("realNameAuthStatus",event.data.code);
                    window.location.href= sdkApi.getItem("jumpUrl") + "?" + sdkApi.getItem("params");
                    break;
                    }*/
    			}
    		}	
    	}
	    
	</script>
