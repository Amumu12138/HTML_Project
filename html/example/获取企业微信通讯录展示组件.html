<html>

<body>
    <ww-open-data type="userName" openid="{{openid}}"></ww-open-data>
    <script src="//res.wx.qq.com/open/js/jweixin-1.2.0.js"></script>
    <script src="//open.work.weixin.qq.com/wwopen/js/jwxwork-1.0.0.js"></script>
    <script>
        (async () => {
            if (/MicroMessenger/i.test(navigator.userAgent)) {
                await config({})
            }
            const params = {
                corpid: '', // 必填，企业微信的corpid，必须与当前登录的企业一致
                agentid: '', // 必填，企业微信的应用id （e.g. 1000247）
                timestamp: '', // 必填，生成签名的时间戳
                nonceStr: '', // 必填，生成签名的随机串
                signature: '',// 必填，签名，见附录-JS-SDK使用权限签名算法
                jsApiList: ['selectExternalContact'], //必填，传入需要使用的接口名称
            }

            function successFun() {
                wx.invoke("selectEnterpriseContact", {
                    "fromDepartmentId": -1,// 必填，表示打开的通讯录从指定的部门开始展示，-1表示自己所在部门开始, 0表示从最上层开始
                    "mode": "multi",// 必填，选择模式，single表示单选，multi表示多选
                    "type": ["department", "user"],// 必填，选择限制类型，指定department、user中的一个或者多个
                    "selectedDepartmentIds": ["2", "3"],// 非必填，已选部门ID列表。用于多次选人时可重入，single模式下请勿填入多个id
                    "selectedUserIds": ["lisi", "lisi2"]// 非必填，已选用户ID列表。用于多次选人时可重入，single模式下请勿填入多个id
                }, function (res) {
                    if (res.err_msg == "selectEnterpriseContact:ok") {
                        if (typeof res.result == 'string') {
                            res.result = JSON.parse(res.result) //由于目前各个终端尚未完全兼容，需要开发者额外判断result类型以保证在各个终端的兼容性
                        }
                        var selectedDepartmentList = res.result.departmentList;// 已选的部门列表
                        for (var i = 0; i < selectedDepartmentList.length; i++) {
                            var department = selectedDepartmentList[i];
                            var departmentId = department.id;// 已选的单个部门ID
                            var departemntName = department.name;// 已选的单个部门名称
                        }
                        var selectedUserList = res.result.userList; // 已选的成员列表
                        for (var i = 0; i < selectedUserList.length; i++) {
                            var user = selectedUserList[i];
                            var userId = user.id; // 已选的单个成员ID
                            var userName = user.name;// 已选的单个成员名称
                            var userAvatar = user.avatar;// 已选的单个成员头像
                        }
                    }
                }
                );
            }

            function failFun() {
                if (res.errMsg.indexOf('function not exist') > -1) {
                    alert('版本过低请升级')
                }
            }

            await agentConfig(params, successFun, failFun)
            // 注意: 在企业微信平台下，只有 agentConfig 成功回调后，WWOpenData 才会注入到 window 对象上面
            WWOpenData.bindAll(document.querySelectorAll('ww-open-data'))
        })()

        function config(config) {
            return new Promise((resolve, reject) => {
                wx.config(config)
                wx.ready(resolve)
                wx.error(reject)
            })
        }

        function agentConfig(config, success, fail) {
            return new Promise((success, fail) => {
                wx.agentConfig({ ...config, success, fail })
            })
        }
    </script>
</body>

</html>
