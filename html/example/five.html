<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form表单标签</title>
</head>
<body>
    <!-- input表单元素 -->
    <h4>input表单元素</h4>
    <form action="input" method="GET" name="name01">
        文本<input type="text" placeholder="请输入文本" value="请输入text" id="input-text" name="username"> <br>
        按钮<input type="button" value="按钮"> <br>
        复选框 爱好: 打游戏<input type="checkbox" > 吃饭<input type="checkbox"> 睡觉<input type="checkbox" ><br>
        文件<input type="file" value="selectFile" name="selectFile"> <br>
        隐藏<input type="hidden" > <br>
        图像<input type="image" > <br>
        密码<input type="password" > <br>
        单选按钮 性别: 男<input type="radio" name="sex" checked="checked"> 女<input type="radio" name="sex"><br>
        单选按钮-label 性别: <label for="man">男</label><input id="man" type="radio" name="label-sex"> <label for="women">女</label><input id="women" type="radio" name="label-sex"><br>
        重置按钮<input type="reset" > <br>
        提交按钮<input type="submit" > <br>
    </form>
    <!-- select表单元素 -->
    <h4>select表单元素</h4>
    <form action="select">
        一线城市
        <select name="select" id="select-01">
            <option value="a">北京</option>
            <option value="b">上海</option>
            <option value="c">广州</option>
            <!-- <option value="d" selected="selected">深圳</option> -->
        </select>
    </form>
    <!-- textarea表单元素 -->
    <h4>textarea表单元素</h4>
    <form action="textarea">
        <textarea name="" id="" cols="30" rows="10">走走走，我们走！</textarea>
    </form>
</body>
</html>
