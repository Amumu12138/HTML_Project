<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作用域链</title>
</head>

<body>
    <script>
        var a = 1;
        function fn() {
            var b = a + 1;
            console.log('b=', b); // b = 2
        }

        fn();
        console.log(' Global b=', b); // Uncaught ReferenceError: b is not defined              

    </script>
</body>

</html>
