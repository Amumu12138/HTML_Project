<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>-- SlideShow --</title>
    <style>
        body {
            margin: 0;
        }

        canvas {
            width: 100%;
            height: 100%
        }
    </style>
    <link href="../SlideShow/slidershow.css" rel="stylesheet">
    <script type="text/javascript" src="../SlideShow/SlideShow.js"></script>
</head>

<body>
    <div class="slideshow-container">
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="../../../images/slideshow/img_mountains_wide.jpg" style="width: 100%;">
            <div class="text">文本1</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="../../../images/slideshow/img_fjords_wide.jpg" style="width: 100%;">
            <div class="text">文本2</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="../../../images/slideshow/img_nature_wide.jpg" style="width: 100%;">
            <div class="text">文本3</div>
        </div>

        <a class="prev" onclick="plusSlides(-1)">❮</a>
        <a class="prev next" onclick="plusSlides(1)">❯</a>      
    </div>
</body>

</html>
