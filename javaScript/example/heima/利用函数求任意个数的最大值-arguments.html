<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用函数求任意个数的最大值-arguments</title>
</head>

<body>
    <script>
        // 利用函数求任意个数的最大值-arguments
        function getMax() {
            let max = arguments[0];
            for (let i = 1; i < arguments.length; i++) {
                max = arguments[i] > max ? arguments[i] : max;
            }

            return max;
        }

        console.log(getMax(1, 23, 4, 5, 4, 3)); // 23
        console.log(getMax(1, -1, -2, 2)); // 2
    </script>
</body>

</html>
