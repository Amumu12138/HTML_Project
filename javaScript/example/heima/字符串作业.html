<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字符串作业</title>
</head>

<body>
    <script>
        // 字符串作业: 给定一个字符串,如: 'abaasdffggghhjjkkgfddsssss3444343'
        // 1、字符串的长度
        const str = 'abaasdffggghhjjkkgfddsssss3444343';
        let len = str.length;
        console.log('len -->', len);
        //  2、 取出指定位置的字符,如: 0,3,5,9
        console.log(str.charAt(0), str.charAt(3), str.charAt(5), str.charAt(9));
        // 3、查找指定字符是否在以上字符串中存在,如: i,c,b
        console.log(str.indexOf('i'), str.indexOf('c'), str.indexOf('b'));
        // 4、替换指定的字符,如: g替换为22, ss替换为b
        let newStr = str;
        while (newStr.indexOf('g') !== -1) {
            newStr = newStr.replace('g', '22');
        }
        while (newStr.indexOf('ss') !== -1) {
            newStr = newStr.replace('ss', 'b');
        }
        console.log('newStr -->', newStr);
        // 5、截取指定开始位置到结束位置的字符串,如: 取得1-5的字符串
        console.log(str.substr(1, 5)); // 开始索引为1, 取的个数为5
        // console.log(str.substring(1, 6)); // 开始索引为1, 结束索引为5, 6取不到
        // console.log(str.slice(1, 6)); // 开始索引为1, 结束索引为5, 6取不到
        // 6、找出以上字符串中出现字数最多的字符和出现字数
        let countObj = {};
        for (let i = 0; i < len; i++) {
            if (countObj[str[i]]) {
                countObj[str[i]]++;
            } else {
                countObj[str[i]] = 1;
            }
        }
        let max = 0, maxKey = '';
        for (const k in countObj) {
            if (countObj[k] > max) {
                maxKey = k;
                max = countObj[k];
            }
        }
        console.log('maxKey -->', maxKey, ' max -->', max);
    </script>
</body>

</html>
