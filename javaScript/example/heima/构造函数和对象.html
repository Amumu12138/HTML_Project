<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>构造函数和对象</title>
</head>

<body>
    <script>
        function Star(a, b) {
            this.name = a;
            this.age = b;
        }

        Star.prototype.sing = function () {

            console.log('sing called');
        }
        let that;
        Star.prototype = {
            // 让构造函数指回原型对象
            constructor: Star,
            sing() {
                that = this;
                console.log('sing called');
            },
            movice() {
                console.log('movice called');
            }
        }
        let ldh = new Star('刘德华', 18);
        let zxy = new Star('张学友', 18);
        ldh.sing();
        zxy.sing();
        console.log(ldh.sing === zxy.sing); // true
        console.log(ldh, ldh.__proto__ === Star.prototype); // Star {name: '刘德华', age: 18} true
        console.log(that === zxy); // true

        console.log(ldh.__proto__, Star.prototype);
        console.log(Star.prototype.constructor, ldh.__proto__.constructor);

        // 原型链
        //{constructor: ƒ...} null undefined
        console.log(Object.prototype, Object.prototype.__proto__, Object.prototype.prototype);

        // 扩展内置对象 - 给数组增加自定义求偶数和的功能
        console.log('before Array', Array.prototype);
        Array.prototype.oddSum = function () {
            let sum = 0;
            for (let i = 0; i < this.length; i++) {
                if (this[i] % 2 === 0) {
                    sum += this[i];
                }
            }
            return sum;
        }
        console.log('after Array ', Array.prototype);
        let arr = [1, 2, 3, 4, 5, 6];
        console.log(arr.oddSum());


    </script>
</body>

</html>
