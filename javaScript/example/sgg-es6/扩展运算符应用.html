<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩展运算符应用</title>
</head>

<body>
    <div></div>
    <div></div>
    <div></div>
    <script>
        // 1、数组的合并
        const a = [1, 2], b = [3, 4];
        console.log(a.concat(b)); // [1,2,3,4]
        console.log([...a, ...b]); // [1,2,3,4]
        console.log(a.concat(b) === [...a, ...b]); // false, 引用地址不一致,第一个指向变量a的地址,第二个指向新生成的数组的地址

        // 2、数组的克隆
        const c = [4, 3, 2, 1];
        const d = [...c];
        c[0] = 10;
        d[0] = 11;
        console.log(c, d, c === d); // [4, 3, 2, 1] [4, 3, 2, 1] false

        // 将伪数组转化为数组
        let divDoms = document.querySelectorAll('div');
        let divArrs = [...divDoms];
        console.log(divDoms, divArrs); //NodeList(3) [div, div, div] (3) [div, div, div]
    </script>
</body>

</html>
