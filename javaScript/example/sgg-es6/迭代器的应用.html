<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迭代器的应用</title>
</head>

<body>
    <script>
        const testObj = {
            name: 'amumu',
            arr: [1, 2, 3, 4, 5],
            [Symbol.iterator]() {
                let index = 0;
                return {
                    next: () => {
                        let result = {};
                        if (index < this.arr.length) {
                            result = { value: this.arr[index], done: false };
                            index++;
                        } else {
                            result = { value: undefined, done: true };
                        }
                        return result;
                    }
                }
            }
        }

        // 测试迭代器
        for (let v of testObj) {
            console.log(v);
        }
    </script>
</body>

</html>
