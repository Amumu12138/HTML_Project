        // 定义三种状态
        const PromistState = {
            // 等待
            PENDING: 'pending',
            // 完成
            FULFILLED: 'fulfilled',
            // 失败
            REJECTED: 'rejected',
        }
        // 手写Promise
        class MyPromise {
            // 定义promise状态
            state = PromistState.PENDING;
            // 定义结果
            result = undefined;
            // 失败原因
            reason = undefined;
            // 定义一个数组，存放异步任务
            onResolveCallback = [];
            onRejectedCallback = [];
            constructor(callback) {
                // 成功回调
                const resolve = (val) => {
                    if (this.state !== PromistState.PENDING) {
                        return;
                    }
                    this.state = PromistState.FULFILLED
                    this.result = val;
                    this.onResolveCallback.forEach(fn => fn())
                }

                // 失败回调
                const reject = (val) => {
                    if (this.state !== PromistState.PENDING) {
                        return;
                    }
                    this.state = PromistState.REJECTED
                    this.reason = val;
                    this.onRejectedCallback.forEach(fn => fn())
                }

                callback(resolve, reject)
            }

            then(onFulfilled, onRejected) {
                console.log('then called');

                // 返回new promise,支持链式调用
                return new MyPromise((resolve, reject) => {
                    console.log('then state', this.state);
                    // 成功回调,继续执行resolve方法
                    if (this.state === PromistState.FULFILLED) {
                        resolve(onFulfilled(this.result))
                    }

                    // 失败回调,继续执行reject方法
                    if (this.state === PromistState.REJECTED) {
                        if (!onRejected) {
                            reject(onFulfilled(this.reason))
                        } else {
                            reject(onRejected(this.reason))
                        }
                    }

                    // 等待状态,将回调方法保存在数组中
                    if (this.state === PromistState.PENDING) {
                        this.onResolveCallback.push(() => {
                            resolve(onFulfilled(this.result))
                        })

                        this.onRejectedCallback.push(() => {
                            if (!onRejected) {
                                reject(onFulfilled(this.reason))
                            } else {
                                reject(onRejected(this.reason))
                            }
                        })
                    }
                })

            }

            static all(promises) {
                console.log('all called');

                return new MyPromise((resolve, reject) => {
                    console.log(promises);
                    // 存储promise结果
                    const results = [];
                    let count = 0;
                    promises.forEach((item, index) => {
                        // 获取到每个promise然后执行
                        item.then(val => {
                            results[index] = val;
                            count++;
                            console.log(count, results);

                            if (count === promises.length) {
                                resolve(results)
                            }
                        }, err => {
                            reject(err)
                        })
                    })
                })
            }

            // 静态方法resolve
            static resolve(val) {
                return new MyPromise(resolve => resolve(val))
            }

            // 静态方法reject
            static reject(val) {
                return new MyPromise((resolve, reject) => reject(val))
            }
        }

        const myPromise = new MyPromise((resolve, reject) => {
            // resolve('success');

            setTimeout(function () {

                reject('setTimeout fail')
            }, 1000)

        myPromise.then(val => {

            return val;
        }, err => {
            console.log('调用失败', err);
            return err;
        }).then(val2 => {
