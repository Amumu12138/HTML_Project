<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<meta name="viewport"  content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="format-detection" content="telephone=no">
	<meta name="apple-mobile-web-app-capable" content="yes"/>
	<meta name="mobile-web-app-capable" content="yes"/>
	<meta name="full-screen" content="true"/>
	<meta name="screen-orientation" content="portrait"/>

	<title>无法访问该页面</title>

	<style type="text/css">
		html,body{
			width:100%;
			height:100%;
			background: #f1f1f1;
		}
		body {
			background-size: auto 100%;
		}

		.row {
			position: absolute;
			top: 30%;
			left: 40%;
		}
		.row>h1 {
			position: relative;
			top: 150px;
			left: 50px;
			font-weight: normal;
		}

		/* 容器 */
		.flex {
			display: -webkit-box !important;
			display: -moz-box !important;
			display: -ms-flexbox !important;
			display: -webkit-flex !important;
			display: flex !important;
			padding: 10px 0 0 10px;
			width: 50%;
			text-decoration: none;
		}

		.flex>p {
			position: absolute;
			left: 180px;
			top: -30px;
			font-weight: bold;
			font-size: 80px;
		}

		.img-wait {
			position: absolute;
			top: 30%;
			left: 20%;
		}

		.btn-back {
			position: relative;
			top: 150px;
			left: 150px;
			width: 30px;
			height: 100px;
			padding: 10px;
			background: #D82B25;
			color: #fff;
			border-radius: 5px;
			text-decoration: none;
		}
	</style>
</head>
<body>
<div class="row"> 
	<div class="flex">
		<img class="img-wait" src=/image/wait.png>
		<p>404</p>
	</div>
	<h1>你访问的页面不存在</h1>
	<a href="javascript:;" class="btn-back" onclick="onBack()">返回首页</a>
</div>
<script type="text/javascript">  
	function onBack() {
		window.location.href = "https://paojiao.cn";
	}
</script>
</body>
</html>
