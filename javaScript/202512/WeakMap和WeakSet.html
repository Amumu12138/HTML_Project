<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeakMap和WeakSet</title>
</head>

<body>
    <h1>WeakMap和WeakSet</h1>
    <script>
        // WeakMap、WeakSet都是弱引用类型
        const weakMap = new WeakMap();
        console.log(weakMap);
        // weakMap.set('123', '123')// 键不可以设置普通类型,只可以设置为对象
        weakMap.set({}, '123')
        console.log(weakMap);

        // Uncaught TypeError: WeakMap is not iterable => WeakMap不可迭代
        // for (let item of WeakMap) {
        //     console.log(item);

        // }

        const map = new Map([['name', 'name'], ['age', 12]])
        // map可正常迭代
        for (let item of map) {
            console.log(item); // ['name', name] ['age', 12]
        }

        const arr = [1, 2, 3]
        const set = new Set(arr);
        console.log(set);

        const objArr = [{ a: 1 }, { a: 2 }, { a: 3 }]
        // weakSet必须使用对象作为键元素
        const weakSet = new WeakSet(objArr);
        console.log(weakSet);

        // Set数据接口可正常迭代
        for (let item of set) {
            console.log('set item => ', item); // 1 2 3

        }
        // Uncaught TypeError: weakSet is not iterable=> WeakSet不可迭代
        // for (let item of weakSet) {
        //     console.log('weakSet item => ', item);

        // }
    </script>
</body>

</html>
