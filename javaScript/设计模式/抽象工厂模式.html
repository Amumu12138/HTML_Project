<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 抽象工厂模式: 并不直接生成实例,而是用于对产品类族的创建
        class User {
            constructor(name, role, pages) {
                this.name = name;
                this.role = role;
                this.pages = pages;
            }

            welcome() {
                console.log("welcome called", this.name);
            }

            dataShow() {
                throw new Error("抽象方法dataShow需要被实现")
            }
        }

        // 超级管理员
        class SuperAdmin extends User {
            constructor(name) {
                super(name, "superAmind", ["home", "user-mamage", "right-manage", "new-manage"])
            }

            dataShow() {
                console.log("SuperAdmin dataShow called");
            }

            addRight() {
                console.log("SuperAdmin addRight called");
            }

            addUser() {
                console.log("SuperAdmin addUser called");
            }
        }

        // 普通管理员
        class Admin extends User {
            constructor(name) {
                super(name, "Admin", ["home", "user-mamage", "new-manage"])
            }

            dataShow() {
                console.log("Admin dataShow called");
            }

            addUser() {
                console.log("Admin addUser called");
            }
        }

        // 编辑人员
        class Editor extends User {
            constructor(name) {
                super(name, "Editor", ["home", "new-manage"])
            }

            dataShow() {
                console.log("Editor dataShow called");
            }
        }

        function getAbstractUserFactory(role) {
            const roleObj = {
                'SuperAdmin': SuperAdmin,
                'Admin': Admin,
                'Editor': Editor,
            }

            return roleObj[role];
        }

        let userClass = getAbstractUserFactory("SuperAdmin");
        let aaa = new userClass("aaa");
        console.log(aaa);
        aaa.dataShow();
        aaa.welcome();
    </script>
</body>

</html>
