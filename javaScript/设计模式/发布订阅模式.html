<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 发布订阅 
        /**
         * PubSub 中央调度中心
         * publish 发布
         * subscribe 订阅
         */
        const PubSub = {
            list: [],
            publish(data) {
                this.list.forEach(item => item(data));
            },
            subscribe(fn) {
                this.list.push(fn)
            }
        }

        function testA(data) {
            console.log("testA data", data);
        }

        function testB(data) {
            console.log("testB data", data);
        }

        PubSub.subscribe(testA);
        PubSub.subscribe(testB);

        PubSub.publish("called");
        const PubSub02 = {
            message: {},
            pushlish(type, data) {
                if (!this.message[type]) return;

                this.message[type].forEach(item => item(data));
            },
            subscribe(type, cb) {
                if (!this.message[type]) {
                    this.message[type] = [cb];
                    return;
                }

                this.message[type].push(cb);
            },
            unsubscribe(type, cb = null) {
                if (!this.message[type]) return;

                if (!cb) {
                    this.message[type] = [];
                    return;
                }

                this.message[type] = this.message[type].filter(item => item !== cb);
            }
        }

        function testC(data) {
            console.log("testC", data);
        }

        PubSub02.subscribe("A", testA);
        PubSub02.subscribe("B", testB);
        PubSub02.subscribe("A", testC);

        PubSub02.pushlish("C", 111);
        PubSub02.pushlish("A", 222);
        PubSub02.pushlish("B", 333);

        PubSub02.unsubscribe("A");
        PubSub02.pushlish("A", 444);
        PubSub02.pushlish("B", 555);
    </script>
</body>

</html>
