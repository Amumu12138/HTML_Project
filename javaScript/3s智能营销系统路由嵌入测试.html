<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>
    <style>
        button {
            margin: 10px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
</head>

<body>
    <div id="app">
        <div class="btn-list">
            <button v-on:click="onChangeRoute(0)">单页</button>
            <button v-on:click="onChangeRoute(1)">客户管理</button>
            <button v-on:click="onChangeRoute(2)">智能客服</button>
            <button v-on:click="onChangeRoute(3)">线索管理</button>
            <button v-on:click="onChangeRoute(4)">数据报表</button>
            <button v-on:click="onChangeRoute(5)">系统设置</button>
        </div>
        <iframe :src="currentRoute" frameborder="0" width="100%" height="1000px"></iframe>
    </div>
    <script>
        let swicth = false;

        const vm = new Vue({
            el: "#app",
            data: {
                currentRoute: '',
                singlePage: swicth ? 'https://ssst.nsw99.com/singlePage' : 'http://localhost/singlePage',
                customMgr: swicth ? 'https://ssst.nsw99.com/custom-mgr-page' : 'http://localhost/custom-mgr-page',
                service: swicth ? 'https://ssst.nsw99.com/inquiry-page' : 'http://localhost/inquiry-page',
                clueMgr: swicth ? 'https://ssst.nsw99.com/clue-mgr-page' : 'http://localhost/clue-mgr-page',
                dataShow: swicth ? 'https://ssst.nsw99.com/data-show-page' : 'http://localhost/data-show-page',
                systemSetting: swicth ? 'https://ssst.nsw99.com/system-setting-page' : 'http://localhost/system-setting-page'
            },
            methods: {
                onChangeRoute(value) {
                    switch (value) {
                        case 0:
                            this.currentRoute = this.singlePage;
                            break;
                        case 1:
                            this.currentRoute = this.customMgr;
                            break;
                        case 2:
                            this.currentRoute = this.service;
                            break;
                        case 3:
                            this.currentRoute = this.clueMgr;
                            break;
                        case 4:
                            this.currentRoute = this.dataShow;
                            break;
                        case 5:
                            this.currentRoute = this.systemSetting;
                            break;
                        default: break;
                    }
                }
            },
            created() {
                this.onChangeRoute(1)
            }
        })
    </script>
</body>

</html>
