<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>use strict 严格模式使用</h1>
    <script>
        'use strict'
        console.log(this); //  window

        const add = {
            a: '111',
            b: () => {
                'use strict'
                console.log(this); // window
            }
        }
        add.b();

        const addCopy = {
            a: '111',
            b: function () {
                'use strict'
                console.log(this); //  {a: '111', b: ƒ}
            }
        }
        addCopy.b()
    </script>
</body>

</html>
