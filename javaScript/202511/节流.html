<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节流</title>
</head>

<body>
    <h1>节流</h1>
    <button class="btn">释放技能</button>
    <script>
        // 节流实现
        const throttle = (func, wait = 0) => {
            // 开启定时器,保存定时器id
            let timeId = null;

            return function (...args) {
                console.log(this, args, timeId);
                // 判断是否已开启定时器
                if (timeId) {
                    return;
                }

                timeId = setTimeout(() => {
                    // 定时器执行,timeId设置为空
                    func.apply(this, args)
                    clearTimeout(timeId);
                    timeId = null;
                }, wait)
            }

        }

        const handleClick = (e) => {
            console.log("handleClick value", e);
            e.target.disabled = true;
            // 3秒后释放按钮禁用状态
            setTimeout(() => {
                e.target.disabled = false;
            }, 3000)
        }

        const throttleFunc = throttle(handleClick, 500)

        document.querySelector('.btn').addEventListener('click', throttleFunc);
    </script>
</body>

</html>
