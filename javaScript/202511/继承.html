<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继承</title>
</head>

<body>
    <h1>继承</h1>
    <script>
        class Person {
            name = 'person'
            // 构造函数
            constructor(name) {
                this.name = name;
            }

            hello() {
                console.log('Person -> hello')
            }
        }

        class Student extends Person {
            age = 20
            #test = 'test 私有'
            static s = 'static 静态属性'

            constructor(name, age) {
                super(name) // 调用父类构造函数
                this.age = age
            }

            hi() {
                console.log('Student -> hi', this.#test)
            }

            static staticFun() {
                console.log('Student -> staticFun 静态方法')
            }

            #privateFun() {
                console.log('Student -> #privateFun 私有方法')
            }
        }

        const s = new Student('amumu', 18)
        console.log(s) // Student {name: 'amumu', age: 18}
        // console.log(s.#test) // Uncaught SyntaxError: Private field '#test' must be declared in an enclosing class 
        // s.$privateFun() //继承.html:50 Uncaught TypeError: s.$privateFun is not a function
    </script>
</body>

</html>
