<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5.3.3String</title>
</head>

<body>
    <script>
        // JavaScript字符
        let message = 'abcde';
        console.log(message.charAt(2), message.charCodeAt(2)); // c 99
        console.log(99 === 0x63); // true 十进制99等于十六进制0x63

        console.log(String.fromCharCode(97, 98, 55357, 56842, 100, 101)); //ab😊de
        let testStr = 'ab😊de';
        console.log(testStr.charAt(2), testStr.charAt(3), testStr.charAt(4)); // � � d
        console.log([...testStr]); //(5) ['a', 'b', '😊', 'd', 'e'] es6语法糖

        // 字符串操作方法
        let stringValue = 'hello world';
        // lo w   lo w     lo worl
        console.log(stringValue.slice(3, 7), stringValue.substring(3, 7), stringValue.substr(3, 7));
        // lo w    hel     ''(空字符串)
        console.log(stringValue.slice(3, -4), stringValue.substring(3, -4), stringValue.substr(3, -4));
        // 字符串位置方法    
        let str02 = 'hello world';
        console.log(str02.indexOf('o'), str02.lastIndexOf('o')); // 4  7

    </script>
</body>

</html>
