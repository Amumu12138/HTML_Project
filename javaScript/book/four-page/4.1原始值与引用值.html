<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.1原始值与引用值</title>
</head>

<body>
    <script>
        // 4.1.1 动态属性0
        let name1 = "Amumu";
        let name2 = new String('Amumu');
        console.log(name1, name2); // Amumu String {'Amumu'}
        name1.age = 22;
        name2.age = 22;
        console.log(name1.age, name2.age); // undefined 22
        console.log(typeof name1, typeof name2); // string object

        // 复制值
        let num1 = 10, num2 = num1; // 值类型复制
        console.log(num1, num2); // 10 10

        let obj1 = new Object(), obj2 = obj1; // 引用类型复制
        obj1.name = 'Amumu';
        console.log(obj1 === obj2, obj1.name, obj2.name); // true Amumu Amumu 

        // 4.1.3 传递参数
        function setName01(obj) {
            obj.name = 'AMumu';
        }
        let person01 = new Object();
        setName01(person01);
        console.log(person01.name); // AMumu

        function setName02(obj) {
            obj.name = 'ASDFG';
            obj = new Object();
            obj.name = "QWER";
        }
        let person02 = new Object();
        setName02(person02);
        console.log(person02.name); // ASDFG

        // 4.1.4 确定类型
        let person = new Object();
        console.log(person instanceof Object, typeof person); // true object
        let color = "red";
        console.log(color instanceof String, typeof color); // false string
        let colors = ['red', 'green', 'yellow']; // 数组原型为object
        console.log(colors instanceof Array, typeof colors); // false object

        // 4.2.1 作用域链增强

            with (location) {
                var url = href + qs;
            }

            return url;
        }
        function buildUrlLet() {
            let qs = '?debug=true';

            with (location) {
                let url = href + qs;
            }

            // buildUrlLet未给返回值,默认返回undefined
            // return url; // 报错 url在with之外未定义 
        }

        console.log(buildUrlVar(), buildUrlLet()); // url+debug=true undefined

        // 4.2.2 变量声明
        const o3 = Object.freeze({}); // Object.freeze() 让整个对象都不能被修改0 
        o3.name = 'Amumu';
        console.log(o3.name); // undefined

        // 标识符查找
        var color02 = 'red';
        function getColor02() {
            let color02 = 'blue';
            // 创建一个独立的块
            {
                let color02 = 'green';
                return color02;
            }
            return color02
        }

        console.log(getColor02()); // green
    </script>
</body>

</html>
