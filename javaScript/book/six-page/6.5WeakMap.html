<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6.5WeakMap</title>
</head>

<body>
    <script>
        // es6 新增的‘弱映射’集合类型. 弱映射中的键只能是Object或者继承自Object的类型
        const key1 = { id: 1 }, key2 = { id: 2 }

        const wm1 = new WeakMap([
            [key1, 'val1'],
            // ['asas', 'val2'] // 必须使用object类型作为键
        ]);
        console.log(wm1, wm1.has(key1), wm1.size); // WeakMap true undefined

        wm1.set(key2, 'val2');
        console.log(wm1, wm1.get(key1), wm1.get({ id: 1 })); // WeakMap 'val1', undefined
    </script>
</body>

</html>
