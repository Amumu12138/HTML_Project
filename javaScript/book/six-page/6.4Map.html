<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6.4Map</title>
</head>

<body>
    <script>
        // 基本API
        const m1 = new Map([
            ['kye1', 'val1'],
            ['kye2', 'val2'],
            ['kye3', 'val3']
        ]);

        console.log(m1.size); // 3

        const m2 = new Map([[]]);
        console.log(m2); // Map(1) {undefined => undefined}
        console.log(m2.has(undefined)); // true
        console.log(m2.get(undefined)); // undefined

        const m3 = new Map().set('key1', 'val1');
        m3.set('key2', 'val2').set('key3', 'val3');
        console.log(m3.size, m3); // 3 Map(3) {'key1' => 'val1', 'key2' => 'val2', 'key3' => 'val3'}


    </script>
</body>

</html>
