<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6.6Set</title>
</head>

<body>
    <script>
        // es6 新增的集合类型-Set, 在很多方面都像加强的Map
        const s1 = new Set(['val1', 'val2', 'val3']);
        console.log(s1, s1.size, s1.has('val1'), s1.has('Matt')); // Set 3 true false

        s1.add('Matt');
        console.log(s1, s1.has('Matt')); // Set true
        s1.clear();
        console.log(s1, s1.size); // Set 0

        const s2 = new Set(['val1', 'val2', 'val3']);
        // 利用values()方法迭代
        for (let value of s2.values()) {
            console.log(value); // val1 val2 val3
        }
        // 利用Symbol.iterator属性迭代
        for (let value of s2[Symbol.iterator]()) {
            console.log(value); // val1 val2 val3
        }
    </script>
</body>

</html>
