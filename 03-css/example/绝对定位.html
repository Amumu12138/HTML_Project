<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝对定位</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box-01,
        .gradeFather,
        .father,
        .son {
            text-align: center;
            width: 200px;
            height: 200px;
        }

        /* 靠body定位 */
        .box-01 {
            position: absolute;
            top: 100px;
            right: 100px;
            width: 200px;
            height: 200px;
            background-color: red;
            line-height: 200px;
        }

        .gradeFather {
            position: relative;
            width: 800px;
            height: 800px;
            background-color: hotpink;
            margin: 0 auto;
        }

        .father {
            /* position: relative; */
            top: 50px;
            left: 50px;
            width: 500px;
            height: 500px;
            background-color: skyblue;
        }

        .son {
            position: absolute;
            top: 0px;
            left: 0px;
            background-color: green;
        }
    </style>
</head>

<body>
    <!-- 祖先元素没有定位的情况 -->
    <div class="box-01">
        祖先元素没有定位的盒子
    </div>

    <!-- 靠祖先元素定位的情况 -->
    <div class="gradeFather">
        祖父盒子
        <div class="father">
            父亲盒子
            <div class="son">
                儿子盒子
            </div>
        </div>
    </div>

</body>

</html>
