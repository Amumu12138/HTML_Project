<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字体图标</title>
    <style>
        @font-face {
            font-family: 'iconfont';
            src: url('../../res/iconfont/font/iconfont.ttf') format('truetype');
        }

        .iconfont {
            font-family: "iconfont" !important;
            font-size: 16px;
            font-style: normal;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .red {
            color: red;
        }

        .font100 {
            font-size: 100px;
        }
    </style>
</head>

<body>
    <p style="text-align: center;">字体图标</p>
    <span class="iconfont">&#xe663;</span>
    <span class="iconfont red">&#xe666;</span>
    <span class="iconfont font100">&#xe670;</span>
</body>

</html>
