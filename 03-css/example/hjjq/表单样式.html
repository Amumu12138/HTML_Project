<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单样式</title>
    <style>
        input,
        textarea {
            /* 去除轮廓线 */
            outline: none;
        }

        textarea {
            /* 去除文本域拖拽 */
            resize: none;
        }
    </style>
</head>

<body>
    <p>表单样式</p>
    <input type="text" />
    <textarea name="" id="" cols="30" rows="10"></textarea>
</body>

</html>
