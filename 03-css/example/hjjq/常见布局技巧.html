<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见布局技巧</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        li {
            list-style: none;
        }

        /* 溢出文字省略 */
        .single-overflow {
            width: 200px;
            height: 40px;
            line-height: 40px;
            background-color: pink;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .more-text-overflow {
            width: 200px;
            height: 70px;
            background-color: skyblue;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        /* 常用布局技巧 */
        .margin-box ul li {
            float: left;
            height: 200px;
            width: 200px;
            border: 1px solid red;
            margin-left: -1px;
        }

        .margin-box ul li:hover {
            position: relative;
            z-index: 1;
            border: 1px solid blue;
        }

        .float-text {
            float: left;
            width: 100%;
            height: 200px;
            margin-top: 20px;
        }

        .pic {
            float: left;
            height: 200px;
            width: 200px;
            overflow: hidden;
        }

        .pic img {
            width: 100%;
        }

        .goods-triangle {
            position: absolute;
            top: 600px;
            width: 200px;
            height: 40px;
            line-height: 40px;
            margin-left: 5px;
            border-radius: 4px;
            border: 1px solid red;
        }

        .goods-triangle .current-money {
            display: inline-block;
            position: relative;
            width: 100px;
            height: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background-color: red;
            vertical-align: top;
        }

        .current-money i {
            position: absolute;
            top: 0;
            right: 0;
            width: 0;
            height: 0;
            border-color: transparent white transparent transparent;
            border-style: solid;
            border-width: 40px 20px 0 0;
        }

        .goods-triangle .origin-money {
            font-size: 12px;
            color: #ccc;
            margin-left: 5px;
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <p>溢出文字省略</p>
    <!-- 单行文字省略 -->
    <div class="single-overflow">
        djfkadklajfdklajdkfljaklsdfjakljdfklajdfklashdjkasbmnklndsklnvjkdn
    </div>
    <!-- 多行文字省略 -->
    <div class="more-text-overflow">
        的房间卡什么的看啦什么的v克拉苏打绿那是健康的v南京卡比女家卡女家卡萨诺的疯dfklasklak
    </div>
    <p>常见布局技巧</p>
    <!-- 1、margin负值运用 -->
    <div class="margin-box">
        <ul>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
            <li></li>
        </ul>
    </div>
    <!-- 2、文字围绕浮动元素 -->
    <div class="float-text">
        <div class="pic">
            <img src="../../res/images/panda.jpg" alt="">
        </div>
        <p>djfkadlfkamndjklnajkdnfasdklmfklmasklmasdjklfnaskl</p>
    </div>
    <!-- 3、行内块巧妙运用 -->
    <!-- 4、CSS三角强化 -->
    <div class="goods-triangle">
        <span class="current-money">¥ 1000
            <i></i>
        </span>
        <span class="origin-money">
            ¥ 2000
        </span>
    </div>
</body>

</html>
