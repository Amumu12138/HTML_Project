<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D转化示例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        li {
            list-style: none;
        }

        .image-box {
            float: left;
            margin: 10px;
            width: 200px;
            height: 100px;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            transition: all 0.4s;
        }

        .image-box:hover img {
            transform: scale(1.2);
        }

        .page-list {
            width: 100%;
        }

        .page-list ul li {
            float: left;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            margin: 10px;
            border: 1px solid black;
            border-radius: 50%;
            transition: all 0.4s;
        }

        .page-list ul li:hover {
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <p>实现2d转化之缩放效果</p>
    <div class="image-box">
        <img src="../../res/images/bg.jpg" alt="">
    </div>
    <div class="image-box">
        <img src="../../res/images/bg.jpg" alt="">
    </div>
    <div class="image-box">
        <img src="../../res/images/bg.jpg" alt="">
    </div>

    <div class="page-list">
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>7</li>
        </ul>
    </div>
</body>

</html>
