<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>两面盒子翻转案例</title>
    <style>
        body {
            text-align: center;
            perspective: 300px;
        }

        li {
            list-style: none;
        }

        .box {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 100px auto;
            transform-style: preserve-3d;
            transition: all 0.5s;
        }

        .box:hover {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 100%;
            text-align: center;
            line-height: 200px;
            color: white;
            border-radius: 50%;
        }

        .front {
            background-color: red;
            z-index: 1;
        }

        .back {
            background-color: green;
            transform: rotateY(180deg);
        }

        /* 3d导航栏 */
        ul li {
            float: left;
            margin: 20px;
            perspective: 400px;
        }

        .nav-3d-box {
            height: 100px;
            width: 200px;
            transform-style: preserve-3d;
            transition: all 0.5s;
            margin: 100px auto;
        }

        .nav-3d-box:hover {
            transform: rotateX(90deg);
        }

        .front-box,
        .bottom-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 100px;
            line-height: 100px;
        }

        .front-box {
            background-color: pink;
            z-index: 1;
            transform: translateZ(50px);
        }

        .bottom-box {
            background-color: purple;
            transform: translateY(50px) rotateX(-90deg);
        }

        /* 旋转木马 */
        .muma-box {
            perspective: 1000px;
        }

        .muma-box section {
            position: relative;
            height: 200px;
            width: 200px;
            margin: 100px auto;
            transform-style: preserve-3d;
            animation: rotate 10s linear infinite;
        }

        .muma-box section:hover {
            animation-play-state: paused;
        }

        @keyframes rotate {
            from {
                transform: rotateY(0);
            }

            to {
                transform: rotateY(360deg);
            }
        }

        section div {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: url('../../res/images/panda.jpg') no-repeat;
        }

        section div:nth-child(1) {
            transform: translateZ(300px);
        }

        section div:nth-child(2) {
            /* 先旋转再移动 */
            transform: rotateY(60deg) translateZ(300px);
        }

        section div:nth-child(3) {
            transform: rotateY(120deg) translateZ(300px);
        }

        section div:nth-child(4) {
            transform: rotateY(180deg) translateZ(300px);
        }

        section div:nth-child(5) {
            transform: rotateY(240deg) translateZ(300px);
        }

        section div:nth-child(6) {
            transform: rotateY(300deg) translateZ(300px);
        }
    </style>
</head>

<body>
    <p>两面翻转盒子</p>
    <div class="box">
        <div class="front">正面</div>
        <div class="back">背面</div>
    </div>
    <p>3D导航栏</p>
    <ul>
        <li>
            <div class="nav-3d-box">
                <div class="front-box">正面</div>
                <div class="bottom-box">底面</div>
            </div>
        </li>
        <li>
            <div class="nav-3d-box">
                <div class="front-box">正面</div>
                <div class="bottom-box">底面</div>
            </div>
        </li>
        <li>
            <div class="nav-3d-box">
                <div class="front-box">正面</div>
                <div class="bottom-box">底面</div>
            </div>
        </li>
        <li>
            <div class="nav-3d-box">
                <div class="front-box">正面</div>
                <div class="bottom-box">底面</div>
            </div>
        </li>
        <li>
            <div class="nav-3d-box">
                <div class="front-box">正面</div>
                <div class="bottom-box">底面</div>
            </div>
        </li>
        <br style="clear: both;" />
    </ul>

    <p>旋转木马</p>
    <div class="muma-box">
        <section>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </section>
    </div>

</body>

</html>
