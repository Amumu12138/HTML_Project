<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3 盒子模型和图片模糊</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            cursor: pointer;
        }

        .box {
            width: 200px;
            height: 200px;
            padding: 50px;
            border: 1px solid red;
        }

        .content-box {
            background-color: pink;
            box-sizing: content-box;
        }

        .border-box {
            background-color: greenyellow;
            box-sizing: border-box;
        }

        .image {
            filter: blur(5px);
        }

        .image:hover {
            filter: blur(0);
        }


        .clac-box {
            width: calc(100% - 50px);
            height: calc(100% / 2);
            background-color: red;
        }
    </style>
</head>

<body>
    <p>CSS3 盒子模型和图品模糊</p>
    <div class="content-box box">未处理盒子</div>
    <div class="border-box box">处理后盒子</div>

    <img class="image" src="../../res/images/panda.jpg" alt="">
    <p class="image">模糊图片和文字处理</p>

    <div class="clac-box">适应屏幕宽度拉伸</div>

</body>

</html>
