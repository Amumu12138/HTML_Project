<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        * {

        }

        /* 去除列表黑色小圆点 */
        li {
            list-style: none;
        }

        .box {
            width: 350px;
            height: 300px;
            border: 1px solid #ccc;
            margin: 100px auto;
        }

        .title {
            height: 32px;
            line-height: 32px;
            font-size: 14px;
            font-weight: 400;
            border-bottom: 1px dotted #ccc;
            padding-left: 15px;
        }

        .content {
            margin-top: 10px;
        }

        .content li a {
            text-decoration: none;
            font-size: 12px;
            color: #666;
            padding-left: 15px;
        }

        .content li a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="box">
        <h3 class="title">品优购快报</h3>

</body>

</html>
