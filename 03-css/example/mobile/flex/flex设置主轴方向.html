<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>felx设置主轴方向</title>
    <style>
        .flex-box {
            width: 800px;
            height: 300px;
            margin: 10px auto;
            background: pink;
        }

        .flex-row {
            /* 设置为弹性布局 */
            display: flex;
            /* 设置x轴为主轴 默认值 */
            flex-direction: row;
        }

        span {
            height: 100px;
            width: 100px;
            background: purple;
            margin: 10px;
        }

        .flex-column {
            display: flex;
            /* 设置y轴为主轴  */
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div class="flex-row flex-box">
        <span>1</span><span>2</span><span>3</span>
    </div>
    <div class="flex-column flex-box">
        <span>1</span><span>2</span><span>3</span>
    </div>
</body>

</html>
