<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子项flex属性使用</title>
    <style>
        .flex-children-box {
            display: flex;
            width: 80%;
            height: 300px;
            margin: 0 auto;
            background: pink;
        }

        .flex-children-box span {
            flex: 1;
            height: 100%;
            text-align: center;
            background: red;
        }

        /* 设置第一个子元素占两份，其余占一份 */
        .flex-children-box span:nth-child(1) {
            flex: 2;
            background: green;
        }

        /* 实现中间元素自动填充 */
        .flex-auto-container {
            display: flex;
            width: 80%;
            height: 300px;
            margin: 0 auto;
            background: pink;
        }

        .flex-auto-container .left {
            float: left;
            width: 100px;
            background-color: red;
        }

        .flex-auto-container .right {
            float: right;
            width: 100px;
            background-color: yellow;
        }


        .flex-auto-container .center {
            flex: 1;
            background-color: green;
        }
    </style>
</head>

<body>
    <div class="flex-children-box">
        <span>1</span><span>2</span><span>3</span><span>4</span>
    </div>

    <div class="flex-auto-container">
        <div class="left">左边</div>
        <div class="center">中间</div>
        <div class="right">右边</div>
    </div>
</body>

</html>
