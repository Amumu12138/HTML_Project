<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>响应式布局案例</title>
    <style>
        .container {
            height: 200px;
            margin: 0 auto;
            background-color: red;
        }

        /* 超小屏幕(手机，屏幕尺寸小于768px) 设置宽度为100% */
        @media screen and (max-width: 768px) {
            .container {
                width: 100%;
            }
        }

        /* 小屏幕(平板，屏幕尺寸大于等于768px) 设置宽度为750px */
        @media screen and (min-width: 768px) {
            .container {
                width: 750px;
            }
        }

        /* 中等屏幕(桌面显示器，大于等于992px) 设置宽度为970px */
        @media screen and (min-width: 768px) {
            .container {
                width: 970px;
            }
        }

        /* 大屏幕(大桌面显示器，大于1200px) 设置宽度为1170px */
        @media screen and (min-width: 1200px) {
            .container {
                width: 1170px;
            }
        }
    </style>
</head>

<body>
    <div class="container"></div>
</body>

</html>
