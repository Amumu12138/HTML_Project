<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rem单位</title>
    <style>
        html {
            font-size: 14px;
        }

        .parent {
            font-size: 12px;
        }

        .children {
            width: 10em;
            height: 10em;
            background-color: green;
        }

        .children-second {
            width: 10rem;
            height: 10rem;
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div style="float: left;" class="children"></div>
        <div style="float: left; margin: 0 10px;" class="children-second"></div>
    </div>
</body>

</html>
