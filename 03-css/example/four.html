<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS的元素显示模式</title>
    <style>
        .newMode {
            /* 增加链接<a>的触发范围 */
            display: block;
            height: 50px;
            width: 200px;
            background-color: red;
            text-decoration: none;
            text-align: center;

        }

        /* 小米-触控链接 */
        div a {
            display: block;
            width: 200px;
            height: 50px;
            text-decoration: none;
            background-color: #333;
            color: white;
            text-indent: 2em;
            line-height: 50px;
        }

        a:link {
            background-color: #333;
        }

        a:visited {
            background-color: #333;
        }

        a:hover {
            background-color: orange;
        }

        a:active {
            background-color: #333;
        }
    </style>
</head>

<body>
    <!-- 块级元素 -->
    <p>
        123
    </p>
    <!-- 行内元素 -->
    <!-- <a href=""><a href="">123</a></a> -->
    <i>123 倾斜</i>
    <em>321 倾斜</em>
    <br>
    <!-- 行内块元素 -->
    <input type="week" name="" id="">
    <input type="text">123

    <!-- 元素显示模式转换 -->
    <a class="newMode" href="#">显示元素转换1</a>
    <a class="newMode" href="">显示元素转换2</a>

    <!-- 小米侧边栏展示 -->
    <div>
        <a href="#">手机 电话卡</a>
        <a href="#">电视 盒子</a>
        <a href="#">笔记本 平板</a>
        <a href="#">出行 穿戴</a>
        <a href="#">智能 路由器</a>
        <a href="#">健康 儿童</a>
        <a href="#">耳机 音响</a>
    </div>
</body>

</html>
