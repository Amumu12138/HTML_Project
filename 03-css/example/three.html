<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css 测试3</title>
    <style>
        /* 后代选择器 */
        .nav ul li a {
            color: red;
        }

        /* div>ul {
            color: green;
            font-weight: bold;
            font-size: 20px;
        } */

        /* 子选择器 */
        .hot>a {
            color: red;
            text-decoration: none;
        }

        /* 并集选择器 */
        .one,
        p,
        .pig>li {
            color: pink;
        }

        /* 链接伪类 */
        a:link {
            color: grey;
        }

        a:visited {
            color: orange;
        }

        p:link {
            color: red;
        }

        p:visited {
            color: orange;
        }

        p:hover {
            color: skyblue;
        }

        p:active {
            color: green;
        }

        /* :focus 用于选取获得焦点的表单元素*/
        input:focus {
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="nav">
        <ul>
            我是ul
            <li><a href="#">AAA</a></li>
            <li><a href="#">BBB</a></li>
        </ul>
    </div>

    <div class="hot">
        <a href="#">大肘子</a>
        <ul>
            <li><a href="#">猪头</a></li>
            <li><a href="#">猪尾巴</a></li>
        </ul>
    </div>

    <div class="one">熊大
        <p>熊大大</p>
    </div>
    <div>光头强</div>
    <ul class="pig">
        <li>小猪佩奇</li>
    </ul>
    <p>熊二</p>

    <!-- 链接伪类 -->
    <a href="#">测试链接伪类</a>
    <br />
    <!-- 表单伪类 -->
    <input type="text">
</body>

</html>
