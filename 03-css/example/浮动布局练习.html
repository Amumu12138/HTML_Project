<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动布局练习</title>
    <style>
        .box {
            width: 1200px;
            height: 400px;
            background-color: red;
            margin: 0 auto;
        }

        .left {
            width: 400px;
            height: 400px;
            background-color: yellow;
            float: left;
        }

        .right {
            width: 800px;
            height: 400px;
            background-color: green;
            float: right;
        }

        * {
            padding: 0;
            margin: 0;
        }

        li {
            list-style: none;
        }

        .father {
            width: 1200px;
            height: 400px;
            background-color: grey;
            margin: 0 auto;
        }

        .father li {
            width: 200px;
            height: 400px;
            background-color: skyblue;
            float: left;
            margin-right: 50px;
            text-align: center;
            line-height: 400px;
        }

        .father .last {
            margin-right: 0;
        }

        .three {
            width: 1200px;
            height: 400px;
            background-color: slateblue;
            margin: 0 auto;
        }

        .three-left {
            width: 400px;
            height: 400px;
            background-color: pink;
            float: left;
            color: white;
            font-size: 20px;
            text-align: center;
            line-height: 400px;
        }

        .three-right {
            width: 800px;
            height: 400px;
            background-color: burlywood;
            float: right;
        }

        .three-right li {
            width: 180px;
            height: 180px;
            background-color: cadetblue;
            float: left;
            margin: 10px;
            text-align: center;
            line-height: 180px;
        }
    </style>
</head>

<body>
    <!-- 左右布局 -->
    <div class="box">
        <div class="left"></div>
        <div class="right"></div>
    </div>

    <!-- 水平布局 -->
    <ul class="father">
        <li>11</li>
        <li>12</li>
        <li>13</li>
        <li>14</li>
        <li class="last">15</li>
    </ul>

    <div class="three">
        <div class="three-left">左盒子</div>
        <ul class="three-right">
            <li>1</li>
            <li>2</li>
            <li>3</li>
            <li>4</li>
            <li>5</li>
            <li>6</li>
            <li>7</li>
            <li>8</li>
        </ul>
    </div>

</body>

</html>
