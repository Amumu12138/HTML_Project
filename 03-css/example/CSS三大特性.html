<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS三大特性</title>
    <link rel="stylesheet" href="../css/style02.css">
    <style>
        body {
            font: 12px/1.5 Microsoft YaHei;
        }

        .demo {
            color: red;
            font-size: 16px;
        }

        .demo-line-height {
            font-size: 20px;
        }

        /* 优先级 */
        ul li {
            /* 优先级权重：0001 + 0001 = 0002 */
            color: green;
        }

        li {
            /* 优先级权重：0001 */
            color: black;
        }

        .demo-scond-li {
            /* 优先级权重：0010 */
            color: skyblue;
            /* 加粗 */
            font-weight: 700;
        }

        #demo-three-li {
            /* 优先级权重：0100 */
            color: springgreen;
            font-size: 20px;
        }

        /* style="color:yellow;" 行内样式权重：1000 */
        .demo-five-li {
            /* 优先级权重：无穷大 */
            color: steelblue !important;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <div>123</div>
    <div>
        321
    </div>

    <div class="demo">
        <p>测试继承性Demo</p>
    </div>

    <!-- 测试行高继承性 -->
    <p class="demo-line-height">测试行高继承性</p>

    <!-- 测试优先级 -->
    <ul>
        <li>123</li>
        <li class="demo-scond-li">456</li>
        <li id="demo-three-li">789</li>
        <li class="demo-five-li">012</li>
    </ul>
</body>

</html>
