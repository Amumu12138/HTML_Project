<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>播放视频元素</title>
    <style>
        .video {
            position: relative;
            width: 400px;
            /* height: 400px; */
            background-color: white;
            margin: 0 auto;
        }

        .video img {
            width: 100%;
            height: 100%;
        }

        .mask {
            display: none;
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3) url('../res/images/video-play.png') no-repeat center/150px;
        }

        .video:hover .mask {
            cursor: pointer;
            display: block;
        }
    </style>
</head>

<div class="video">
    <div class="mask"></div>
    <img src="../res/images/bg.jpg" alt="视频">
</div>

</html>
