<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景线性渐变</title>
    <style>
        .background-linear-gradient {
            width: 200px;
            height: 200px;
            background: linear-gradient(left, skyblue, pink);
            background: -webkit-linear-gradient(left, skyblue, pink);
            background: -webkit-linear-gradient(left top, skyblue, pink);
        }
    </style>
</head>

<body>
    <div class="background-linear-gradient"></div>
</body>

</html>
