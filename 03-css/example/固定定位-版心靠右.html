<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>固定定位-版心靠右</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            width: 800px;
            height: 1000px;
            background-color: pink;
            text-align: center;
            margin: 0 auto;
        }

        .fixed-right-box {
            position: fixed;
            left: 50%;
            margin-left: 405px;
            width: 25px;
            height: 150px;
            background-color: skyblue;
        }
    </style>
</head>

<body>
    <div class="box">
        版心盒子
        <div class="fixed-right-box">
            靠右固定盒子
        </div>
    </div>

</body>

</html>
